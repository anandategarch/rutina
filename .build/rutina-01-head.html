<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF5EC">
<meta name="description" content="Rutina — konsep redesain aplikasi pelacak kebiasaan dan keuangan. Terang, hangat, dan penuh ilustrasi.">
<title>Rutina · Konsep Redesain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C05B3C'/%3E%3Cpath d='M32 47V27M32 30c-2-8-8-12-14-12 0 8 5 13 14 11zM32 36c2-8 8-12 14-12 0 8-5 13-14 11z' stroke='%23FFF7EC' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RUTINA · KONSEP "TERRA" — terang, hangat, tanpa warna gelap
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF5EC; --bg-deep:#F4EBDA;
  --surface:#FFFFFF; --surface-2:#FCF8F1; --cream:#F7EEDF;
  --line:#EBDFCC; --line-soft:#F2EADB;
  --ink:#3E2E22; --ink-2:#6B5A49; --ink-3:#9C8A74;
  --terra:#C05B3C; --terra-deep:#9E4529; --terra-soft:#F5DFD4; --terra-softer:#FAEEE6;
  --sage:#7C9B72; --sage-deep:#59794F; --sage-soft:#E7F0E0;
  --honey:#DCA43D; --honey-deep:#A87A22; --honey-soft:#F9ECD1;
  --peach:#F2C6A0; --rose:#D98A7E; --water:#7FB5A6;
  --shadow-sm:0 1px 2px rgba(62,46,34,.05);
  --shadow-md:0 2px 6px rgba(62,46,34,.05),0 14px 34px -10px rgba(62,46,34,.14);
  --shadow-lg:0 24px 64px -16px rgba(62,46,34,.28);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --sidebar-w:268px;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(var(--line-soft) 1px,transparent 1.2px);
  background-size:26px 26px;-webkit-font-smoothing:antialiased;line-height:1.55;
  min-height:100dvh;
}
::selection{background:var(--terra-soft);color:var(--terra-deep)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--terra);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex:none;display:block}
.ill{display:block;width:100%;height:auto}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- utilitas tipografi ---------- */
.h-serif{font-family:var(--font-display);font-weight:600;letter-spacing:-.015em;line-height:1.18}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}
.t-sub{font-size:13px;color:var(--ink-3);font-weight:500}
.t-num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- kerangka aplikasi ---------- */
.app{min-height:100dvh}
.main{min-height:100dvh;display:flex;flex-direction:column}
.view{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:26px 30px 44px}
.page{display:none}
.page.active{display:block;animation:pageIn .45s cubic-bezier(.2,.7,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head h1{font-size:clamp(26px,3.4vw,32px)}
.page-head .t-sub{margin-top:4px}
.appfooter{margin-top:auto;padding:18px 30px 24px;text-align:center;font-size:12px;color:var(--ink-3);font-weight:500}

/* ---------- sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:50;display:none;flex-direction:column;gap:6px;padding:24px 18px 20px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(140deg,var(--terra),var(--terra-deep));display:grid;place-items:center;color:#FFF7EC;box-shadow:0 6px 16px -6px rgba(158,69,41,.5)}
.brand-mark .ic{width:22px;height:22px}
.brand-name{font-size:21px}
.brand-sub{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px 6px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;color:var(--ink-2);transition:background .18s,color .18s;min-height:46px;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--terra-soft);color:var(--terra-deep)}
.nav-item.active::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:4px;height:24px;border-radius:0 4px 4px 0;background:var(--terra)}
.nav-item .ic{width:21px;height:21px}
.side-spacer{flex:1}
.side-card{position:relative;background:linear-gradient(150deg,#FDF4E4,#F8E9D2);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;overflow:hidden;margin:8px 0}
.side-card .ill{width:78px;position:absolute;right:-3px;top:-5px;opacity:.95}
.side-card-t{font-family:var(--font-display);font-size:16.5px;font-weight:700;color:var(--terra-deep)}
.side-card-s{font-size:11.5px;color:var(--ink-2);margin:3px 0 10px;line-height:1.45;max-width:150px}
.side-card .bar{height:8px}
.side-profile{display:flex;align-items:center;gap:11px;padding:12px 10px 2px;border-top:1px solid var(--line-soft);margin-top:8px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--terra-soft);color:var(--terra-deep);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:17px;flex:none;border:1.5px solid #F0D4C4}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;height:70px;padding:0 30px;background:color-mix(in srgb,var(--bg) 82%,#fff);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.tb-left{display:flex;align-items:center;gap:14px;min-width:0}
.tb-brand{display:none;align-items:center;gap:10px;font-family:var(--font-display);font-size:19px;font-weight:700}
.tb-brand .brand-mark{width:34px;height:34px;border-radius:11px}
.tb-brand .brand-mark .ic{width:18px;height:18px}
.tb-date{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-date b{color:var(--terra-deep)}
.tb-right{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill .ic{width:15px;height:15px}
.pill-streak{background:var(--terra-soft);color:var(--terra-deep)}
.icon-btn{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);transition:all .18s}
.icon-btn:hover{color:var(--terra-deep);border-color:var(--terra);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--terra);border:1.5px solid var(--surface)}

/* ---------- bottom nav (mobile) ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;align-items:stretch;gap:2px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 86%,#fff);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(62,46,34,.08)}
.bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;min-height:52px;border-radius:14px;color:var(--ink-3);font-size:10px;font-weight:700;transition:color .18s}
.bn-item .ic{width:21px;height:21px}
.bn-item.active{color:var(--terra-deep)}
.bn-item.active .ic{transform:translateY(-1px) scale(1.06)}

/* ---------- kartu & grid ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-head h3{font-size:16.5px}
.card-head .t-sub{font-size:12px;margin-top:2px}
.grid{display:grid;gap:18px}
.row{display:flex;flex-direction:column;gap:18px}
.link-btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--terra-deep);padding:6px 4px;border-radius:8px;transition:gap .18s}
.link-btn:hover{gap:8px}
.link-btn .ic{width:15px;height:15px}

/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:700;font-size:14px;transition:all .18s;min-height:46px;padding:0 22px;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--terra);color:#FFF7EC;box-shadow:0 8px 20px -8px rgba(158,69,41,.55)}
.btn-primary:hover{background:var(--terra-deep);transform:translateY(-1.5px);box-shadow:0 12px 26px -8px rgba(158,69,41,.6)}
.btn-primary:active{transform:none}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--terra);color:var(--terra-deep)}
.btn-sm{min-height:40px;padding:0 16px;font-size:13px}

/* ---------- chip & segmented ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2);transition:all .18s;min-height:37px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--terra);color:var(--terra-deep)}
.chip.active{background:var(--terra);border-color:var(--terra);color:#FFF7EC}
.seg{display:flex;background:var(--bg-deep);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2);padding:0 16px;transition:all .18s}
.seg button.active{background:var(--surface);color:var(--terra-deep);box-shadow:var(--shadow-sm)}

/* ---------- hero ringkasan ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--line);background:linear-gradient(135deg,#FDF6E9 0%,#F8EAD6 58%,#F6E3CF 100%);box-shadow:var(--shadow-sm);display:grid;grid-template-columns:1.05fr .95fr;gap:8px;padding:30px 34px;margin-bottom:20px}
.hero::after{content:"";position:absolute;right:-70px;bottom:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,rgba(220,164,61,.16),transparent)}
.hero-body{display:flex;flex-direction:column;gap:16px;min-width:0;position:relative;z-index:1}
.hero h2{font-size:clamp(21px,2.6vw,26px);max-width:340px}
.hero-ring{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring-wrap{position:relative;width:138px;height:138px;flex:none}
.ring-wrap svg{width:100%;height:100%;display:block}
.ring-fg{transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.ring-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.ring-info .big{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--terra-deep);line-height:1.05}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px}
.hero-ill{position:relative;z-index:1;align-self:center;width:100%;max-width:505px;filter:drop-shadow(0 14px 20px rgba(62,46,34,.10))}
.hero-quote{position:absolute;left:-6px;bottom:-10px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:11.5px;font-weight:700;color:var(--ink-2);box-shadow:var(--shadow-md);display:flex;gap:7px;align-items:center;transform:rotate(-2.5deg)}
.hero-quote .ic{width:14px;height:14px;color:var(--sage-deep)}

/* ---------- kartu statistik ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:18px 20px}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.stat-ic .ic{width:19px;height:19px}
.stat-ic.terra{background:var(--terra-soft);color:var(--terra-deep)}
.stat-ic.sage{background:var(--sage-soft);color:var(--sage-deep)}
.stat-ic.honey{background:var(--honey-soft);color:var(--honey-deep)}
.stat .num{font-family:var(--font-display);font-size:25px;font-weight:700;line-height:1.1}
.stat .num small{font-size:14px;font-weight:600;color:var(--ink-2);font-family:var(--font-body)}
.stat .lbl{font-size:12px;font-weight:700;color:var(--ink-2)}
.stat .sub{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px;font-weight:600}
.stat .sub .ic{width:13px;height:13px}
.up{color:var(--sage-deep)}.down{color:var(--terra-deep)}
.stat .ill-deco{position:absolute;right:-8px;bottom:-13px;width:84px;opacity:.85;pointer-events:none}
.spark{width:100%;height:30px;display:block;margin-top:2px}

/* ---------- agenda hari ini ---------- */
.agenda-list{display:flex;flex-direction:column;gap:8px}
.agenda-row{display:grid;grid-template-columns:54px 52px 1fr auto auto;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1px solid var(--line-soft);background:var(--surface-2);transition:all .2s}
.agenda-row:hover{border-color:#E4D2BC;background:#F8EFDF}
.agenda-row.done{background:linear-gradient(90deg,var(--terra-softer),transparent 70%);border-color:#F3E2D5}
.time-chip{min-width:54px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:6px 6px;border-radius:10px}
.spot{width:52px;height:52px;border-radius:50%;background:var(--cream);border:1px solid var(--line-soft);display:grid;place-items:center;flex:none;overflow:hidden}
.spot .ill{width:44px}
.agenda-name{font-size:14.5px;font-weight:700;line-height:1.25}
.agenda-row.done .agenda-name{color:var(--ink-2)}
.agenda-meta{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px;flex-wrap:wrap}
.cat-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.streak-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--terra-deep);background:var(--terra-soft);padding:4px 9px;border-radius:999px}
.streak-pill .ic{width:12px;height:12px}
.btn-check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;transition:all .2s;position:relative;flex:none}
.btn-check:hover{border-color:var(--terra);transform:scale(1.06)}
.btn-check.done{background:var(--terra);border-color:var(--terra);color:#FFF7EC;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.btn-check .ic{width:19px;height:19px}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.counter{display:inline-flex;align-items:center;gap:7px}
.counter button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-2);transition:all .15s}
.counter button:hover{border-color:var(--terra);color:var(--terra-deep)}
.counter button .ic{width:13px;height:13px}
.counter b{font-size:12.5px;font-weight:800;min-width:34px;text-align:center;color:#4E8273}
.agenda-note{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 15px;border-radius:14px;background:var(--terra-softer);border:1px dashed #ECCBB6;font-size:12.5px;font-weight:600;color:var(--terra-deep)}
.agenda-note .ic{width:17px;height:17px;flex:none}

/* ---------- bar progress ---------- */
.bar{height:10px;border-radius:99px;background:var(--bg-deep);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sage);width:0;transition:width 1s cubic-bezier(.25,.8,.3,1)}
.bar.slate i{background:var(--terra)}
.bar.warna-honey i{background:var(--honey)}

/* ---------- arus kas ---------- */
.legend{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3.5px;display:inline-block}
.cf-total{display:flex;gap:10px;margin-top:14px}
.cf-total>div{flex:1;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-soft)}
.cf-total .ic{width:17px;height:17px}
.cf-total b{font-size:13.5px;display:block}
.cf-total small{font-size:10.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}

/* ---------- mini anggaran ---------- */
.mini-budget{display:flex;flex-direction:column;gap:13px}
.mb-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.mb-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.mb-ic .ic{width:17px;height:17px}
.mb-row .bar{height:8px;margin-top:5px}
.mb-info{min-width:0}
.mb-info b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-amt{font-size:11px;color:var(--ink-3);font-weight:700;white-space:nowrap}

/* ---------- tip kartu ---------- */
.tip-card{position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;padding:20px}
.tip-card .ill{width:104px;flex:none}
.tip-card b{font-family:var(--font-display);font-size:15.5px;display:block;margin-bottom:4px}
.tip-card p{font-size:12.5px;color:var(--ink-2);line-height:1.55}

/* ---------- halaman kebiasaan ---------- */
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.mini-stat{display:flex;align-items:center;gap:13px;padding:15px 18px}
.mini-stat .spot{width:46px;height:46px}
.mini-stat .spot .ill{width:38px}
.mini-stat .num{font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1}
.mini-stat .lbl{font-size:11px;color:var(--ink-3);font-weight:700;margin-top:3px}
.heatmap-wrap{overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hm-flex{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.hm-side{flex:0 0 250px;display:flex;flex-direction:column;gap:4px}
.hm-side .find-item{padding:10px}
@media(max-width:900px){.hm-side{flex-basis:100%}}
.hm-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3.5px;width:max-content}
.hm-cell{width:13px;height:13px;border-radius:3.5px;background:#F1E6D4}
.hm-cell.l1{background:#F0CDBB}.hm-cell.l2{background:#E3A184}.hm-cell.l3{background:#C05B3C}
.hm-cell.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--terra)}
.hm-months{display:grid;grid-auto-flow:column;gap:3.5px;width:max-content;margin-bottom:6px}
.hm-months span{font-size:9.5px;font-weight:800;color:var(--ink-3);width:13px;overflow:visible;white-space:nowrap}
.hm-legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);font-weight:700}
.hm-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.habit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
