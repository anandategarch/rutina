<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Laporan mingguan dengan grafik batang menaik">
  <!-- Definisi gradien lokal -->
  <defs>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- L1: latar lingkaran slate -->
  <circle cx="48" cy="48" r="46" fill="#F1F5F9"/>
  <circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2: bayangan tanah -->
  <ellipse cx="48" cy="79" rx="22" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- L3: subjek utama, dokumen dengan sudut terlipat dan tiga batang -->
  <path d="M30 20h36c2.2 0 4 1.8 4 4v40l-12 12H30c-2.2 0-4-1.8-4-4V24c0-2.2 1.8-4 4-4z" fill="#FFFFFF"/>
  <path d="M30 20h36c2.2 0 4 1.8 4 4v40l-12 12H30c-2.2 0-4-1.8-4-4V24c0-2.2 1.8-4 4-4z" fill="url(#g-bghigh)"/>
  <path d="M70 64l-12 12h8c2.2 0 4-1.8 4-4v-8z" fill="#CBD5E1"/>
  <rect x="32" y="56" width="8" height="8" rx="2" fill="url(#g-em)"/>
  <rect x="42.5" y="50" width="8" height="14" rx="2" fill="url(#g-amb)"/>
  <rect x="53" y="44" width="8" height="20" rx="2" fill="url(#g-sky)"/>
  <path d="M32 29h15" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M32 35.5h22" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- L4: kilau putih pada tepi dokumen dan batang -->
  <path d="M33 19.8h12" stroke="#FFFFFF" stroke-width="2.2" opacity=".5" stroke-linecap="round"/>
  <path d="M25.8 33v8" stroke="#FFFFFF" stroke-width="2.2" opacity=".5" stroke-linecap="round"/>
  <path d="M55 46.5v6" stroke="#FFFFFF" stroke-width="2" opacity=".5" stroke-linecap="round"/>
  <!-- L5: aksen kecil, panah kenaikan dan titik -->
  <path d="M50 33l9-9" stroke="#10B981" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M61 22.5l-5 .5 3.8 3.5z" fill="#10B981"/>
  <circle cx="75" cy="42" r="3" fill="#38BDF8"/>
  <!-- L6: kilau bintang -->
  <path d="M77 21l1.1 3 3 1.1-3 1.1-1.1 3-1.1-3-3-1.1 3-1.1z" fill="#FBBF24"/>
</svg>
