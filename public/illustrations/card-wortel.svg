<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · WORTEL — akar yang tumbuh dalam & kerapian: kebiasaan rumah tangga
       berakar pelan-pelan sampai rapi (kartu kebiasaan: kerapian & rumah) -->
  <defs>
    <radialGradient id="w-wr" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FFEDD5" stop-opacity=".58"/>
      <stop offset=".45" stop-color="#FFF7E3" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FFF7E3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bd-wr" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset=".6" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- cuci warna kebun sayur di sudut -->
  <rect width="180" height="170" fill="url(#w-wr)"/>

  <!-- wortel utama tumbuh dari sudut kanan-atas, meruncing turun ke dalam
       (transform dikalibrasi audit getBBox: semua geometri dalam viewBox) -->
  <g transform="translate(137 45) rotate(26)">
    <!-- daun pohon wortel (frond) menjulur ke sudut -->
    <g fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round">
      <path d="M0 6C-2 -8 -6 -18 -14 -24" opacity=".9"/>
      <path d="M0 6C2 -8 6 -20 14 -26" opacity=".9"/>
      <path d="M0 6C0 -10 1 -22 2 -32" opacity=".9"/>
    </g>
    <g fill="#A7F3D0" stroke="#059669" stroke-width=".9" stroke-linejoin="round">
      <path d="M-14 -24C-20 -26 -26 -24 -28 -18C-24 -14 -18 -15 -14 -19Z"/>
      <path d="M14 -26C20 -28 26 -26 28 -20C24 -16 18 -17 14 -21Z"/>
      <path d="M2 -32C-2 -36 -8 -36 -11 -31C-7 -27 -2 -27 2 -29Z"/>
      <path d="M-6 -14C-11 -16 -12 -22 -9 -25C-5 -22 -4 -18 -6 -14Z" opacity=".85"/>
      <path d="M7 -19C12 -21 14 -27 11 -30C7 -26 6 -22 7 -19Z" opacity=".85"/>
    </g>
    <!-- badan wortel meruncing -->
    <path d="M-7 6C-8 24 -7 48 -3 66C-1.5 73 1.5 73 3 66C7 48 8 24 7 6C4.6 2.2 -4.6 2.2 -7 6Z" fill="url(#bd-wr)" stroke="#EA580C" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- alur melintang wortel -->
    <g fill="none" stroke="#EA580C" stroke-width="1" stroke-linecap="round" opacity=".5">
      <path d="M-6.4 20C-3 22.4 3 22.4 6.4 20"/>
      <path d="M-6.2 34C-3 36.4 3 36.4 6.2 34"/>
      <path d="M-5.2 48C-2.6 50.4 2.6 50.4 5.2 48"/>
      <path d="M-3.8 60C-1.6 62 .2 62 1.6 60"/>
    </g>
  </g>

  <!-- wortel kecil sahabat di bawahnya -->
  <g transform="translate(112 54) rotate(34) scale(.5)">
    <path d="M-7 6C-8 24 -7 48 -3 66C-1.5 73 1.5 73 3 66C7 48 8 24 7 6C4.6 2.2 -4.6 2.2 -7 6Z" fill="#FDBA74" stroke="#EA580C" stroke-width="1.6" stroke-linejoin="round"/>
    <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round">
      <path d="M0 6C-2 -8 -5 -16 -10 -20"/>
      <path d="M0 6C2 -8 5 -16 10 -20"/>
    </g>
  </g>

  <!-- alur tanah tempat akar tumbuh -->
  <path d="M64 8C96 12 124 28 146 50C156 60 164 68 170 76" fill="none" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round" opacity=".72"/>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="66" cy="12" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="66" cy="12" r="2.6" fill="#FDE68A"/>

  <!-- percik -->
  <g>
    <circle cx="172" cy="94" r="2.6" fill="#FBBF24"/>
    <circle cx="176" cy="86" r="2.2" fill="#FB923C"/>
    <circle cx="165" cy="106" r="2" fill="#A7F3D0" opacity=".9"/>
    <path d="M96 44l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
