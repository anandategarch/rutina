<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Teh — waktu minum teh yang tenang</title>
  <defs>
    <linearGradient id="g-amb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="g-em2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7B8"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema amber -->
  <circle cx="48" cy="48" r="46" fill="#FEF3C7"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="76" rx="24" ry="4" fill="#0F172A" opacity=".07"/>
  <!-- uap teh -->
  <path d="M42 16c-3 4 3 6 0 10M54 16c-3 4 3 6 0 10" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".8"/>
  <!-- L3 cangkir -->
  <path d="M24 44h48c0 14-10.7 23-24 23s-24-9-24-23z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M28 48c8 4 32 4 40 0" stroke="#FFFFFF" stroke-width="2.5" opacity=".5" stroke-linecap="round" fill="none"/>
  <!-- permukaan teh -->
  <path d="M27 44h42c0 3-1.5 5.5-3.6 7.2-4.5-3.4-11-2.2-14.4 1.3-3.4-3.5-9.9-4.7-14.4-1.3C28.5 49.5 27 47 27 44z" fill="url(#g-amb2)"/>
  <!-- kantong teh -->
  <path d="M53 27h9l-2 8h-5z" fill="url(#g-em2)"/>
  <path d="M57.5 35v5" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M53 27h9" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <!-- pegangan cangkir -->
  <path d="M72 48c7-1 11 3 10 8-.8 4-5 6-9 5.5" stroke="#E2E8F0" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- L4 kilau cangkir -->
  <path d="M30 58c4 4 10 6.5 16 7" stroke="#FFFFFF" stroke-width="2.5" opacity=".45" fill="none" stroke-linecap="round"/>
  <!-- tatakan -->
  <path d="M30 72h36" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- L5 daun teh -->
  <path d="M24 30c-1.5-5 1.5-8.5 6-8.5.5 4.5-2.5 8-6 8.5z" fill="#6EE7B7"/>
  <path d="M24.5 29.5L29 22.5" stroke="#047857" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>
  <!-- L6 bintang kilau -->
  <path d="M74 28l1.3 3.4 3.4 1.3-3.4 1.3L74 37.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
