<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Gitar — kebiasaan bermain musik</title>
  <defs>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema peach -->
  <circle cx="48" cy="48" r="46" fill="#FFEDD5"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="44" cy="78" rx="22" ry="4" fill="#0F172A" opacity=".07"/>
  <!-- L3 badan gitar -->
  <path d="M40 34c-12 0-21 8-21 19 0 8 5 13 11 13 3.5 0 5.5-1.5 8-1.5s4.5 1.5 8 1.5c6 0 11-5 11-13 0-11-9-19-17-19z" fill="url(#g-amb)"/>
  <!-- L4 kilau badan -->
  <path d="M27 46c1.5-6 6-10 11-11" stroke="#FFFFFF" stroke-width="2.5" opacity=".4" fill="none" stroke-linecap="round"/>
  <!-- lubang suara & jembatan -->
  <circle cx="40" cy="53" r="8" fill="#B45309"/>
  <circle cx="40" cy="53" r="5.5" fill="#1E293B"/>
  <path d="M32 66h16" stroke="#B45309" stroke-width="3.5" stroke-linecap="round"/>
  <!-- senar -->
  <path d="M36.5 49.5h7M35.8 52h8.4M35.8 55h8.4M36.5 57.5h7" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- leher & kepala -->
  <rect x="46.5" y="14" width="11" height="34" rx="4" transform="rotate(24 52 31)" fill="#B45309"/>
  <rect x="52.5" y="10" width="11" height="12" rx="4" transform="rotate(24 58 16)" fill="#1E293B"/>
  <circle cx="55" cy="12" r="1.4" fill="#FDE68A"/><circle cx="59.5" cy="14" r="1.4" fill="#FDE68A"/><circle cx="64" cy="16" r="1.4" fill="#FDE68A"/>
  <!-- L5 nota musik -->
  <circle cx="74" cy="62" r="4" fill="url(#g-em)"/>
  <path d="M77.5 62V48l6 2.5" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- L6 bintang kilau -->
  <path d="M24 26l1.3 3.4 3.4 1.3-3.4 1.3L24 35.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
