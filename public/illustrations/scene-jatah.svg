    <linearGradient id="tetes" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/><stop offset=".6" stop-color="#7DD3FC"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="daunKiri" x1=".15" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".42" stop-color="#4ADE80"/><stop offset=".8" stop-color="#16A34A"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="daunKanan" x1=".85" y1="0" x2=".45" y2="1">
