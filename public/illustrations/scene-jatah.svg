<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 130" fill="none" role="img" aria-label="Ember penyiraman meneteskan koin ke pot tunas">
  <!-- Rutina · jatah siram — vektor semi-realistis: ember metalik meneteskan koin ke pot tunas berdaun -->
  <defs>
    <linearGradient id="kaleng" x1=".05" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#4ADE80"/><stop offset=".45" stop-color="#34D399"/><stop offset=".8" stop-color="#22C55E"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="bibir" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="corong" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="pot" x1=".05" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FDBA74"/><stop offset=".45" stop-color="#F59E0B"/><stop offset=".8" stop-color="#D97706"/><stop offset="1" stop-color="#B45309"/>
    </linearGradient>
