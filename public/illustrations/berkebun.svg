<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Berkebun — menyiram tanaman</title>
  <defs>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="g-em2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7B8"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
    <linearGradient id="g-org" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema emerald -->
  <circle cx="48" cy="48" r="46" fill="#ECFDF5"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="46" cy="80" rx="24" ry="4" fill="#0F172A" opacity=".07"/>
  <!-- L3 penyiram air -->
  <path d="M57 34c0-8 14-8 14 0" stroke="url(#g-sky)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <rect x="50" y="34" width="28" height="26" rx="7" fill="url(#g-sky)"/>
  <path d="M55 39v14" stroke="#FFFFFF" stroke-width="2.5" opacity=".4" stroke-linecap="round" fill="none"/>
  <path d="M54 42L36 53l4 7 18-11z" fill="url(#g-sky)"/>
  <!-- L4 tetesan air jatuh ke tanaman -->
  <circle cx="31" cy="60" r="2" fill="#38BDF8"/><circle cx="27" cy="65" r="2.3" fill="#38BDF8"/><circle cx="33" cy="68" r="1.8" fill="#38BDF8"/>
  <!-- tunas yang disiram -->
  <path d="M24 68V54" stroke="#047857" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M24.5 56c-2-6.5-7.5-9-13-8 .5 6.5 7 10.5 13 8z" fill="url(#g-em2)"/>
  <path d="M25 52c2.5-6.5 8-9 13.5-7.5-.5 6.5-7 10.5-13.5 7.5z" fill="url(#g-em)"/>
  <!-- pot -->
  <path d="M17 68h15l-2 10H19z" fill="url(#g-org)"/>
  <rect x="15.5" y="66" width="18" height="4.5" rx="2" fill="#FB923C"/>
  <!-- L6 bintang kilau -->
  <path d="M70 20l1.4 3.6 3.6 1.4-3.6 1.4L70 30.4l-1.4-3.6-3.6-1.4 3.6-1.4z" fill="#FBBF24"/>
  <circle cx="46" cy="26" r="3" fill="#10B981"/>
</svg>
