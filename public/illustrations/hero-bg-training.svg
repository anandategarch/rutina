<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" fill="none" role="img" aria-label="Barbel daun di atas lintasan dengan percik energi">
  <defs>
    <linearGradient id="hgT-bar" x1="150" y1="90" x2="310" y2="150" gradientUnits="userSpaceOnUse"><stop stop-color="#9D7654"/><stop offset="1" stop-color="#654A39"/></linearGradient>
    <linearGradient id="hgT-plate" x1="120" y1="90" x2="180" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#8FB476"/><stop offset="1" stop-color="#3F704B"/></linearGradient>
    <linearGradient id="hgT-plate2" x1="290" y1="90" x2="350" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#A8C58B"/><stop offset="1" stop-color="#477C51"/></linearGradient>
    <linearGradient id="hgT-leaf" x1="40" y1="120" x2="100" y2="196" gradientUnits="userSpaceOnUse"><stop stop-color="#9DBF7B"/><stop offset="1" stop-color="#477C51"/></linearGradient>
  </defs>
  <ellipse cx="230" cy="206" rx="180" ry="8" fill="#456C4D" opacity=".11"/>
  <!-- lintasan -->
  <path d="M30 196c70-12 140-12 210 0 70 12 140 10 190-4" stroke="#8EAE78" stroke-width="4" stroke-linecap="round" opacity=".55" stroke-dasharray="2 12"/>
  <!-- barbel -->
  <g>
    <rect x="168" y="112" width="124" height="13" rx="6.5" fill="url(#hgT-bar)"/>
    <path d="M150 92h34v58c0 6-4 10-10 10h-14c-6 0-10-4-10-10Z" fill="url(#hgT-plate)"/>
    <rect x="142" y="84" width="50" height="16" rx="8" fill="#75A56C"/>
    <path d="M276 92h34v58c0 6-4 10-10 10h-14c-6 0-10-4-10-10Z" fill="url(#hgT-plate2)"/>
    <rect x="268" y="84" width="50" height="16" rx="8" fill="#8FB476"/>
    <!-- daun di gagang -->
    <path d="M230 112v-24" stroke="#477B56" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M230 98c-10-1-13-7-8-11 8 1 11 6 8 11Z" fill="#A8C58B"/>
  </g>
  <!-- percik energi -->
  <g stroke="#6EE7B7" stroke-width="0" fill="#A8C58B">
    <path d="M356 76c-2-10 4-16 12-15 2 9-4 15-12 15Z"/>
    <path d="M110 70c9-4 16 0 17 8-8 4-15 1-17-8Z" fill="#9DBF7B"/>
  </g>
  <path d="M368 132l2 6.4 6.4 2-6.4 2-2 6.4-2-6.4-6.4-2 6.4-2Z" fill="#EDC77F"/>
  <circle cx="388" cy="86" r="4" fill="#EDC77F" opacity=".9"/>
  <circle cx="96" cy="150" r="4.5" fill="#E9AD91" opacity=".85"/>
  <!-- daun pelari kiri -->
  <g>
    <path d="M70 206v-44" stroke="#5C895E" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 184c18-2 24-14 14-24-14 3-19 12-14 24Z" fill="url(#hgT-leaf)"/>
    <path d="M68 172c-3-12 5-18 15-13-2 10-8 15-15 13Z" fill="#A8C58B"/>
  </g>
  <path d="M418 190c8-6 18-6 26 0" stroke="#8EAE78" stroke-width="3" stroke-linecap="round" opacity=".5"/>
</svg>
