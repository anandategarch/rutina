<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Dana tumbuh — koin yang berkecambah</title>
  <defs>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <linearGradient id="g-em2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7B8"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema amber -->
  <circle cx="48" cy="48" r="46" fill="#FEF3C7"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="46" cy="76" rx="24" ry="4" fill="#0F172A" opacity=".07"/>
  <!-- L3 tumpukan koin -->
  <ellipse cx="46" cy="72" rx="20" ry="7" fill="#B45309"/>
  <ellipse cx="46" cy="69" rx="20" ry="7" fill="url(#g-amb)"/>
  <ellipse cx="46" cy="58" rx="20" ry="7" fill="#B45309"/>
  <ellipse cx="46" cy="55" rx="20" ry="7" fill="url(#g-amb)"/>
  <ellipse cx="46" cy="44" rx="20" ry="7" fill="#B45309"/>
  <ellipse cx="46" cy="41" rx="20" ry="7" fill="url(#g-amb)"/>
  <!-- L4 kilau tumpukan -->
  <path d="M32 39.5c4-2.5 24-2.5 28 0" stroke="#FFFFFF" stroke-width="2" opacity=".45" fill="none" stroke-linecap="round"/>
  <!-- kecambah tumbuh dari koin teratas -->
  <path d="M46 38c0-5 .5-9 1-12" stroke="#047857" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M46.5 28c-2.5-6-8-8-13.5-6.5.5 6 8 9.5 13.5 6.5z" fill="url(#g-em2)"/>
  <path d="M47.5 25c2.5-5.5 7-7 12-5.5-.5 5.5-7 8.5-12 5.5z" fill="#6EE7B7"/>
  <!-- panah pertumbuhan -->
  <path d="M68 40l5-5m0 0h-4.5m4.5 0v4.5" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- koin melayang -->
  <circle cx="70" cy="64" r="5.5" fill="url(#g-amb)" stroke="#B45309" stroke-width="1.8"/>
  <path d="M67.8 62a5.5 5.5 0 0 1 3-1" stroke="#FFFFFF" stroke-width="1.6" opacity=".6" fill="none" stroke-linecap="round"/>
  <!-- L6 bintang kilau -->
  <path d="M26 22l1.3 3.4 3.4 1.3-3.4 1.3L26 31.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
  <circle cx="62" cy="54" r="2.5" fill="#F59E0B"/>
</svg>
