<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Peregangan — peregangan tubuh</title>
  <defs>
    <linearGradient id="g-org" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <linearGradient id="g-amb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema amber -->
  <circle cx="48" cy="48" r="46" fill="#FEF3C7"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="50" cy="79" rx="15" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- kaki -->
  <path d="M46 76V58M54 75V58" stroke="#475569" stroke-width="7" stroke-linecap="round" fill="none"/>
  <rect x="38" y="74" width="12" height="5" rx="2.5" fill="#1E293B"/>
  <rect x="50" y="73" width="11" height="5" rx="2.5" fill="#1E293B"/>
  <!-- L3 badan miring (oranye agar kontras di latar amber) -->
  <rect x="44" y="33" width="13" height="26" rx="6" fill="url(#g-org)" transform="rotate(-22 50.5 46)"/>
  <!-- L4 kilau badan -->
  <path d="M45 43q4-2.5 8.5-1" stroke="#FFFFFF" stroke-width="2" opacity=".4" fill="none" stroke-linecap="round"/>
  <!-- kedua langan menjulur ke atas kanan -->
  <path d="M50 45C60 42 67 36 71 28" stroke="#F5C09A" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  <path d="M48 41C57 36 63 29 66 21" stroke="#FCD9B8" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  <!-- kepala menunduk sedikit -->
  <circle cx="42.5" cy="27" r="9.5" fill="#FCD9B8"/>
  <path d="M33.5 27c0-5.5 4-8.5 9-8.5s9 3 9 8.5c-2-2.6-5-3.6-9-3.6s-7 1-9 3.6z" fill="#1E293B"/>
  <path d="M38.5 27.5q1.5 1.5 3 0M44.5 27q1.5 1.5 3 0" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M40.5 31.5q2 1.8 4 0" stroke="#C2410C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- L5 garis gerak peregangan (menjauh dari lengan) -->
  <path d="M76 16h8M74 24h8" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M31 36q-4 6-2.5 12" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- L6 bintang kilau -->
  <path d="M26 16l1.3 3.4 3.4 1.3-3.4 1.3L26 25.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
  <circle cx="72" cy="56" r="3" fill="#FB923C"/>
</svg>
