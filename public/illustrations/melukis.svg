  <path d="M62 60L80 42" stroke="url(#g-amb)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M62 60l-4.5 4.5" stroke="url(#g-slate)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M56 66l-5 10 11-6z" fill="url(#g-em)"/>
