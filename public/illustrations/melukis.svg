  <path d="M32 34c4-4 10-6.5 16-7" stroke="#FFFFFF" stroke-width="2.5" opacity=".8" fill="none" stroke-linecap="round"/>
  <!-- L5 titik cat -->
  <circle cx="34" cy="44" r="4.5" fill="url(#g-em)"/>
  <circle cx="47" cy="38" r="4.5" fill="url(#g-amb)"/>
  <circle cx="60" cy="44" r="4.5" fill="url(#g-blu)"/>
  <circle cx="38" cy="57" r="4.5" fill="url(#g-org)"/>
