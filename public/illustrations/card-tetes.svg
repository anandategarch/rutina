<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · TETES — vektor semi-realistis: embun besar bergradasi dengan kilau, refraksi, dan bayang kaustik -->
  <defs>
    <radialGradient id="w-tt" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#F0F9FF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dr-tt" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
    <linearGradient id="lf-tt" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="st-tt" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset=".5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="cn-tt" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
  </defs>

  <!-- cuci embun di sudut -->
  <rect width="180" height="170" fill="url(#w-tt)"/>

  <!-- tangkai utama: batang meruncing bergradasi -->
  <path d="M57.4 1.2C95.8 3 132.2 18.8 155.6 45.2C164.2 54.8 170.6 62.6 174.7 70.5L177.3 73.7C170.9 65.8 163.5 57.5 154.2 47.6C133 22 96.2 5.7 56.8 3.4Z" fill="url(#st-tt)"/>
  <path d="M58.4 2C96.6 3.8 132.6 19.6 156 46C164.6 55.6 170.8 63.2 174.6 70.6" fill="none" stroke="#BBF7D0" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
  <path d="M155 48.6C134.2 23.4 97.4 7 57.4 4.8" fill="none" stroke="#14532D" stroke-width=".8" opacity=".3" stroke-linecap="round"/>

  <!-- tetes embun besar di ranting -->
  <g transform="translate(130 40)" stroke-linejoin="round">
    <!-- bayang kaustik lembut di bawah tetes -->
    <ellipse cx="0" cy="23.5" rx="9.5" ry="2.6" fill="#38BDF8" opacity=".16"/>
    <ellipse cx="0" cy="23.2" rx="5.6" ry="1.6" fill="#7DD3FC" opacity=".22"/>
    <!-- badan tetes: gradasi radial air -->
    <path d="M0 -22C8 -10 12 -2 12 6C12 14 7 19 0 19C-7 19 -12 14 -12 6C-12 -2 -8 -10 0 -22Z" fill="url(#dr-tt)" stroke="#7DD3FC" stroke-width=".9"/>
    <!-- kilau spekular besar kiri-atas -->
    <ellipse cx="-4.6" cy="-3.6" rx="3" ry="4.4" fill="#FFFFFF" opacity=".8" transform="rotate(-14 -4.6 -3.6)"/>
    <circle cx="-6.4" cy="-6.4" r="1.2" fill="#FFFFFF" opacity=".9"/>
    <!-- bintik refraksi dalam -->
    <ellipse cx="3.6" cy="11" rx="2.4" ry="3" fill="#E0F2FE" opacity=".8"/>
    <ellipse cx="5.2" cy="13.6" rx="1.2" ry="1.5" fill="#F0F9FF" opacity=".9"/>
    <!-- rim cahaya kiri-atas -->
    <path d="M-7.4 -12C-9.8 -8 -11 -4 -11 0" fill="none" stroke="#E0F2FE" stroke-width="1.4" opacity=".7" stroke-linecap="round"/>
    <!-- titik kilau kecil kanan -->
    <circle cx="7.4" cy="2" r=".9" fill="#FFFFFF" opacity=".45"/>
  </g>

  <!-- tunas kecil yang disiram tetes -->
  <g transform="translate(96 22)" stroke-linejoin="round">
    <path d="M0 0C-1 6 -2 10 -1 14" fill="none" stroke="url(#st-tt)" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M-1 14C-8 13 -13 7 -9 2C-3 3 0 8 -1 14Z" fill="url(#lf-tt)" stroke="#047857" stroke-width=".9"/>
    <path d="M-2.2 12.6C-6 11.8 -9.2 8.8 -9.4 5.8" fill="none" stroke="#14532D" stroke-width=".9" opacity=".45" stroke-linecap="round"/>
    <path d="M-9.2 4.2C-7 3.4 -4.4 4.2 -3 6" fill="none" stroke="#D9F99D" stroke-width="1.1" opacity=".55" stroke-linecap="round"/>
    <path d="M1 7C5 3 11 4 13 8C9 12 3 12 1 7Z" fill="url(#lf-tt)" stroke="#047857" stroke-width=".9" opacity=".95"/>
    <path d="M2 7.4C6 6 9.6 6.2 12.4 8.4" fill="none" stroke="#14532D" stroke-width=".9" opacity=".4" stroke-linecap="round"/>
    <!-- tetes kecil di pucuk tunas -->
    <circle cx="13" cy="-6" r="3.4" fill="url(#dr-tt)" stroke="#7DD3FC" stroke-width=".8"/>
    <circle cx="11.9" cy="-7.1" r=".9" fill="#FFFFFF" opacity=".85"/>
    <circle cx="9" cy="-13" r="2.2" fill="#BAE6FD"/>
    <circle cx="8.4" cy="-13.6" r=".7" fill="#FFFFFF" opacity=".8"/>
  </g>

  <!-- tetes-tetes kecil berjajar di ranting bawah -->
  <g stroke-linejoin="round">
    <ellipse cx="76" cy="44" rx="4.2" ry="5.8" fill="url(#dr-tt)" stroke="#7DD3FC" stroke-width=".8" transform="rotate(-8 76 44)"/>
    <circle cx="74.6" cy="42" r="1" fill="#FFFFFF" opacity=".8"/>
    <ellipse cx="160" cy="78" rx="5" ry="7" fill="url(#dr-tt)" stroke="#7DD3FC" stroke-width=".8" transform="rotate(10 160 78)"/>
    <circle cx="158.2" cy="75.4" r="1.2" fill="#FFFFFF" opacity=".85"/>
    <ellipse cx="160" cy="87" rx="7" ry="2" fill="#7DD3FC" opacity=".18"/>
    <circle cx="148" cy="18" r="4" fill="url(#dr-tt)" stroke="#7DD3FC" stroke-width=".7"/>
    <circle cx="146.8" cy="16.8" r="1" fill="#FFFFFF" opacity=".8"/>
  </g>

  <!-- koin amber: muka radial, cincin, kecambah timbul, kilau sabit -->
  <g>
    <circle cx="70" cy="14" r="6.4" fill="url(#cn-tt)" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="70" cy="14" r="4.7" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M70 17.6C70.2 16.2 71 15.2 72.3 14.8" fill="none" stroke="#B45309" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M72.3 14.8C72 13.4 72.8 12.2 74.1 12.4C74.3 13.7 73.5 14.8 72.3 14.8Z" fill="#D97706" opacity=".9"/>
    <path d="M72.3 14.8C71.6 13.4 70.2 13 69.2 13.8C69.6 15.1 71 15.6 72.3 14.8Z" fill="#B45309" opacity=".9"/>
    <path d="M66.2 11.2a5.6 5.6 0 0 1 3.8 -2.6" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    <circle cx="67.4" cy="11.4" r=".8" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- percik embun: titik berkilau -->
  <g>
    <circle cx="110" cy="6" r="2.6" fill="#7DD3FC"/>
    <circle cx="109.2" cy="5.2" r=".9" fill="#E0F2FE" opacity=".85"/>
    <circle cx="116" cy="58" r="2.2" fill="#7DD3FC" opacity=".9"/>
    <circle cx="88" cy="58" r="2" fill="#BAE6FD" opacity=".9"/>
    <circle cx="88.6" cy="57.4" r=".7" fill="#E0F2FE" opacity=".85"/>
    <path d="M58 50l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1z" fill="#FBBF24" opacity=".9"/>
    <circle cx="104" cy="72" r="1.6" fill="#FDE68A" opacity=".7"/>
  </g>
</svg>
