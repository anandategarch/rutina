<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Payung — perlindungan anggaran</title>
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema sky -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="82" rx="16" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- L3 kanopi payung bertingkat -->
  <path d="M18 48c0-17 13-30 30-30s30 13 30 30c-5-4-10-4-15 0-5-4-10-4-15 0-5-4-10-4-15 0-5-4-10-4-15 0z" fill="url(#g-sky)"/>
  <path d="M48 18v30" stroke="#0284C7" stroke-width="2" opacity=".4"/>
  <path d="M33 34.5v13.5M63 34.5v13.5" stroke="#FFFFFF" stroke-width="2" opacity=".35"/>
  <!-- L4 kilau kanopi -->
  <path d="M30 36c3-9 10-15 18-16" stroke="#FFFFFF" stroke-width="2.5" opacity=".5" fill="none" stroke-linecap="round"/>
  <!-- tangkai & gagang -->
  <path d="M48 48v28" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M48 76c0 5-3.5 7-7 5" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M48 18v-4" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- L5 tetesan hujan -->
  <path d="M20 62q-2 3.5 0 7M76 62q2 3.5 0 7" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="14" cy="52" r="2" fill="#BAE6FD"/><circle cx="82" cy="52" r="2" fill="#BAE6FD"/>
  <!-- titik aksen aman -->
  <circle cx="74" cy="30" r="3" fill="#10B981"/>
  <!-- L6 bintang kilau -->
  <path d="M24 26l1.3 3.4 3.4 1.3-3.4 1.3L24 35.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
</svg>
