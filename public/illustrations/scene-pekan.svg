  <ellipse cx="336" cy="57" rx="2.6" ry="2" fill="#94A3B8" opacity=".38"/>
  <ellipse cx="333.6" cy="62.5" rx="1.3" ry="1" fill="#94A3B8" opacity=".3"/>
