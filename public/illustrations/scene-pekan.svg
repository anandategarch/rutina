<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" fill="none" role="img" aria-label="Busur pekan dari mentari ke bulan dengan tujuh titik hari">
  <!-- Rutina · busur pekan — vektor semi-realistis: mentari berhalo, rembulan sabit, tujuh tunas hari bergradasi -->
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEF8"/><stop offset=".5" stop-color="#F7FEE7"/><stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="spArc" x1="24" y1="40" x2="336" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCD34D"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <radialGradient id="spSun" cx=".4" cy=".35" r=".65">
      <stop offset="0" stop-color="#FFFBEB"/><stop offset=".55" stop-color="#FDE68A"/><stop offset=".85" stop-color="#FCD34D"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="spHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".4"/><stop offset=".55" stop-color="#FDE68A" stop-opacity=".16"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spHalo2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".16"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spMoon" cx=".38" cy=".3" r=".9">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F8FAFC"/><stop offset=".8" stop-color="#E0F2FE"/><stop offset="1" stop-color="#BAE6FD"/>
    </radialGradient>
    <radialGradient id="spMoonHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity=".32"/><stop offset="1" stop-color="#E0F2FE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spStem" x1="0" y1="1" x2=".12" y2="0">
      <stop offset="0" stop-color="#14532D"/><stop offset=".5" stop-color="#22C55E"/><stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="spLeafL" x1=".15" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".42" stop-color="#4ADE80"/><stop offset=".8" stop-color="#16A34A"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="spLeafR" x1=".85" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".42" stop-color="#34D399"/><stop offset=".8" stop-color="#15803D"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="spMeadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="spShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3E2723" stop-opacity=".28"/><stop offset=".6" stop-color="#3E2723" stop-opacity=".1"/><stop offset="1" stop-color="#3E2723" stop-opacity="0"/>
