    </g>
  </g>
  <g transform="translate(300 86)">
    <ellipse cy="2" rx="7.5" ry="2.6" fill="url(#spShadow)"/>
    <ellipse rx="5" ry="2.2" fill="#22C55E" opacity=".5"/>
    <path d="M0 0V-20" stroke="url(#spStem)" stroke-width="2.6" stroke-linecap="round"/>
