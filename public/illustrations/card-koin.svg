<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · KOIN — ranting berbuah koin: catatan keuangan sebagai buah (kartu banner jatah / mutasi / kategori) -->
  <defs>
    <radialGradient id="w-kn2" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FEF3C7" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#D1FAE5" stop-opacity=".26"/>
      <stop offset="1" stop-color="#D1FAE5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cn-kn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="lf-kn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <!-- cuci warna gudang koin di sudut -->
  <rect width="180" height="170" fill="url(#w-kn2)"/>

  <!-- ranting melengkung mengikuti sudut -->
  <path d="M60 2C98 4 134 20 156 46C165 56 172 64 177 72" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" opacity=".92"/>
  <path d="M156 46C150 54 146 60 142 66" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
  <path d="M118 20C120 32 126 42 134 48" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>

  <!-- daun mint -->
  <g stroke-linejoin="round">
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(74 12) rotate(-18) scale(.66)" fill="url(#lf-kn2)"/>
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(126 38) rotate(-46) scale(.62)" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(164 88) rotate(-18) scale(.48)" fill="#A7F3D0"/>
  </g>

  <!-- buah koin berselang-seling -->
  <g>
    <!-- koin besar dekat sudut (di atas zona tombol banner) -->
    <g transform="translate(146 32)">
      <circle r="11.5" fill="url(#cn-kn2)" stroke="#EA580C" stroke-width="1.2"/>
      <circle r="7.4" fill="#FDE68A" opacity=".9"/>
      <path d="M-6-5a9.4 9.4 0 0 1 5.4-5" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity=".75"/>
      <path d="M-3.4 0h6.8M0-3.4v6.8" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
    </g>
    <!-- koin sedang -->
    <g transform="translate(108 24)">
      <circle r="8.2" fill="url(#cn-kn2)" stroke="#EA580C" stroke-width="1.1"/>
      <circle r="5.2" fill="#FDE68A" opacity=".9"/>
      <path d="M-4.4-3.6a7 7 0 0 1 4-3.8" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
    </g>
    <!-- koin kecil gantung -->
    <g transform="translate(160 84)">
      <path d="M0 0L0 -8" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
      <circle cy="-14" r="6" fill="url(#cn-kn2)" stroke="#EA580C" stroke-width="1"/>
      <circle cy="-14" r="3.6" fill="#FDE68A" opacity=".9"/>
    </g>
    <g transform="translate(122 62)">
      <path d="M0 0L0 -7" stroke="#34D399" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
      <circle cy="-12" r="4.8" fill="#FCD34D" stroke="#F59E0B" stroke-width="1"/>
    </g>
    <!-- koin mungil di jalur kanan (terlihat di semua kartu pemakai) -->
    <g transform="translate(167 62)">
      <path d="M0 0L0 -6" stroke="#34D399" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>
      <circle cy="-11" r="4.2" fill="#FCD34D" stroke="#F59E0B" stroke-width=".9"/>
      <circle cy="-11" r="1.6" fill="#FDE68A"/>
    </g>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="70" cy="22" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="70" cy="22" r="2.6" fill="#FDE68A"/>

  <!-- percik -->
  <g>
    <circle cx="172" cy="98" r="2.8" fill="#FBBF24"/>
    <circle cx="176" cy="90" r="2.2" fill="#34D399"/>
    <circle cx="166" cy="106" r="2" fill="#A7F3D0" opacity=".9"/>
    <circle cx="96" cy="46" r="2" fill="#A7F3D0" opacity=".8"/>
    <path d="M122 62l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
