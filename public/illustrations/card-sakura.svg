<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · SAKURA — cabang bunga cherry: identitas yang bersemi lembut (kartu Suara Identitas) -->
  <defs>
    <radialGradient id="w-sk" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FDF2F8" stop-opacity=".72"/>
      <stop offset=".45" stop-color="#FDE8F0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FDE8F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pt-sk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FECDD3"/>
      <stop offset="1" stop-color="#FDA4AF"/>
    </linearGradient>
  </defs>

  <!-- cuci warna sakura muda di sudut -->
  <rect width="180" height="170" fill="url(#w-sk)"/>

  <!-- cabang melengkung mengikuti sudut -->
  <path d="M58 2C96 6 132 22 154 48C164 58 172 66 177 74" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" opacity=".92"/>
  <path d="M177 74C173 79 169 82 164 84" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- kelopak sakura 5-lempeng -->
  <g stroke-linejoin="round">
    <!-- bunga besar di bawah zona kontrol (tetap terlihat) -->
    <g transform="translate(150 88)">
      <g fill="url(#pt-sk)" stroke="#FDA4AF" stroke-width="1.1">
        <ellipse rx="8.2" ry="11" transform="rotate(0) translate(0 -8)"/>
        <ellipse rx="8.2" ry="11" transform="rotate(72) translate(0 -8)"/>
        <ellipse rx="8.2" ry="11" transform="rotate(144) translate(0 -8)"/>
        <ellipse rx="8.2" ry="11" transform="rotate(216) translate(0 -8)"/>
        <ellipse rx="8.2" ry="11" transform="rotate(288) translate(0 -8)"/>
      </g>
      <circle r="4.6" fill="#F59E0B" opacity=".92"/>
      <circle r="1.8" fill="#FDE68A"/>
    </g>
    <!-- bunga sedang di tengah cabang -->
    <g transform="translate(97 22) scale(.72)">
      <g fill="#FECDD3" stroke="#FDA4AF" stroke-width="1.2">
        <ellipse rx="8.2" ry="11" transform="rotate(18) translate(0 -8)"/>
        <ellipse rx="8.2" ry="11" transform="rotate(90) translate(0 -8)"/>
        <ellipse rx="8.2" ry="11" transform="rotate(162) translate(0 -8)"/>
        <ellipse rx="8.2" ry="11" transform="rotate(234) translate(0 -8)"/>
        <ellipse rx="8.2" ry="11" transform="rotate(306) translate(0 -8)"/>
      </g>
      <circle r="4.2" fill="#F59E0B" opacity=".9"/>
    </g>
    <!-- kuncup menghadap ke dalam kartu -->
    <g transform="translate(96 46)">
      <ellipse rx="4" ry="8" transform="rotate(-38)" fill="#FECDD3" stroke="#FDA4AF" stroke-width="1.1"/>
      <path d="M-1 -6C1 -9 4 -10 7 -9" fill="none" stroke="#34D399" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- daun mint pendamping -->
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(70 14) rotate(-24) scale(.72)" fill="#A7F3D0"/>
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(128 44) rotate(-58) scale(.6)" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.3"/>
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(160 82) rotate(-14) scale(.5)" fill="#A7F3D0"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="78" cy="16" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="78" cy="16" r="2.6" fill="#FDE68A"/>

  <!-- kelopak gugur & percik -->
  <g>
    <path d="M0 0C3-4 8-5 12-2C9 3 3 4 0 0Z" transform="translate(60 34) rotate(24)" fill="#FECDD3" opacity=".9"/>
    <path d="M0 0C3-4 8-5 12-2C9 3 3 4 0 0Z" transform="translate(46 22) rotate(-40)" fill="#FDD9E2" opacity=".75"/>
    <path d="M0 0C3-4 8-5 12-2C9 3 3 4 0 0Z" transform="translate(150 96) rotate(60)" fill="#FECDD3" opacity=".8"/>
    <circle cx="170" cy="92" r="3" fill="#FDA4AF"/>
    <circle cx="176" cy="86" r="2.4" fill="#34D399"/>
    <circle cx="148" cy="78" r="2.2" fill="#FCD34D"/>
    <circle cx="103" cy="46" r="2" fill="#A7F3D0" opacity=".9"/>
    <path d="M132 92l1.2 3.2 3.2 1.2-3.2 1.2-1.2 3.2-1.2-3.2-3.2-1.2 3.2-1.2z" fill="#FBBF24" opacity=".9"/>
  </g>
</svg>
