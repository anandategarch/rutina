<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · SAKURA — vektor semi-realistis: cabang sakura meruncing, kelopak bergradasi bertekstur, embun pagi -->
  <defs>
