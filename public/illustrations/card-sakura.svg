      <stop offset=".45" stop-color="#FDE8F0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FDE8F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="br-sk" x1="0" y1="0" x2=".5" y2=".95">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".52" stop-color="#22C55E"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="pt-sk" cx=".5" cy=".3" r=".95">
      <stop offset="0" stop-color="#FDF2F8"/><stop offset=".55" stop-color="#FECDD3"/><stop offset="1" stop-color="#FDA4AF"/>
    </radialGradient>
    <radialGradient id="cn-sk" cx=".38" cy=".32" r=".9">
