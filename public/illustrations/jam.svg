<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Jam — waktu yang konsisten</title>
  <defs>
    <linearGradient id="g-blu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema sky -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="80" rx="18" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- L3 jam alarm -->
  <circle cx="48" cy="50" r="24" fill="#FFFFFF" stroke="url(#g-blu)" stroke-width="5"/>
  <!-- bel atas -->
  <path d="M30 30a10 10 0 0 0-4 8l8-4z" fill="url(#g-amb)"/>
  <path d="M66 30a10 10 0 0 1 4 8l-8-4z" fill="url(#g-amb)"/>
  <!-- kaki -->
  <path d="M34 72l-4 5M62 72l4 5" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <!-- L4 garis skala -->
  <path d="M48 30v3M48 67v3M28 50h3M65 50h3M34 36l2 2M62 36l-2 2M34 64l2-2M62 64l-2-2" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- jarum jam -->
  <path d="M48 50L48 38" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 50L58 56" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="48" cy="50" r="3" fill="#334155"/>
  <!-- kilau kaca -->
  <path d="M32 42a18 18 0 0 1 8-8" stroke="#FFFFFF" stroke-width="3" opacity=".6" fill="none" stroke-linecap="round"/>
  <!-- L5 lonceng bangun kecil -->
  <path d="M20 24q-2.5 3.5 0 7M76 24q2.5 3.5 0 7" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
