  <path d="M24 40l1.2 3 3 1.2-3 1.2L24 48.4l-1.2-3-3-1.2 3-1.2z" fill="#FBBF24"/>
  <circle cx="74" cy="44" r="3" fill="#10B981"/>
</svg>
