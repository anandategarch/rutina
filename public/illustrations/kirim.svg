<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Pesawat kertas melambangkan tombol kirim">
  <!-- Definisi gradien lokal -->
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="g-blu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- L1: latar lingkaran sky -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/>
  <circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2: bayangan tanah -->
  <ellipse cx="50" cy="81" rx="24" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- L3: subjek utama, pesawat kertas dua lipatan -->
  <path d="M80 20L17 44l28 12z" fill="url(#g-sky)"/>
  <path d="M80 20L45 56l-13 15z" fill="url(#g-blu)"/>
  <path d="M45 56l-6 9 7-2z" fill="#0284C7"/>
  <!-- L4: kilau putih pada lipatan -->
  <path d="M73 27L50 50" stroke="#FFFFFF" stroke-width="2.2" opacity=".5" stroke-linecap="round"/>
  <path d="M60 29L38 39" stroke="#FFFFFF" stroke-width="2" opacity=".3" stroke-linecap="round"/>
  <!-- L5: jejak putus-putus dan titik angin -->
  <path d="M15 75c10-1 17-5 24-13" stroke="url(#g-em)" stroke-width="3" stroke-dasharray="4 6.5" stroke-linecap="round" fill="none"/>
  <circle cx="57" cy="67" r="2.8" fill="#0284C7"/>
  <circle cx="64" cy="72" r="2.2" fill="#0284C7"/>
  <!-- L6: kilau bintang -->
  <path d="M30 16l1.1 3 3 1.1-3 1.1-1.1 3-1.1-3-3-1.1 3-1.1z" fill="#FBBF24"/>
  <path d="M86 41l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z" fill="#FBBF24"/>
</svg>
