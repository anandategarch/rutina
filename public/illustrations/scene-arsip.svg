      <stop offset="0" stop-color="#F7FEE7"/><stop offset=".5" stop-color="#F0FDF4"/><stop offset="1" stop-color="#FFFEF8"/>
    </linearGradient>
    <linearGradient id="kayu" x1=".05" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#FDBA74"/><stop offset=".45" stop-color="#F59E0B"/><stop offset=".8" stop-color="#D97706"/><stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="pot" x1=".05" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FDBA74"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#D97706"/>
