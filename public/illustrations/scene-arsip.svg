      <stop offset="0" stop-color="#D97706"/><stop offset=".5" stop-color="#B45309"/><stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="logam" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#F1F5F9"/><stop offset=".45" stop-color="#CBD5E1"/><stop offset=".8" stop-color="#94A3B8"/><stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="daunKiri" x1=".15" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".42" stop-color="#4ADE80"/><stop offset=".8" stop-color="#16A34A"/><stop offset="1" stop-color="#14532D"/>
