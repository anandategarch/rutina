<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · SUKULEN — vektor semi-realistis: roset daun tebal beralur berujung runcing, inti berpilin, kerikil kering -->
  <defs>
    <radialGradient id="w-sk2" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#D1FAE5" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#ECFDF5" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lf-sk2" x1=".1" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="lf2-sk2" x1=".1" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ECFDF5"/><stop offset=".5" stop-color="#A7F3D0"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="co-sk2" cx=".4" cy=".3" r=".9">
      <stop offset="0" stop-color="#ECFDF5"/><stop offset=".55" stop-color="#6EE7B7"/><stop offset="1" stop-color="#15803D"/>
    </radialGradient>
    <radialGradient id="pb-sk2" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#F1F5F9"/><stop offset=".55" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/>
    </radialGradient>
    <radialGradient id="ck-sk2" cx=".4" cy=".35" r=".85">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
  </defs>
  <!-- cuci warna pot terakota di sudut -->
  <rect width="180" height="170" fill="url(#w-sk2)"/>
  <!-- rosete besar: lapis luar tebal beralur -->
  <g transform="translate(150 88)">
    <g fill="url(#lf-sk2)" stroke="#15803D" stroke-width=".9" stroke-opacity=".5" stroke-linejoin="round">
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(60)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(120)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(180)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(240)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(300)"/>
    </g>
    <g fill="#14532D" opacity=".22">
      <path d="M1.6-6C4.8-11 5.4-17 3.4-22C5-16.5 4.4-10.5 1.6-6Z" transform="rotate(60)"/>
      <path d="M1.6-6C4.8-11 5.4-17 3.4-22C5-16.5 4.4-10.5 1.6-6Z" transform="rotate(180)"/>
      <path d="M1.6-6C4.8-11 5.4-17 3.4-22C5-16.5 4.4-10.5 1.6-6Z" transform="rotate(300)"/>
    </g>
    <g fill="none" stroke="#14532D" stroke-width=".9" opacity=".32" stroke-linecap="round">
      <path d="M0-3C-.8-10 .6-18 1.4-25"/>
      <path d="M0-3C-.8-10 .6-18 1.4-25" transform="rotate(60)"/>
      <path d="M0-3C-.8-10 .6-18 1.4-25" transform="rotate(120)"/>
      <path d="M0-3C-.8-10 .6-18 1.4-25" transform="rotate(180)"/>
      <path d="M0-3C-.8-10 .6-18 1.4-25" transform="rotate(240)"/>
      <path d="M0-3C-.8-10 .6-18 1.4-25" transform="rotate(300)"/>
    </g>
    <g fill="none" stroke="#ECFDF5" stroke-width="1.2" opacity=".5" stroke-linecap="round">
      <path d="M-3.4-7C-5.6-13-4.8-19-1.4-24" transform="rotate(300)"/>
      <path d="M-3.4-7C-5.6-13-4.8-19-1.4-24" transform="rotate(0)"/>
      <path d="M-3.4-7C-5.6-13-4.8-19-1.4-24" transform="rotate(120)"/>
    </g>
    <g fill="#14532D" opacity=".55">
      <circle cx="2" cy="-28" r="1.1"/>
      <circle cx="2" cy="-28" r="1.1" transform="rotate(60)"/>
      <circle cx="2" cy="-28" r="1.1" transform="rotate(120)"/>
      <circle cx="2" cy="-28" r="1.1" transform="rotate(180)"/>
      <circle cx="2" cy="-28" r="1.1" transform="rotate(240)"/>
      <circle cx="2" cy="-28" r="1.1" transform="rotate(300)"/>
    </g>
    <!-- lapis dalam lebih muda -->
    <g fill="url(#lf2-sk2)" stroke="#34D399" stroke-width=".8" stroke-opacity=".5" stroke-linejoin="round">
      <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(30)"/>
      <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(90)"/>
      <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(150)"/>
      <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(210)"/>
      <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(270)"/>
      <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(330)"/>
    </g>
    <g fill="none" stroke="#34D399" stroke-width=".7" opacity=".4" stroke-linecap="round">
      <path d="M0-2.4C-.6-7 .4-12 1-16.4" transform="rotate(30)"/>
      <path d="M0-2.4C-.6-7 .4-12 1-16.4" transform="rotate(150)"/>
      <path d="M0-2.4C-.6-7 .4-12 1-16.4" transform="rotate(270)"/>
    </g>
    <!-- inti berpilin -->
    <circle r="5" fill="url(#co-sk2)"/>
    <path d="M2.4 0A2.4 2.4 0 1 1-1.2-2.1" fill="none" stroke="#15803D" stroke-width=".8" opacity=".4"/>
    <circle r="1.2" fill="#A7F3D0"/>
    <circle cx="-.8" cy="-.9" r=".5" fill="#ECFDF5" opacity=".8"/>
    <ellipse cx="-9" cy="-17" rx="2.2" ry="3" transform="rotate(-36 -9 -17)" fill="#ECFDF5" opacity=".5"/>
    <circle cx="-9.6" cy="-17.8" r=".65" fill="#FFFFFF" opacity=".8"/>
  </g>
  <!-- rosete kecil sahabat -->
  <g transform="translate(104 22) scale(.5) rotate(18)">
    <g fill="url(#lf2-sk2)" stroke="#34D399" stroke-width="1.4" stroke-opacity=".5" stroke-linejoin="round">
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(72)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(144)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(216)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(288)"/>
    </g>
    <g fill="none" stroke="#34D399" stroke-width="1" opacity=".4" stroke-linecap="round">
      <path d="M0-3C-.8-10 .6-18 1.4-25" transform="rotate(0)"/>
      <path d="M0-3C-.8-10 .6-18 1.4-25" transform="rotate(144)"/>
    </g>
    <circle r="5.4" fill="url(#co-sk2)"/>
    <circle r="1.4" fill="#A7F3D0"/>
  </g>
  <!-- tunas mini ke sudut -->
  <g transform="translate(168 92) scale(.3)">
    <g fill="url(#lf2-sk2)" stroke="#34D399" stroke-width="2" stroke-opacity=".5" stroke-linejoin="round">
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(120)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(240)"/>
    </g>
  </g>
  <!-- kerikil kering berkilau -->
  <ellipse cx="82" cy="40" rx="5" ry="3.4" fill="url(#pb-sk2)"/>
  <ellipse cx="80.6" cy="38.8" rx="1.7" ry="1" fill="#FFFFFF" opacity=".6"/>
  <ellipse cx="66" cy="54" rx="3.6" ry="2.4" fill="url(#pb-sk2)" opacity=".95"/>
  <ellipse cx="128" cy="80" rx="4" ry="2.6" fill="url(#pb-sk2)"/>
  <ellipse cx="126.9" cy="79" rx="1.3" ry=".8" fill="#FFFFFF" opacity=".5"/>
  <!-- koin amber timbul (gema ilustrasi hero) -->
  <g transform="translate(72 14)">
    <circle r="6.2" fill="#F59E0B"/>
    <circle r="5.5" fill="url(#ck-sk2)"/>
    <circle r="3.8" fill="none" stroke="#F59E0B" stroke-width=".8" opacity=".55"/>
    <path d="M0 2.6L0-.8" stroke="#D97706" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
    <path d="M0-.6C-1.3-1.4-2.1-2.7-2.3-4.1C-.5-3.6.4-2.3 0-.6Z" fill="#D97706" opacity=".85"/>
    <path d="M0-.6C1.3-1.4 2.1-2.7 2.3-4.1C.5-3.6-.4-2.3 0-.6Z" fill="#B45309" opacity=".85"/>
    <path d="M-4.7-2.3A5.3 5.3 0 0 1-.9-5.4" fill="none" stroke="#FFFBEB" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- percik -->
  <g>
    <circle cx="172" cy="112" r="2.6" fill="#34D399" opacity=".85"/>
    <circle cx="176" cy="104" r="2.2" fill="#FBBF24" opacity=".9"/>
    <circle cx="96" cy="60" r="2" fill="#A7F3D0" opacity=".9"/>
    <circle cx="60" cy="64" r="1.6" fill="#FDE68A" opacity=".7"/>
    <path d="M112 68l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1z" fill="#FBBF24" opacity=".9"/>
  </g>
</svg>
