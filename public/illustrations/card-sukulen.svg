<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · SUKULEN — roset tanaman gemuk: air yang tersimpan untuk hari kering (kartu dompet & kalender konsistensi) -->
  <defs>
    <radialGradient id="w-sk2" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#D1FAE5" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#ECFDF5" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lf-sk2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- cuci warna pot terakota di sudut -->
  <rect width="180" height="170" fill="url(#w-sk2)"/>

  <!-- rosete sukulen besar (daun tebal berlapis) — di bawah zona kontrol kepala -->
  <g transform="translate(150 88)">
    <g stroke-linejoin="round">
      <!-- lapis luar -->
      <g fill="url(#lf-sk2)" stroke="#059669" stroke-width="1.1">
        <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(0)"/>
        <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(60)"/>
        <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(120)"/>
        <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(180)"/>
        <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(240)"/>
        <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(300)"/>
      </g>
      <!-- lapis dalam -->
      <g fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" opacity=".95">
        <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(30)"/>
        <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(90)"/>
        <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(150)"/>
        <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(210)"/>
        <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(270)"/>
        <path d="M0 0C-4-6 -4-15 2-19C6-14 6-6 0 0Z" transform="rotate(330)"/>
      </g>
      <!-- inti -->
      <circle r="5" fill="#6EE7B7" stroke="#059669" stroke-width="1"/>
      <circle r="2" fill="#A7F3D0"/>
    </g>
    <!-- titik ujung daun -->
    <g fill="#059669" opacity=".55">
      <circle cy="-26" r="1.1"/><circle cx="22.5" cy="-13" r="1.1"/>
      <circle cx="22.5" cy="13" r="1.1"/><circle cy="26" r="1.1"/>
      <circle cx="-22.5" cy="13" r="1.1"/><circle cx="-22.5" cy="-13" r="1.1"/>
    </g>
  </g>

  <!-- rosete kecil sahabat -->
  <g transform="translate(104 22) scale(.5) rotate(18)" opacity=".92">
    <g fill="#A7F3D0" stroke="#10B981" stroke-width="1.4" stroke-linejoin="round">
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(0)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(72)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(144)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(216)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(288)"/>
    </g>
    <circle r="5.4" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.3"/>
  </g>

  <!-- tunas mini ke sudut -->
  <g transform="translate(168 92) scale(.3)">
    <g fill="#A7F3D0" stroke="#10B981" stroke-width="2" stroke-linejoin="round">
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(0)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(120)"/>
      <path d="M0 0C-6-8 -6-22 2-28C8-20 8-8 0 0Z" transform="rotate(240)"/>
    </g>
  </g>

  <!-- kerikil kering -->
  <g>
    <ellipse cx="82" cy="40" rx="5" ry="3.4" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
    <ellipse cx="66" cy="54" rx="3.6" ry="2.4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <ellipse cx="128" cy="80" rx="4" ry="2.6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="72" cy="14" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="72" cy="14" r="2.6" fill="#FDE68A"/>

  <!-- percik -->
  <g>
    <circle cx="172" cy="112" r="2.6" fill="#34D399"/>
    <circle cx="176" cy="104" r="2.2" fill="#FBBF24"/>
    <circle cx="96" cy="60" r="2" fill="#A7F3D0" opacity=".9"/>
    <path d="M112 68l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
