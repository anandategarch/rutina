<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Baterai penuh sebagai energi harian">
  <!-- Definisi gradien lokal -->
  <defs>
    <linearGradient id="g-slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- L1: latar lingkaran emerald -->
  <circle cx="48" cy="48" r="46" fill="#ECFDF5"/>
  <circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2: bayangan tanah -->
  <ellipse cx="48" cy="70.5" rx="24" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- L3: subjek utama, baterai dengan isi level 75 persen -->
  <rect x="17" y="36" width="59" height="26" rx="6.5" fill="url(#g-slate)"/>
  <rect x="76" y="43" width="6" height="12" rx="2.5" fill="#94A3B8"/>
  <rect x="22" y="41" width="45" height="16" rx="3" fill="#FFFFFF"/>
  <rect x="22" y="41" width="45" height="16" rx="3" fill="url(#g-bghigh)"/>
  <rect x="22" y="41" width="34" height="16" rx="3" fill="url(#g-em)"/>
  <path d="M41 44.5l-6 6.8h4.3l-1.3 5.2 6-6.8h-4.3l1.3-5.2z" fill="#F59E0B"/>
  <!-- L4: kilau putih pada badan dan isi -->
  <path d="M20 42.3c.3-3 2.7-5.4 5.8-5.4h8.5" stroke="#FFFFFF" stroke-width="2.3" opacity=".55" stroke-linecap="round"/>
  <path d="M25.5 44.5h8" stroke="#FFFFFF" stroke-width="2" opacity=".5" stroke-linecap="round"/>
  <!-- L5: aksen kecil, garis level kosong dan titik -->
  <path d="M59.5 45.5v7M63.5 45.5v7" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="78" cy="33" r="3" fill="#38BDF8"/>
  <!-- L6: kilau bintang -->
  <path d="M23 26l1.1 3 3 1.1-3 1.1-1.1 3-1.1-3-3-1.1 3-1.1z" fill="#FBBF24"/>
</svg>
