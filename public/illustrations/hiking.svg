<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Mendaki — hiking di gunung</title>
  <defs>
    <linearGradient id="g-em2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7B8"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <linearGradient id="g-amb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="g-org" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <linearGradient id="g-slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema sky -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- matahari pagi -->
  <circle cx="66" cy="24" r="8" fill="url(#g-amb2)"/>
  <path d="M66 10v4M56 14.5l2.8 2.8M76 14.5l-2.8 2.8" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- awan kecil -->
  <ellipse cx="24" cy="20" rx="8" ry="3.5" fill="#FFFFFF"/>
  <ellipse cx="30" cy="18" rx="5" ry="2.6" fill="#F8FAFC"/>
  <!-- L3 gunung belakang & depan -->
  <path d="M8 66L34 30l26 36z" fill="url(#g-em2)"/>
  <path d="M27 42.5l7-11 7 11c-2.7-2.7-4.7-2.7-7-.9-2.3-1.8-4.3-1.8-7 .9z" fill="#FFFFFF"/>
  <path d="M40 66l22-34 22 34z" fill="url(#g-slate)"/>
  <path d="M55.5 44.5l6.5-10 6.5 10c-2.5-2.5-4.3-2.5-6.5-.8-2.2-1.7-4-1.7-6.5.8z" fill="#FFFFFF"/>
  <!-- jalur pendakian bertitik -->
  <path d="M13 63C20 52 26 42 33 32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray=".1 6" fill="none" opacity=".9"/>
  <!-- bendera puncak -->
  <path d="M34 30V18" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M34 18l11 4-11 4z" fill="url(#g-org)"/>
  <!-- pendaki kecil di jalur -->
  <circle cx="21.5" cy="36.5" r="3.5" fill="#1E293B"/>
  <path d="M21.5 40.5v5.5l-3.5 4m3.5-4l4 4.5" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="16.2" y="40" width="4.5" height="6.5" rx="2" fill="url(#g-amb2)"/>
  <path d="M26 42l3.5 7.5" stroke="#334155" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- garis tanah -->
  <path d="M12 66h72" stroke="#A7F3D0" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- L6 bintang kilau -->
  <path d="M17 26l1.3 3.4 3.4 1.3-3.4 1.3L17 35.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
  <circle cx="84" cy="50" r="3" fill="#10B981"/>
</svg>
