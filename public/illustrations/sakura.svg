  <g fill="#FDE68A">
    <circle cx="40" cy="33" r="1.4"/><circle cx="44" cy="35" r="1.4"/><circle cx="42" cy="30" r="1.4"/>
    <circle cx="52" cy="28" r="1.4"/><circle cx="56" cy="30" r="1.4"/><circle cx="54" cy="26" r="1.4"/>
