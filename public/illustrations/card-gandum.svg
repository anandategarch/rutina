<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · GANDUM — vektor semi-realistis: bulir gandum bergradasi bertekstur, tangkai meruncing, janggut halus -->
