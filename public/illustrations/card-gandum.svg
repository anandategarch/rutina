      <stop offset="0" stop-color="#FEF3C7" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#F7F5E8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#F7F5E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st-gd" x1=".1" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".52" stop-color="#22C55E"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="gr-gd" x1=".2" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
