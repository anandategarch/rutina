    <path d="M52 94C51 95 51 96.4 51.8 98" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
    <circle cx="52" cy="100" r="3.2" fill="none" stroke="#B45309" stroke-width="2.2"/>
    <circle cx="52" cy="100" r="3.2" fill="none" stroke="#FCD34D" stroke-width=".7" opacity=".5"/>
    <circle cx="52" cy="66" r="30" fill="url(#skRing)"/>
    <circle cx="52" cy="66" r="27.6" fill="none" stroke="#78350F" stroke-width=".8" opacity=".35"/>
    <circle cx="52" cy="66" r="24.6" fill="none" stroke="#92400E" stroke-width="1" opacity=".4"/>
    <path d="M23 66A29 29 0 0 1 52 37" stroke="#FEF3C7" stroke-width="2.4" opacity=".6" stroke-linecap="round"/>
    <path d="M81 66A29 29 0 0 1 52 95" stroke="#78350F" stroke-width="2.6" opacity=".4" stroke-linecap="round"/>
    <circle cx="52" cy="66" r="23" fill="url(#skFace)" stroke="#D97706" stroke-width="1.6"/>
    <g stroke="#CBD5E1" stroke-width="1" opacity=".5">
      <path d="M52 60V52M52 72v8M46 66h-8M58 66h8"/>
      <path d="M47.6 61.6l-5.6-5.6M56.4 61.6l5.6-5.6M47.6 70.4 42 76M56.4 70.4 62 76"/>
    </g>
    <g stroke="#B45309" stroke-width="2" stroke-linecap="round">
      <path d="M52 45.5v4M52 82.5v4M31.5 66h4M68.5 66h4"/>
    </g>
    <g stroke="#D97706" stroke-width="1.3" stroke-linecap="round" opacity=".6">
      <path d="M38.6 52.6l2.4 2.4M63.4 52.6l-2.4 2.4M38.6 79.4l2.4-2.4M63.4 79.4l-2.4-2.4"/>
    </g>
    <g transform="rotate(-8 52 66)">
      <path d="M52 46 48.5 66 52 66Z" fill="url(#skNeedleN)"/>
      <path d="M52 46 55.5 66 52 66Z" fill="url(#skNeedleNd)"/>
      <path d="M52 86 48.5 66 52 66Z" fill="#DC2626"/>
      <path d="M52 86 55.5 66 52 66Z" fill="url(#skNeedleS)"/>
      <path d="M49.6 53l4.4-3.4" stroke="#FFFFFF" stroke-width="1.6" opacity=".7" stroke-linecap="round"/>
      <circle cx="51.4" cy="48.6" r=".9" fill="#FFFFFF" opacity=".8"/>
    </g>
    <circle cx="52" cy="66" r="3.6" fill="url(#skHub)" stroke="#78350F" stroke-width="1"/>
    <circle cx="50.8" cy="64.6" r="1" fill="#FFFFFF" opacity=".85"/>
