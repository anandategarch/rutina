    <path d="M36 57C39.6 49.2 46 43.6 54 41.8" stroke="#FFFFFF" stroke-width="4.2" opacity=".4" stroke-linecap="round"/>
    <path d="M34.6 60C38 52.8 44 47.6 52 45.6" stroke="#FFFFFF" stroke-width="1.6" opacity=".6" stroke-linecap="round"/>
    <path d="M38 43.6l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2Z" fill="#FFFFFF" opacity=".8"/>
  </g>
  <!-- rangka botani berurat -->
  <g>
    <path d="M6 46C10 32 20 24 34 21.5" stroke="url(#skStem)" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(12 39) rotate(-40) scale(.6)">
      <path d="M0 0C-8-2-13-8-7-13C-2-10-2-5 0 0Z" fill="url(#skLeafL)"/>
      <path d="M0 0C-4-3-6-7-5-11" stroke="#14532D" stroke-width="1" opacity=".4" stroke-linecap="round"/>
    </g>
    <g transform="translate(21 29) rotate(-55) scale(.5)">
      <path d="M0 0C-8-2-13-8-7-13C-2-10-2-5 0 0Z" fill="url(#skLeafL)"/>
      <path d="M0 0C-4-3-6-7-5-11" stroke="#14532D" stroke-width="1" opacity=".4" stroke-linecap="round"/>
    </g>
    <g transform="translate(33 22) scale(.55)">
      <path d="M0 0C8-2 13-8 7-13C2-10 2-5 0 0Z" fill="url(#skLeafR)"/>
      <path d="M0 0C4-3 6-7 5-11" stroke="#14532D" stroke-width="1" opacity=".4" stroke-linecap="round"/>
    </g>
    <path d="M8 100c-3-4 2-7 0-10" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    <path d="M14 102c2-3.4-1.6-6 0-9.4" stroke="#22C55E" stroke-width="1.7" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- kerikil, butir, kilau -->
  <ellipse cx="24" cy="108" rx="5" ry="3" fill="url(#skPebble)"/>
  <ellipse cx="22.6" cy="106.8" rx="1.7" ry=".9" fill="#FFF7ED" opacity=".55"/>
  <ellipse cx="150" cy="110" rx="4" ry="2.4" fill="url(#skPebble)" opacity=".95"/>
  <g fill="#431407" opacity=".28">
    <circle cx="42" cy="108" r="1.2"/><circle cx="100" cy="112" r="1.3"/><circle cx="132" cy="108" r="1.1"/><circle cx="164" cy="112" r="1.2"/>
  </g>
  <path d="M28 30l2 4.4 4.4 2-4.4 2-2 4.4-2-4.4-4.4-2 4.4-2Z" fill="#FCD34D" opacity=".85"/>
  <g fill="#FDE68A" opacity=".5">
    <circle cx="96" cy="20" r="1.4"/><circle cx="120" cy="26" r="1.2"/><circle cx="70" cy="24" r="1.1"/>
  </g>
</svg>
