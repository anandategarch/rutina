    <path d="M36 102c2-3.4-1.6-6 0-9.4" stroke="#22C55E" stroke-width="1.7" opacity=".7"/>
    <path d="M140 96c2.6-4-1.4-7 0-11" stroke="#4ADE80" stroke-width="2" opacity=".75"/>
    <path d="M146 98c2-3.4-1.6-6 0-9.4" stroke="#22C55E" stroke-width="1.7" opacity=".7"/>
  </g>
  <!-- kompas logam -->
  <g>
