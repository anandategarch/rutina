      <path d="M0 0C8-2 13-8 7-13C2-10 2-5 0 0Z" fill="url(#skLeafR)"/>
      <path d="M0 0C-4-3-6-7-5-11M0 0C4-3 6-7 5-11" stroke="#14532D" stroke-width="1.1" opacity=".4" stroke-linecap="round"/>
    </g>
    <circle cx="17" cy="-8" r="6" fill="url(#skHalo)"/>
    <circle cx="17" cy="-8" r="3.4" fill="url(#skSun)"/>
    <circle cx="16" cy="-9" r="1" fill="#FFFFFF" opacity=".85"/>
