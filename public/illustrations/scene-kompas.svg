<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" fill="none" role="img" aria-label="Kompas dengan jarum menunjuk tunas di puncak bukit, diikuti jejak titik">
  <defs>
    <linearGradient id="skcBg" x1="0" y1="0" x2="180" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#F0FDF4"/><stop offset="1" stop-color="#FFFEF8"/></linearGradient>
    <linearGradient id="skcRing" x1="48" y1="30" x2="120" y2="102" gradientUnits="userSpaceOnUse"><stop stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="skcHill" x1="20" y1="78" x2="160" y2="112" gradientUnits="userSpaceOnUse"><stop stop-color="#6EE7B7"/><stop offset="1" stop-color="#10B981"/></linearGradient>
  </defs>
  <rect width="180" height="120" rx="14" fill="url(#skcBg)"/>
  <!-- matahari arah timur -->
  <circle cx="152" cy="30" r="10" fill="#FCD34D"/>
  <path d="M152 12v-4M152 48v4M134 30h-4M170 30h4M139 17l-3-3M165 17l3-3M139 43l-3 3M165 43l3 3" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
  <!-- jejak titik menuju tunas -->
  <path d="M64 88c16-12 34-16 48-26" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 8" opacity=".6"/>
  <!-- bukit dengan tunas tujuan -->
  <path d="M8 112c22-26 48-24 62-32 16-9 38 6 56-6 14-9 34-6 46 6v24H8Z" fill="url(#skcHill)"/>
  <path d="M8 112c22-26 48-24 62-32 16-9 38 6 56-6" stroke="#A7F3D0" stroke-width="2.6" stroke-linecap="round" opacity=".7" fill="none"/>
  <g transform="translate(112 62)">
    <path d="M0 20V-2" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 10c-9-1-12-8-5-12 8 1 12 7 5 12Z" fill="#34D399"/>
    <path d="M2 4c2-9 10-11 15-7-1 8-8 11-15 7Z" fill="#10B981"/>
    <circle cx="17" cy="-5" r="3" fill="#FCD34D"/>
  </g>
  <!-- kompas -->
  <ellipse cx="52" cy="104" rx="34" ry="5" fill="#059669" opacity=".12"/>
  <g>
    <circle cx="52" cy="66" r="30" fill="url(#skcRing)"/>
    <circle cx="52" cy="66" r="23" fill="#FFFEF8" stroke="#D97706" stroke-width="2"/>
    <!-- penanda arah -->
    <path d="M52 46v5M52 81v5M32 66h5M67 66h5" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
    <!-- mawar angin kecil -->
    <path d="M62 56 48 50l4 14Z" fill="#10B981" opacity=".5"/>
    <path d="M42 76l14 6-4-14Z" fill="#E0F2FE"/>
    <!-- jarum menuju timur-laut (tunas) -->
    <path d="M62 56 56 62l-6-2 4 10Z" fill="#059669"/>
    <path d="M42 76l6-6 6 2-4-10Z" fill="#F87171"/>
    <circle cx="52" cy="66" r="3.4" fill="#FFFEF8" stroke="#D97706" stroke-width="1.6"/>
    <!-- gelang kompas tergantung -->
    <path d="M52 96v-2" stroke="#B45309" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="52" cy="99" r="3" stroke="#B45309" stroke-width="2.2" fill="none"/>
  </g>
  <!-- rumput -->
  <g stroke="#047857" stroke-width="2.4" stroke-linecap="round" opacity=".8">
    <path d="M24 104c-3-4 2-7 0-10"/>
    <path d="M162 106c3-4-2-7 0-10"/>
  </g>
  <path d="M28 30l2 4.4 4.4 2-4.4 2-2 4.4-2-4.4-4.4-2 4.4-2Z" fill="#A7F3D0"/>
</svg>
