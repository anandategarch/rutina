<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" fill="none" role="img" aria-label="Kompas dengan jarum menunjuk tunas di puncak bukit, diikuti jejak titik">
  <!-- Rutina · kompas — vektor semi-realistis: kompas logam berbingkai kuas, jarum dua nada, tunas tujuan di puncak bukit -->
  <defs>
    <linearGradient id="skBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0FDF4"/><stop offset=".5" stop-color="#F7FEE7"/><stop offset="1" stop-color="#FFFEF8"/>
    </linearGradient>
    <radialGradient id="skSun" cx=".4" cy=".35" r=".65">
      <stop offset="0" stop-color="#FFFBEB"/><stop offset=".55" stop-color="#FDE68A"/><stop offset=".85" stop-color="#FCD34D"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="skHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".42"/><stop offset=".55" stop-color="#FDE68A" stop-opacity=".16"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skHalo2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".18"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skRing" x1=".1" y1="0" x2=".9" y2=".8">
      <stop offset="0" stop-color="#FDE68A"/><stop offset=".45" stop-color="#FBBF24"/><stop offset=".8" stop-color="#D97706"/><stop offset="1" stop-color="#92400E"/>
    </linearGradient>
    <radialGradient id="skFace" cx=".38" cy=".32" r=".85">
      <stop offset="0" stop-color="#FFFEF8"/><stop offset=".5" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="skNeedleN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".55" stop-color="#16A34A"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="skNeedleNd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset=".55" stop-color="#15803D"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="skNeedleS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCA5A5"/><stop offset=".6" stop-color="#F87171"/><stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="skHub" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".5" stop-color="#FBBF24"/><stop offset="1" stop-color="#92400E"/>
    </radialGradient>
    <linearGradient id="skHill" x1=".1" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".45" stop-color="#4ADE80"/><stop offset=".8" stop-color="#22C55E"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="skStem" x1="0" y1="1" x2=".12" y2="0">
      <stop offset="0" stop-color="#14532D"/><stop offset=".5" stop-color="#22C55E"/><stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="skLeafL" x1=".15" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".42" stop-color="#4ADE80"/><stop offset=".8" stop-color="#16A34A"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="skLeafR" x1=".85" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".42" stop-color="#34D399"/><stop offset=".8" stop-color="#15803D"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="skShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3E2723" stop-opacity=".28"/><stop offset=".6" stop-color="#3E2723" stop-opacity=".1"/><stop offset="1" stop-color="#3E2723" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skPebble" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#EBDDD0"/><stop offset=".5" stop-color="#C9A57E"/><stop offset="1" stop-color="#8A6642"/>
    </radialGradient>
  </defs>
  <rect width="180" height="120" rx="14" fill="url(#skBg)"/>
  <!-- matahari arah timur -->
  <circle cx="152" cy="30" r="32" fill="url(#skHalo2)"/>
  <circle cx="152" cy="30" r="21" fill="url(#skHalo)"/>
  <g stroke-linecap="round">
    <path d="M152 14v-5" stroke="#FCD34D" stroke-width="2.4" opacity=".8"/>
    <path d="M136 30h-5" stroke="#FCD34D" stroke-width="2.4" opacity=".75"/>
    <path d="M168 30h5" stroke="#F59E0B" stroke-width="2.4" opacity=".55"/>
    <path d="M152 46v5" stroke="#F59E0B" stroke-width="2.4" opacity=".55"/>
    <path d="M141 19l-3.4-3.4" stroke="#FCD34D" stroke-width="2.2" opacity=".7"/>
    <path d="M163 19l3.4-3.4" stroke="#F59E0B" stroke-width="2.2" opacity=".55"/>
    <path d="M141 41l-3.4 3.4" stroke="#D97706" stroke-width="2.2" opacity=".5"/>
    <path d="M163 41l3.4 3.4" stroke="#D97706" stroke-width="2.2" opacity=".5"/>
  </g>
  <circle cx="152" cy="30" r="10" fill="url(#skSun)"/>
  <path d="M152 30L162 30A10 10 0 0 1 152 40Z" fill="#D97706" opacity=".3"/>
  <path d="M152 20A10 10 0 0 0 142 30L152 30Z" fill="#FFFBEB" opacity=".45"/>
  <circle cx="148.5" cy="26" r="2" fill="#FFFFFF" opacity=".7"/>
  <!-- jejak titik menuju tunas -->
  <path d="M64 88c16-12 34-16 48-26" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 8" opacity=".6"/>
  <path d="M66 92c16-12 34-16 46-25" stroke="#D97706" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1 7" opacity=".35"/>
  <!-- bukit dengan tunas tujuan -->
  <path d="M8 112c22-26 48-24 62-32 16-9 38 6 56-6 14-9 34-6 46 6v24H8Z" fill="url(#skHill)"/>
  <path d="M8 112c22-26 48-24 62-32 16-9 38 6 56-6" stroke="#D9F99D" stroke-width="2.2" opacity=".45" stroke-linecap="round"/>
  <path d="M12 118C70 96 128 92 172 104V120H12Z" fill="#14532D" opacity=".16"/>
  <ellipse cx="90" cy="104" rx="58" ry="5" fill="#FDE68A" opacity=".12"/>
