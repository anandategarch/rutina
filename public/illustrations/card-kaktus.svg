  <!-- percik -->
  <g>
    <circle cx="172" cy="96" r="2.6" fill="#FBBF24" opacity=".9"/>
    <circle cx="176" cy="88" r="2.2" fill="#34D399" opacity=".85"/>
    <circle cx="166" cy="108" r="2" fill="#A7F3D0" opacity=".9"/>
    <circle cx="92" cy="42" r="1.6" fill="#FDE68A" opacity=".7"/>
    <path d="M92 50l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1z" fill="#FBBF24" opacity=".9"/>
