      <stop offset=".45" stop-color="#FEF3C7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bd-kt" x1=".1" y1="0" x2=".8" y2=".3">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".5" stop-color="#22C55E"/><stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="bd2-kt" x1=".1" y1="0" x2=".8" y2=".3">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="pt-kt" cx=".5" cy=".3" r=".95">
