      <path d="M6-40l2.4-.9M6-40l.6-2.5M6-40l-1.9-1.7"/>
      <path d="M-6-24l-2.4-.9M-6-24l-.6-2.5M-6-24l1.9-1.7"/>
      <path d="M6-18l2.4-.9M6-18l.6-2.5M6-18l-1.9-1.7"/>
      <path d="M20-16l2.2-.8M20-16l1.5-2M20-16l-.8-2.4"/>
      <path d="M-20-10l-2.2-.8M-20-10l-1.5-2M-20-10l.8-2.4"/>
    </g>
