<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Sepeda — kebiasaan bersepeda</title>
  <defs>
    <linearGradient id="g-org" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <linearGradient id="g-slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema peach -->
  <circle cx="48" cy="48" r="46" fill="#FFEDD5"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- tanah -->
  <path d="M14 79h68" stroke="#FED7AA" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- L2/L3 roda belakang -->
  <circle cx="28" cy="64" r="13" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M28 51v26M15 64h26M19 55l18 18M37 55L19 73" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <circle cx="28" cy="64" r="3" fill="#64748B"/>
  <!-- roda depan -->
  <circle cx="68" cy="64" r="13" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M68 51v26M55 64h26M59 55l18 18M77 55L59 73" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <circle cx="68" cy="64" r="3" fill="#64748B"/>
  <!-- rangka -->
  <path d="M28 64H48M28 64l8-28M36 36l12 28M36 36l26-2M62 34L48 64M62 34l6 30" stroke="url(#g-org)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- L4 kilau rangka -->
  <path d="M34 40l10 21" stroke="#FFFFFF" stroke-width="2" opacity=".35" stroke-linecap="round" fill="none"/>
  <!-- crank -->
  <circle cx="48" cy="64" r="4" fill="url(#g-slate)"/>
  <circle cx="46.5" cy="62.5" r="1" fill="#FFFFFF" opacity=".7"/>
