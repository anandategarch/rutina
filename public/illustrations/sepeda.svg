  <path d="M31 33h10" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M62 34l-2-7" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M54 27h12" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- L5 garis gerak -->
  <path d="M12 50h9M9 58h7" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- L6 bintang kilau -->
  <path d="M24 14l1.4 3.8 3.8 1.4-3.8 1.4L24 24.4l-1.4-3.8-3.8-1.4 3.8-1.4z" fill="#FBBF24"/>
  <circle cx="76" cy="22" r="3" fill="#10B981"/>
