<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · TERATAI — bunga tenang di atas air: akar kuat di dasar, tenang
       di permukaan (kartu kebiasaan: ketenangan & reset) -->
  <defs>
    <radialGradient id="w-tr" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#F0F9FF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#F0F9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pt-tr" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FDA4AF"/>
      <stop offset=".55" stop-color="#FECDD3"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- cuci warna kolam pagi di sudut -->
  <rect width="180" height="170" fill="url(#w-tr)"/>

  <!-- bunga teratai mekar di sudut -->
  <g transform="translate(141 52)">
    <!-- kelopak samping lebar -->
    <g fill="url(#pt-tr)" stroke="#FDA4AF" stroke-width="1.1" stroke-linejoin="round">
      <path d="M0 -2C-12 -4 -24 2 -27 12C-17 18 -5 15 0 8Z"/>
      <path d="M0 -2C12 -4 24 2 27 12C17 18 5 15 0 8Z"/>
      <path d="M0 -2C-9 -8 -19 -8 -24 -2C-18 6 -7 8 0 4Z" opacity=".92"/>
      <path d="M0 -2C9 -8 19 -8 24 -2C18 6 7 8 0 4Z" opacity=".92"/>
    </g>
    <!-- kelopak tengah tegak -->
    <path d="M-7 2C-7 -10 -3 -19 0 -23C3 -19 7 -10 7 2C4 6 -4 6 -7 2Z" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- pucuk kuning -->
    <ellipse cx="0" cy="6" rx="5" ry="4" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
  </g>

  <!-- daun teratai (lily pad) -->
  <g>
    <path d="M155 96a18 18 0 1 1 -18 -18L155 96Z" fill="#A7F3D0" stroke="#059669" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M137 96C144 93 150 88 154 83" fill="none" stroke="#059669" stroke-width=".9" opacity=".6"/>
  </g>
  <g>
    <path d="M118 118a12.5 12.5 0 1 1 -12.5 -12.5L118 118Z" fill="#D1FAE5" stroke="#34D399" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- riak air -->
  <g fill="none" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" opacity=".75">
    <path d="M84 132C100 138 120 138 136 132"/>
    <path d="M104 144C114 147 126 147 136 144" opacity=".6"/>
    <path d="M146 128C152 130 158 130 164 128" opacity=".55"/>
  </g>

  <!-- kuncup teratai kecil sahabat -->
  <g transform="translate(100 36) rotate(-18) scale(.6)">
    <path d="M-7 2C-7 -10 -3 -19 0 -23C3 -19 7 -10 7 2C4 6 -4 6 -7 2Z" fill="#FECDD3" stroke="#FDA4AF" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="70" cy="14" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="70" cy="14" r="2.6" fill="#FDE68A"/>

  <!-- percik -->
  <g>
    <circle cx="92" cy="42" r="2.6" fill="#FBBF24"/>
    <circle cx="84" cy="52" r="2.2" fill="#34D399"/>
    <circle cx="99" cy="32" r="2" fill="#A7F3D0" opacity=".9"/>
    <path d="M168 132l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
