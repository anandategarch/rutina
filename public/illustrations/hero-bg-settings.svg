<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none" role="img" aria-label="Roda gigi sage dengan daun merambat">
  <!-- Rutina · hero pengaturan — vektor semi-realistis: roda gigi sage ber-gigi membulat, pelat krem, daun merambat -->
  <defs>
    <linearGradient id="hs-gear" x1="68" y1="20" x2="180" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".4" stop-color="#86EFAC"/><stop offset=".72" stop-color="#34D399"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="hs-ring" x1="100" y1="58" x2="142" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset=".55" stop-color="#BBF7D0"/><stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="hs-plate" x1="108" y1="64" x2="132" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#FFF7ED"/><stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="hs-hub" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#D9F99D"/><stop offset=".55" stop-color="#4ADE80"/><stop offset="1" stop-color="#16A34A"/>
    </radialGradient>
    <linearGradient id="hs-leaf" x1=".15" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".42" stop-color="#4ADE80"/><stop offset=".8" stop-color="#16A34A"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="hs-leaf2" x1=".85" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".42" stop-color="#34D399"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="hs-sun" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FFFBEB"/><stop offset=".5" stop-color="#FDE68A"/><stop offset="1" stop-color="#FCD34D"/>
    </radialGradient>
    <radialGradient id="hs-sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".4"/><stop offset=".5" stop-color="#FDE68A" stop-opacity=".16"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hs-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#BBF7D0" stop-opacity=".4"/><stop offset=".5" stop-color="#D1FAE5" stop-opacity=".2"/><stop offset="1" stop-color="#D1FAE5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hs-soft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3E2723" stop-opacity=".28"/><stop offset=".62" stop-color="#3E2723" stop-opacity=".1"/><stop offset="1" stop-color="#3E2723" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo sage + mentari kecil kanan-atas -->
  <circle cx="120" cy="80" r="62" fill="url(#hs-halo)"/>
  <circle cx="196" cy="34" r="26" fill="url(#hs-sunGlow)"/>
  <circle cx="196" cy="34" r="18" fill="url(#hs-sun)" opacity=".92"/>
  <circle cx="191" cy="29" r="6" fill="#FFFBEB" opacity=".75"/>
  <ellipse cx="120" cy="148" rx="34" ry="5" fill="url(#hs-soft)"/>

  <!-- roda gigi ber-gigi membulat -->
  <g>
    <rect x="116.5" y="17" width="7" height="15" rx="3.5" fill="url(#hs-gear)"/>
    <rect x="116.5" y="17" width="7" height="15" rx="3.5" fill="url(#hs-gear)" transform="rotate(45 120 80)"/>
    <rect x="116.5" y="17" width="7" height="15" rx="3.5" fill="url(#hs-gear)" transform="rotate(90 120 80)"/>
    <rect x="116.5" y="17" width="7" height="15" rx="3.5" fill="url(#hs-gear)" transform="rotate(135 120 80)"/>
    <rect x="116.5" y="17" width="7" height="15" rx="3.5" fill="url(#hs-gear)" transform="rotate(180 120 80)"/>
    <rect x="116.5" y="17" width="7" height="15" rx="3.5" fill="url(#hs-gear)" transform="rotate(225 120 80)"/>
    <rect x="116.5" y="17" width="7" height="15" rx="3.5" fill="url(#hs-gear)" transform="rotate(270 120 80)"/>
    <rect x="116.5" y="17" width="7" height="15" rx="3.5" fill="url(#hs-gear)" transform="rotate(315 120 80)"/>
    <circle cx="120" cy="80" r="41" fill="url(#hs-gear)"/>
    <circle cx="120" cy="80" r="41" fill="none" stroke="#15803D" stroke-width="1.5" opacity=".3"/>
    <ellipse cx="133" cy="100" rx="19" ry="12" fill="#15803D" opacity=".2" transform="rotate(30 133 100)"/>
    <path d="M86 58 C91 47 102 40 115 39" stroke="#D9F99D" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/>
    <circle cx="120" cy="80" r="24" fill="url(#hs-ring)"/>
    <circle cx="120" cy="80" r="24" fill="none" stroke="#15803D" stroke-width="1.2" opacity=".35"/>
    <circle cx="120" cy="80" r="17" fill="url(#hs-plate)" stroke="#94A3B8" stroke-width="1.2" opacity=".45"/>
    <path d="M107 87 C111 92 129 92 133 87 C130 94 110 94 107 87 Z" fill="#CBD5E1" opacity=".55"/>
    <circle cx="120" cy="80" r="6.5" fill="url(#hs-hub)"/>
    <circle cx="117.4" cy="77.4" r="1.4" fill="#FFFFFF" opacity=".8"/>
  </g>

  <!-- daun merambat lewat gigi -->
  <g>
    <path d="M206 142 C190 124 180 104 184 82" stroke="#22C55E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M205 138 C191 121 182 103 185 84" stroke="#14532D" stroke-width="1" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M206 142 C212 140 216 136 214 131 C213 128 209 129 209 133" stroke="#34D399" stroke-width="2" fill="none" opacity=".85" stroke-linecap="round"/>
    <path d="M168 140 C158 116 168 94 190 88 C198 110 188 132 168 140 Z" fill="url(#hs-leaf)"/>
    <path d="M170 136 C174 118 182 104 188 94" stroke="#14532D" stroke-width="1.6" fill="none" opacity=".5" stroke-linecap="round"/>
    <path d="M174 122 C173 117 173 112 175 108" stroke="#14532D" stroke-width="1.1" fill="none" opacity=".35" stroke-linecap="round"/>
    <path d="M180 110 C179 106 179 102 181 99" stroke="#14532D" stroke-width="1" fill="none" opacity=".3" stroke-linecap="round"/>
    <path d="M169 132 C173 117 180 104 186 96" stroke="#D9F99D" stroke-width="1.8" fill="none" opacity=".5" stroke-linecap="round"/>
    <ellipse cx="178" cy="104" rx="2" ry="2.8" fill="#BBF7D0" opacity=".7"/>
    <circle cx="177.4" cy="103.2" r=".7" fill="#FFFFFF" opacity=".8"/>
    <path d="M196 134 C204 127 214 127 218 134 C213 141 203 141 196 134 Z" fill="url(#hs-leaf2)"/>
    <path d="M198 133 C204 130 210 130 215 132" stroke="#14532D" stroke-width="1" fill="none" opacity=".4" stroke-linecap="round"/>
  </g>

  <!-- serbuk sari & kilau -->
  <path d="M36 44 l2 6.4 6.4 2 -6.4 2 -2 6.4 -2 -6.4 -6.4 -2 6.4 -2 Z" fill="#FDE68A" opacity=".85"/>
  <circle cx="58" cy="118" r="4.5" fill="#FDE68A" opacity=".7"/>
  <circle cx="56.8" cy="116.8" r="1" fill="#FFFFFF" opacity=".75"/>
</svg>
