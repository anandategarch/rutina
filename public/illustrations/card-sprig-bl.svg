<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" preserveAspectRatio="xMinYMax meet">
  <!-- Rutina · SPRIG-BL — vektor semi-realistis: tunas garis tipis bergradasi halus di sudut kiri-bawah kartu -->
  <defs>
    <radialGradient id="w2" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#ECFDF5" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#ECFDF5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stemG2" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset=".5" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="lfA" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#ECFDF5"/>
      <stop offset=".5" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="lfB" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/>
      <stop offset=".5" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="cnS2" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="dwG2" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
  </defs>

  <rect width="110" height="100" fill="url(#w2)"/>

  <!-- batang tipis meruncing bergradasi -->
  <path d="M4 96.8C11 78.4 23 62.4 39 52.4C45 48.6 51 45.6 57.2 43.4L58.4 44.6C52.2 46.8 46.4 49.8 40.6 53.6C24.8 63.6 12.6 79.2 5.6 98.8Z" fill="url(#stemG2)"/>
  <path d="M5 97C12 79 24 63.4 40 53.4" fill="none" stroke="#D1FAE5" stroke-width=".7" opacity=".6" stroke-linecap="round"/>
  <path d="M41.6 54.6C26.6 64.6 14.4 79.8 7.6 97.6" fill="none" stroke="#15803D" stroke-width=".6" opacity=".3" stroke-linecap="round"/>

  <!-- daun tipis bergradasi lembut dengan urat tengah -->
  <g stroke-linejoin="round">
    <g transform="translate(21 73) rotate(-34) scale(.78)">
      <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfA)" stroke="#6EE7B7" stroke-width="1.4"/>
      <path d="M2 .6C10 -1.6 20 -2.6 27 -3.4" fill="none" stroke="#10B981" stroke-width=".8" opacity=".45" stroke-linecap="round"/>
      <path d="M2.6 -1.4C10 -6.6 19 -8.4 26 -6" fill="none" stroke="#F0FDF4" stroke-width=".9" opacity=".5" stroke-linecap="round"/>
    </g>
    <g transform="translate(35 57) rotate(-58) scale(.64)">
      <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfB)" stroke="#6EE7B7" stroke-width="1.5"/>
      <path d="M2 .6C10 -1.6 20 -2.6 27 -3.4" fill="none" stroke="#10B981" stroke-width=".9" opacity=".45" stroke-linecap="round"/>
      <path d="M2.6 -1.4C10 -6.6 19 -8.4 26 -6" fill="none" stroke="#F0FDF4" stroke-width="1" opacity=".5" stroke-linecap="round"/>
    </g>
    <!-- daun pucuk dengan embun mikro -->
    <g transform="translate(57 42) rotate(-76) scale(.7)">
      <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfA)" stroke="#6EE7B7" stroke-width="1.3" opacity=".9"/>
      <path d="M2 .6C10 -1.6 20 -2.6 27 -3.4" fill="none" stroke="#10B981" stroke-width=".8" opacity=".45" stroke-linecap="round"/>
      <ellipse cx="14" cy="-2" rx="1.1" ry="1.5" fill="url(#dwG2)" transform="rotate(-70 14 -2)"/>
      <circle cx="13.4" cy="-2.7" r=".4" fill="#FFFFFF" opacity=".85"/>
    </g>
    <g transform="translate(16 50) rotate(-16)">
      <path d="M0 0C5 -6 13 -7 20 -3C15 3 5 4 0 0Z" fill="url(#lfA)" stroke="#A7F3D0" stroke-width="1.3"/>
      <path d="M1.6 .4C7 -1.2 14 -1.8 18.4 -1.6" fill="none" stroke="#10B981" stroke-width=".7" opacity=".45" stroke-linecap="round"/>
    </g>
  </g>

  <!-- koin kecil halus dengan cincin dan kilau sabit -->
  <g>
    <circle cx="12" cy="68" r="5" fill="url(#cnS2)" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="12" cy="68" r="3.7" fill="none" stroke="#F59E0B" stroke-width=".6" opacity=".5"/>
    <path d="M8.6 66a4.4 4.4 0 0 1 3 -2" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".75"/>
    <circle cx="9.4" cy="66.2" r=".7" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- percik halus -->
  <path d="M45 72l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1z" fill="#FBBF24" opacity=".9"/>
  <circle cx="66" cy="57" r="2.4" fill="#A7F3D0"/>
  <circle cx="30" cy="38" r="1.9" fill="#A7F3D0" opacity=".8"/>
  <circle cx="52" cy="86" r="1.3" fill="#FDE68A" opacity=".7"/>
</svg>
