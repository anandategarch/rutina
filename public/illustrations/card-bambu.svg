  <path d="M63.2 -1.8C92 2.4 119 16.8 138.8 38.4C150.4 52.4 161.6 60.8 171.6 66.6L175.4 69.6C174.4 71.4 172 71.8 170.2 70.6C160.6 64.8 150 55.4 140.6 45.8C121.6 22.6 93.4 8.6 63.6 5.6C61.8 2.4 61.8 .2 63.2 -1.8Z" fill="url(#cl-bb)"/>
