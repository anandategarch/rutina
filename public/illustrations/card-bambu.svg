<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · BAMBU — vektor semi-realistis: buluh bergradasi buku bertekstur, kipas daun lancip berurat, embun -->
  <defs>
    <radialGradient id="w-bb" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#D1FAE5" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#ECFDF5" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cl-bb" x1="0" y1="0" x2=".6" y2=".45">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="bk-bb" x1=".1" y1="0" x2=".6" y2=".8">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="lf-bb" x1=".1" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="lf2-bb" x1=".1" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="ck-bb" cx=".4" cy=".35" r=".85">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
  </defs>
  <!-- cuci warna rumpun bambu di sudut -->
  <rect width="180" height="170" fill="url(#w-bb)"/>
