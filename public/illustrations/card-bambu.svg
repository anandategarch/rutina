    <path d="M-1-28C-2.4-31-2.6-34.4-1.6-37.6" fill="none" stroke="#14532D" stroke-width=".9" opacity=".3" stroke-linecap="round"/>
    <path d="M5-14C6.6-19 7-24.6 6-30" fill="none" stroke="#14532D" stroke-width=".9" opacity=".3" stroke-linecap="round"/>
