    <path d="M148 90l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1z" fill="#FBBF24" opacity=".9"/>
    <path d="M0 0C4-6 12-7 18-3C13 3 4 4 0 0Z" transform="translate(56 38) rotate(-30)" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1.2"/>
