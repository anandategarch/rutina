  <path d="M124 15C125.4 17.6 126.8 20 128.6 22" fill="none" stroke="#14532D" stroke-width="1.4" stroke-linecap="round" opacity=".3"/>
  <path d="M146 34C147.4 36.4 148.8 38.6 150.8 40.4" fill="none" stroke="#14532D" stroke-width="1.2" stroke-linecap="round" opacity=".28"/>
