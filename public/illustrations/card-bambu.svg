    <path d="M0 0C-.6-11 .4-22 6-34" fill="none" stroke="#14532D" stroke-width="1.1" opacity=".4" stroke-linecap="round"/>
    <path d="M-4-12C-5.8-15.4-6.6-19.4-6.4-23.4" fill="none" stroke="#14532D" stroke-width=".8" opacity=".3" stroke-linecap="round"/>
