<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Tagihan — membayar tagihan tepat waktu</title>
  <defs>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <linearGradient id="g-org" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema peach -->
  <circle cx="48" cy="48" r="46" fill="#FFEDD5"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="46" cy="78" rx="24" ry="4" fill="#0F172A" opacity=".07"/>
  <!-- L3 kertas tagihan -->
  <path d="M28 18h34l8 8v52H28z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M62 18v8h8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" stroke-linejoin="round"/>
  <!-- baris rincian -->
  <rect x="35" y="34" width="26" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="35" y="43" width="18" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="35" y="52" width="22" height="4" rx="2" fill="#E2E8F0"/>
  <!-- L4 stempel lunas -->
  <circle cx="56" cy="66" r="11.5" fill="url(#g-org)" opacity=".95"/>
  <path d="M50.5 66l4 4.5 8-9" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- koin -->
  <circle cx="26" cy="60" r="9" fill="url(#g-amb)" stroke="#B45309" stroke-width="2"/>
  <text x="26" y="64" text-anchor="middle" font-family="Poppins,Plus Jakarta Sans,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Rp</text>
  <!-- L6 bintang kilau -->
  <path d="M24 28l1.3 3.4 3.4 1.3-3.4 1.3L24 37.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
  <circle cx="74" cy="30" r="3" fill="#10B981"/>
</svg>
