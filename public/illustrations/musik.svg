<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Musik — mendengarkan musik dengan headphone</title>
  <defs>
    <linearGradient id="g-blu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema sky -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="78" rx="20" ry="4" fill="#0F172A" opacity=".07"/>
  <!-- L3 pita kepala -->
  <path d="M26 52v-6a22 22 0 0 1 44 0v6" stroke="url(#g-blu)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- L4 kilau pita -->
  <path d="M33 33c4-4 9-6 14-6.5" stroke="#FFFFFF" stroke-width="2.5" opacity=".5" fill="none" stroke-linecap="round"/>
  <!-- earmuff kiri & kanan -->
  <rect x="18" y="48" width="14" height="22" rx="6" fill="url(#g-blu)"/>
  <rect x="64" y="48" width="14" height="22" rx="6" fill="url(#g-blu)"/>
  <rect x="22" y="52" width="6" height="14" rx="3" fill="#93C5FD" opacity=".7"/>
  <rect x="68" y="52" width="6" height="14" rx="3" fill="#93C5FD" opacity=".7"/>
  <!-- L5 gelombang suara -->
  <path d="M12 44q-3 8 0 16M82 44q3 8 0 16" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M8 40q-4 14 0 24M86 40q4 14 0 24" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- nota kecil -->
  <circle cx="42" cy="66" r="3.5" fill="url(#g-amb)"/>
  <path d="M45.5 66V55l6 2" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- L6 bintang kilau -->
  <path d="M26 24l1.2 3 3 1.2-3 1.2L26 32.4l-1.2-3-3-1.2 3-1.2z" fill="#FBBF24"/>
</svg>
