<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" fill="none" role="img" aria-label="Perbukitan berlapis dengan koin keemasan yang bertunas">
  <defs>
    <linearGradient id="hgF-hill1" x1="60" y1="150" x2="200" y2="238" gradientUnits="userSpaceOnUse"><stop stop-color="#2F5D46"/><stop offset="1" stop-color="#24503B"/></linearGradient>
    <linearGradient id="hgF-hill2" x1="180" y1="130" x2="330" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#3A6B52"/><stop offset="1" stop-color="#2C5A44"/></linearGradient>
    <linearGradient id="hgF-coin" x1="316" y1="96" x2="382" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#F5D689"/><stop offset="1" stop-color="#DBA63E"/></linearGradient>
    <linearGradient id="hgF-sprout" x1="356" y1="42" x2="398" y2="96" gradientUnits="userSpaceOnUse"><stop stop-color="#A8C58B"/><stop offset="1" stop-color="#5C895E"/></linearGradient>
    <linearGradient id="hgF-wash" x1="0" y1="120" x2="460" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#8FBF9C" stop-opacity=".16"/><stop offset="1" stop-color="#8FBF9C" stop-opacity=".04"/></linearGradient>
  </defs>
  <!-- kabut lembut -->
  <ellipse cx="150" cy="70" rx="120" ry="46" fill="url(#hgF-wash)"/>
  <!-- bukit belakang -->
  <path d="M-20 206C40 128 96 118 150 158c34 25 60 28 88 12 40-23 82-16 118 18 22 21 44 26 64 20v32H-20Z" fill="url(#hgF-hill1)"/>
  <!-- bukit depan -->
  <path d="M112 240c-8-46 22-84 62-88 34-4 58 14 66 42 48 2 78 20 96 46H112Z" fill="url(#hgF-hill2)"/>
  <!-- garis lembah -->
  <path d="M132 216c30-28 62-36 96-24" stroke="#5FA27B" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
  <!-- koin bertumpuk -->
  <g>
    <circle cx="318" cy="150" r="27" fill="url(#hgF-coin)" stroke="#B9853B" stroke-width="3"/>
    <circle cx="318" cy="150" r="17" fill="none" stroke="#B9853B" stroke-width="2.4" opacity=".7"/>
    <circle cx="352" cy="164" r="22" fill="url(#hgF-coin)" stroke="#B9853B" stroke-width="3"/>
    <circle cx="352" cy="164" r="13" fill="none" stroke="#B9853B" stroke-width="2.2" opacity=".7"/>
    <path d="M345 158c-3-3 2-8 6-5" stroke="#8A6530" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  </g>
  <!-- tunas di atas koin -->
  <g>
    <path d="M330 128V96" stroke="#6FA27E" stroke-width="4" stroke-linecap="round"/>
    <path d="M330 112c-14-1-19-11-12-19 11 1 17 10 12 19Z" fill="url(#hgF-sprout)"/>
    <path d="M331 102c2-10 11-14 18-8-1 9-8 13-18 8Z" fill="#A8C58B"/>
  </g>
  <path d="M404 58l2.6 8.4 8.4 2.6-8.4 2.6-2.6 8.4-2.6-8.4-8.4-2.6 8.4-2.6Z" fill="#F5D689"/>
  <circle cx="60" cy="52" r="5" fill="#F5D689" opacity=".7"/>
  <circle cx="240" cy="40" r="4" fill="#F5D689" opacity=".5"/>
</svg>
