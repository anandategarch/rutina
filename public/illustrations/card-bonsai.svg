  <path d="M98 88C116 84 134 84 150 88L144 104C132 108 114 108 104 104Z" fill="url(#pt-bs)" stroke="#B45309" stroke-width=".8" stroke-opacity=".5"/>
  <path d="M138.4 90C132 93.4 116 93.4 110.4 90C116 91.6 132 91.6 138.4 90Z" fill="#92400E" opacity=".28"/>
