  <circle cx="158" cy="18" r="1.7" fill="#052E16" opacity=".38"/>
  <path d="M144 19C143 13 148 8 156 8" fill="none" stroke="#A7F3D0" stroke-width="1.3" opacity=".5" stroke-linecap="round"/>
