<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · BONSAI — vektor semi-realistis: kanopi pad berlapis berbintik, batang berkulit meruncing, pot terakota -->
  <defs>
    <radialGradient id="w-bs" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#D1FAE5" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#ECFDF5" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pd1-bs" x1=".1" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="pd2-bs" x1=".1" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="pd3-bs" x1=".1" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset=".5" stop-color="#15803D"/><stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="pd4-bs" x1=".1" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#D9F99D"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="tk-bs" x1=".1" y1="0" x2=".9" y2=".6">
      <stop offset="0" stop-color="#D97706"/><stop offset=".45" stop-color="#B45309"/><stop offset=".8" stop-color="#92400E"/><stop offset="1" stop-color="#6B3205"/>
    </linearGradient>
    <linearGradient id="pt-bs" x1=".2" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset=".55" stop-color="#F59E0B"/><stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="ft-bs" x1=".2" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#B45309"/>
