    <linearGradient id="g-blu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1: latar slate -->
  <circle cx="48" cy="48" r="46" fill="#F1F5F9"/>
  <circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2: bayangan tanah -->
