  <circle cx="48" cy="50" r="9.5" fill="url(#g-sky)"/>
  <circle cx="48" cy="50" r="5.5" fill="url(#g-blu)"/>
  <circle cx="44.5" cy="46.5" r="1.8" fill="#FFFFFF" opacity=".95"/>
