<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · APEL — buah apel berdaun di ranting: asupan yang menyiapkan
       tubuh (kartu Bugar: kalori & makro harian) -->
  <defs>
    <radialGradient id="w-ap" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FFEDD5" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#FFF7ED" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fr-ap" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="lf-ap" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- cusi panas lembut di sudut -->
  <rect width="180" height="170" fill="url(#w-ap)"/>

  <!-- tangkai utama melengkung ke sudut -->
  <path d="M58 2C96 4 132 20 156 46C165 56 172 64 177 74" fill="none" stroke="#9A3412" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>

  <!-- apel besar bergantung di ranting -->
  <g transform="translate(136 46)">
    <path d="M0 -12C1 -18 3 -22 6 -25" fill="none" stroke="#9A3412" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M6 -25C10 -31 17 -31 20 -26C16 -22 10 -22 6 -25Z" fill="url(#lf-ap)" stroke="#047857" stroke-width=".9" stroke-linejoin="round"/>
    <path d="M0 -12C-14 -18 -26 -4 -24 12C-22 26 -12 36 0 34C12 36 22 26 24 12C26 -4 14 -18 0 -12Z" fill="url(#fr-ap)" stroke="#C2410C" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M-16 -6C-20 2 -20 14 -14 22" stroke="#FFFFFF" stroke-width="2.4" opacity=".45" fill="none" stroke-linecap="round"/>
    <path d="M8 -8C-2 -12 -10 -6 -12 4" stroke="#FFFFFF" stroke-width="2" opacity=".28" fill="none" stroke-linecap="round"/>
  </g>

  <!-- apel kecil merah di ranting bawah -->
  <g transform="translate(84 26) scale(.48)">
    <path d="M0 -12C1 -18 3 -22 6 -25" fill="none" stroke="#9A3412" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 -25C10 -31 17 -31 20 -26C16 -22 10 -22 6 -25Z" fill="url(#lf-ap)" stroke="#047857" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M0 -12C-14 -18 -26 -4 -24 12C-22 26 -12 36 0 34C12 36 22 26 24 12C26 -4 14 -18 0 -12Z" fill="url(#fr-ap)" stroke="#C2410C" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- tunas apel di ujung ranting -->
  <g transform="translate(168 90) rotate(10) scale(.55)">
    <path d="M0 0C-2 2 -4 4 -5 6" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5 6C-10 4 -16 5 -18 9C-16 14 -10 15 -5 13C-3.4 10.6 -3.8 8 -5 6Z" fill="url(#lf-ap)" stroke="#047857" stroke-width="1.7" stroke-linejoin="round"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="68" cy="10" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="68" cy="10" r="2.6" fill="#FDE68A"/>

  <!-- percik panen -->
  <g>
    <circle cx="104" cy="14" r="2.6" fill="#FBBF24"/>
    <circle cx="98" cy="46" r="2.2" fill="#FB923C"/>
    <circle cx="122" cy="60" r="2" fill="#FED7AA" opacity=".9"/>
    <path d="M148 68l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
