<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · APEL — vektor semi-realistis: buah merah blus dengan kilau, kelopak sage, dan tangkai bergradasi -->
  <defs>
    <radialGradient id="w-ap" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FFEDD5" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#FFF7ED" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fr-ap" cx=".36" cy=".3" r="1">
      <stop offset="0" stop-color="#FEE2E2"/>
      <stop offset=".4" stop-color="#FECDD3"/>
      <stop offset=".75" stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#E11D48"/>
    </radialGradient>
    <radialGradient id="fr2-ap" cx=".36" cy=".3" r="1">
      <stop offset="0" stop-color="#FEE2E2"/>
      <stop offset=".55" stop-color="#FECDD3"/>
      <stop offset="1" stop-color="#FDA4AF"/>
    </radialGradient>
    <linearGradient id="cl-ap" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="stm-ap" x1=".2" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#B45309"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="br-ap" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset=".5" stop-color="#B45309"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="lf-ap" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="st-ap" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset=".5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="cn-ap" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="dw-ap" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
  </defs>

  <!-- cusi panas lembut di sudut -->
  <rect width="180" height="170" fill="url(#w-ap)"/>

  <!-- ranting kayu meruncing bergradasi -->
  <path d="M57.4 1.2C95.8 3 132.2 18.8 155.6 45.2C164.2 54.8 170.6 62.6 174.7 70.5L177.3 73.7C170.9 65.8 163.5 57.5 154.2 47.6C133 22 96.2 5.7 56.8 3.4Z" fill="url(#br-ap)"/>
  <path d="M58.4 2C96.6 3.8 132.6 19.6 156 46C164.6 55.6 170.8 63.2 174.6 70.6" fill="none" stroke="#FCD34D" stroke-width=".8" opacity=".45" stroke-linecap="round"/>
  <path d="M155 48.6C134.2 23.4 97.4 7 57.4 4.8" fill="none" stroke="#571F05" stroke-width=".8" opacity=".3" stroke-linecap="round"/>

  <!-- apel besar bergantung di ranting -->
  <g transform="translate(136 46)" stroke-linejoin="round">
    <!-- tangkai meruncing bergradasi -->
    <path d="M-.6 -11.6C.4 -17 2.6 -21.6 6 -25.2L7 -24.4C4 -21 2 -16.4 1.2 -11.4Z" fill="url(#stm-ap)"/>
    <path d="M.4 -12C1.2 -16.6 3 -20.6 6 -24" fill="none" stroke="#FCD34D" stroke-width=".6" opacity=".4" stroke-linecap="round"/>
    <!-- kelopak sage dengan urat -->
    <path d="M6 -25C10 -31 17 -31 20 -26C16 -22 10 -22 6 -25Z" fill="url(#cl-ap)" stroke="#15803D" stroke-width=".9"/>
    <path d="M8 -24.4C12 -27.2 16 -26.6 19 -25.4" fill="none" stroke="#14532D" stroke-width=".7" opacity=".4" stroke-linecap="round"/>
    <path d="M19.4 -25.6C17.2 -28.4 13.6 -29.4 10.4 -28.2" fill="none" stroke="#D9F99D" stroke-width="1" opacity=".55" stroke-linecap="round"/>
    <!-- badan apel: gradasi merah blus -->
    <path d="M0 -12C-14 -18 -26 -4 -24 12C-22 26 -12 36 0 34C12 36 22 26 24 12C26 -4 14 -18 0 -12Z" fill="url(#fr-ap)" stroke="#BE123C" stroke-width="1" />
    <!-- bayang inti kanan-bawah -->
    <path d="M13 2C15.4 14 9.4 26.4 .4 32C9 27.4 14.8 15 12.6 1.6Z" fill="#881337" opacity=".26"/>
    <!-- rim cahaya kiri-atas -->
    <path d="M-18 -4C-21 4 -20.6 16 -13.4 25.4" fill="none" stroke="#FECDD3" stroke-width="2" opacity=".5" stroke-linecap="round"/>
    <!-- kilau spekular -->
    <ellipse cx="-9" cy="-4" rx="2.4" ry="4" fill="#FFFFFF" opacity=".6" transform="rotate(-16 -9 -4)"/>
    <circle cx="-6" cy="-7.4" r="1.1" fill="#FFFFFF" opacity=".7"/>
    <!-- lipatan bawah buah -->
    <path d="M-2 30.4C-4 32.6 -1.4 33.8 0 32.6" fill="none" stroke="#BE123C" stroke-width=".8" opacity=".4" stroke-linecap="round"/>
    <!-- embun di badan apel -->
    <ellipse cx="-16" cy="14" rx="1.6" ry="2.2" fill="url(#dw-ap)" transform="rotate(-24 -16 14)"/>
    <circle cx="-16.8" cy="13.2" r=".55" fill="#FFFFFF" opacity=".85"/>
  </g>

  <!-- apel kecil di ranting bawah -->
  <g transform="translate(84 26) scale(.48)" stroke-linejoin="round">
    <path d="M-.6 -11.6C.4 -17 2.6 -21.6 6 -25.2L7 -24.4C4 -21 2 -16.4 1.2 -11.4Z" fill="url(#stm-ap)"/>
    <path d="M6 -25C10 -31 17 -31 20 -26C16 -22 10 -22 6 -25Z" fill="url(#cl-ap)" stroke="#15803D" stroke-width="1.4"/>
    <path d="M0 -12C-14 -18 -26 -4 -24 12C-22 26 -12 36 0 34C12 36 22 26 24 12C26 -4 14 -18 0 -12Z" fill="url(#fr2-ap)" stroke="#BE123C" stroke-width="1.8"/>
    <path d="M13 2C15.4 14 9.4 26.4 .4 32C9 27.4 14.8 15 12.6 1.6Z" fill="#881337" opacity=".22"/>
    <ellipse cx="-9" cy="-4" rx="2.6" ry="4.4" fill="#FFFFFF" opacity=".5" transform="rotate(-16 -9 -4)"/>
  </g>

  <!-- tunas apel di ujung ranting -->
  <g transform="translate(168 90) rotate(10) scale(.55)" stroke-linejoin="round">
    <path d="M0 0C-2 2 -4 4 -5 6" fill="none" stroke="url(#st-ap)" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5 6C-10 4 -16 5 -18 9C-16 14 -10 15 -5 13C-3.4 10.6 -3.8 8 -5 6Z" fill="url(#lf-ap)" stroke="#14532D" stroke-width="1.4"/>
    <path d="M-5.6 6.6C-9 5.8 -13 6 -16.6 9.4" fill="none" stroke="#14532D" stroke-width="1" opacity=".4" stroke-linecap="round"/>
  </g>

  <!-- koin amber: muka radial, cincin, kecambah timbul, kilau sabit -->
  <g>
    <circle cx="68" cy="10" r="6.4" fill="url(#cn-ap)" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="68" cy="10" r="4.7" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M68 13.6C68.2 12.2 69 11.2 70.3 10.8" fill="none" stroke="#B45309" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M70.3 10.8C70 9.4 70.8 8.2 72.1 8.4C72.3 9.7 71.5 10.8 70.3 10.8Z" fill="#D97706" opacity=".9"/>
    <path d="M70.3 10.8C69.6 9.4 68.2 9 67.2 9.8C67.6 11.1 69 11.6 70.3 10.8Z" fill="#B45309" opacity=".9"/>
    <path d="M64.2 7.2a5.6 5.6 0 0 1 3.8 -2.6" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    <circle cx="65.4" cy="7.4" r=".8" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- percik panen: titik berkilau -->
  <g>
    <circle cx="104" cy="14" r="2.6" fill="#FBBF24"/>
    <circle cx="103.2" cy="13.2" r=".9" fill="#FEF3C7" opacity=".8"/>
    <circle cx="98" cy="46" r="2.2" fill="#FDA4AF" opacity=".9"/>
    <circle cx="122" cy="60" r="2" fill="#86EFAC" opacity=".9"/>
    <circle cx="122.6" cy="59.4" r=".7" fill="#D9F99D" opacity=".8"/>
    <path d="M148 68l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1z" fill="#FBBF24" opacity=".9"/>
    <circle cx="112" cy="54" r="1.6" fill="#FDE68A" opacity=".7"/>
  </g>
</svg>
