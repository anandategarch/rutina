<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · PINUS — ranting cemara yang hijau sepanjang tahun: kebiasaan
       yang tak kenal musim (kartu kebiasaan: konsistensi lintas musim) -->
  <defs>
    <radialGradient id="w-pn" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#F0FDF4" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#F7FEF9" stop-opacity=".24"/>
      <stop offset="1" stop-color="#F7FEF9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cn-pn" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- cuci warna hutan pinus di sudut -->
  <rect width="180" height="170" fill="url(#w-pn)"/>

  <!-- ranting utama melengkung ke sudut -->
  <path d="M58 2C96 4 132 20 156 46C165 56 172 64 177 74" fill="none" stroke="#92400E" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>

  <!-- rumpun jarum pinus menggantung dari ranting (v berpasangan melengkung) -->
  <g stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".88">
    <path d="M70 5c-2 5 -4 8 -7 11"/>
    <path d="M70 5c2 6 3 9 6 13"/>
    <path d="M88 9c-2 5 -4 8 -7 11"/>
    <path d="M88 9c2 6 3 9 6 13"/>
    <path d="M106 15c-2 5 -4 8 -7 11"/>
    <path d="M106 15c2 6 3 9 6 13"/>
    <path d="M124 23c-2 5 -4 8 -6 11"/>
    <path d="M124 23c2 6 3 9 5 13"/>
    <path d="M140 34c-2 5 -3 8 -6 11"/>
    <path d="M140 34c2 6 3 9 5 13"/>
    <path d="M154 46c-2 5 -3 8 -5 11"/>
    <path d="M154 46c2 6 2 9 4 13"/>
    <path d="M165 59c-2 5 -2 8 -4 11"/>
    <path d="M165 59c2 6 2 9 3 13"/>
  </g>

  <!-- kerucut pinus menggantung -->
  <g transform="translate(140 62) rotate(-10)">
    <path d="M-9 -8C-11 -2 -11 8 -7 15C-4 18 4 18 7 15C11 8 11 -2 9 -8C4 -11 -4 -11 -9 -8Z" fill="url(#cn-pn)" stroke="#B45309" stroke-width="1.1" stroke-linejoin="round"/>
    <g fill="none" stroke="#B45309" stroke-width=".9" opacity=".65">
      <path d="M-7.5 -3C-3 0 3 0 7.5 -3"/>
      <path d="M-7 4C-3 7 3 7 7 4"/>
      <path d="M-4.5 10.5C-1.5 12.5 1.5 12.5 4.5 10.5"/>
    </g>
    <path d="M0 -9C-1 -14 -2 -18 -4 -21" fill="none" stroke="#92400E" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g transform="translate(171 96) rotate(8) scale(.62)">
    <path d="M-9 -8C-11 -2 -11 8 -7 15C-4 18 4 18 7 15C11 8 11 -2 9 -8C4 -11 -4 -11 -9 -8Z" fill="#FCD34D" stroke="#B45309" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-7.5 -3C-3 0 3 0 7.5 -3" fill="none" stroke="#B45309" stroke-width="1.3" opacity=".65"/>
  </g>

  <!-- serpih salut salju (aksen musim) -->
  <g fill="#FFFFFF" stroke="#BAE6FD" stroke-width=".7">
    <circle cx="103" cy="34" r="2.4"/>
    <circle cx="120" cy="47" r="1.8"/>
    <circle cx="89" cy="23" r="1.5"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="70" cy="14" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="70" cy="14" r="2.6" fill="#FDE68A"/>

  <!-- percik -->
  <g>
    <circle cx="94" cy="60" r="2.6" fill="#FBBF24"/>
    <circle cx="87" cy="70" r="2.2" fill="#34D399"/>
    <circle cx="101" cy="50" r="2" fill="#A7F3D0" opacity=".9"/>
    <path d="M118 84l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
