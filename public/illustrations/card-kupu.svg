<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · KUPU — kupu-kupu hinggap di ranting: suasana hati yang ringan (kartu check-in harian) -->
  <defs>
    <radialGradient id="w-kp" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#D1FAE5" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#FEF3C7" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wg-kp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="wg2-kp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- cuci warna pagi kebun di sudut -->
  <rect width="180" height="170" fill="url(#w-kp)"/>

  <!-- ranting melengkung ke sudut -->
  <path d="M56 2C94 6 130 22 152 48C162 58 170 66 176 74" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" opacity=".92"/>
  <path d="M152 48C146 56 142 62 138 68" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>

  <!-- daun mint -->
  <g stroke-linejoin="round">
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(70 14) rotate(-18) scale(.68)" fill="#A7F3D0"/>
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(118 32) rotate(-44) scale(.6)" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.3"/>
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(166 92) rotate(-16) scale(.46)" fill="#A7F3D0"/>
  </g>

  <!-- bunga kecil tempat hinggap -->
  <g transform="translate(118 52)">
    <g fill="#FDE68A" stroke="#F59E0B" stroke-width="1">
      <ellipse rx="4.6" ry="8.6" transform="rotate(0) translate(0 -7)"/>
      <ellipse rx="4.6" ry="8.6" transform="rotate(72) translate(0 -7)"/>
      <ellipse rx="4.6" ry="8.6" transform="rotate(144) translate(0 -7)"/>
      <ellipse rx="4.6" ry="8.6" transform="rotate(216) translate(0 -7)"/>
      <ellipse rx="4.6" ry="8.6" transform="rotate(288) translate(0 -7)"/>
    </g>
    <circle r="4.2" fill="#F59E0B"/>
  </g>

  <!-- kupu-kupu besar (sayap atas amber, sayap bawah mint) — di bawah zona art kepala -->
  <g transform="translate(138 98) rotate(18)">
    <!-- sayap kiri -->
    <g>
      <path d="M-4 0C-14-22 -34-26 -40-14C-42-2 -26 6 -6 5Z" fill="url(#wg-kp)" stroke="#EA580C" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M-5 6C-15 18 -30 22 -36 14C-38 6 -22 2 -5 4Z" fill="url(#wg2-kp)" stroke="#10B981" stroke-width="1.1" stroke-linejoin="round"/>
      <circle cx="-30" cy="-12" r="3" fill="#FDE68A" opacity=".9"/>
      <circle cx="-27" cy="12" r="2.4" fill="#ECFDF5" opacity=".9"/>
    </g>
    <!-- sayap kanan -->
    <g>
      <path d="M4 0C14-22 34-26 40-14C42-2 26 6 6 5Z" fill="url(#wg-kp)" stroke="#EA580C" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M5 6C15 18 30 22 36 14C38 6 22 2 5 4Z" fill="url(#wg2-kp)" stroke="#10B981" stroke-width="1.1" stroke-linejoin="round"/>
      <circle cx="30" cy="-12" r="3" fill="#FDE68A" opacity=".9"/>
      <circle cx="27" cy="12" r="2.4" fill="#ECFDF5" opacity=".9"/>
    </g>
    <!-- badan & antena -->
    <ellipse rx="3.2" ry="11" fill="#92400E"/>
    <path d="M-1.6-9C-4-14 -6-16 -8-17M1.6-9C4-14 6-16 8-17" fill="none" stroke="#92400E" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="-8" cy="-17" r="1.4" fill="#92400E"/>
    <circle cx="8" cy="-17" r="1.4" fill="#92400E"/>
  </g>

  <!-- kupu kecil jauh -->
  <g transform="translate(84 42) rotate(-24) scale(.34)" opacity=".85">
    <path d="M-4 0C-14-22 -34-26 -40-14C-42-2 -26 6 -6 5Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.4"/>
    <path d="M4 0C14-22 34-26 40-14C42-2 26 6 6 5Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.4"/>
    <ellipse rx="3.2" ry="11" fill="#92400E"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="66" cy="32" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="66" cy="32" r="2.6" fill="#FDE68A"/>

  <!-- percik -->
  <g>
    <circle cx="172" cy="102" r="2.6" fill="#FBBF24"/>
    <circle cx="176" cy="90" r="2.2" fill="#34D399"/>
    <circle cx="162" cy="110" r="2" fill="#A7F3D0" opacity=".9"/>
    <path d="M104 62l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
