<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Jam pasir melambangkan waktu yang berjalu">
  <!-- Definisi gradien lokal -->
  <defs>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="g-amb2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- L1: latar lingkaran amber -->
  <circle cx="48" cy="48" r="46" fill="#FEF3C7"/>
  <circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2: bayangan tanah -->
  <ellipse cx="48" cy="81" rx="22" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- L3: subjek utama, jam pasir dengan bingkai kayu -->
  <path d="M33 26h30l-13.6 20v4L63 70H33l13.6-20v-4z" fill="#FFFFFF" opacity=".55"/>
  <path d="M33 26h30l-13.6 20v4L63 70H33l13.6-20v-4z" fill="url(#g-bghigh)"/>
  <rect x="27" y="17" width="42" height="9" rx="3.5" fill="url(#g-amb)"/>
  <rect x="27" y="70" width="42" height="9" rx="3.5" fill="url(#g-amb)"/>
  <path d="M42 38h12l-6 8.5z" fill="url(#g-amb2)"/>
  <rect x="47.3" y="48" width="1.4" height="9.5" fill="#F59E0B"/>
  <path d="M40 60.5c2.6-3.2 5.3-4.7 8-4.7 2.7 0 5.4 1.5 8 4.7l7 9.5H33z" fill="url(#g-amb2)"/>
  <!-- L4: kilau kaca -->
  <path d="M36.5 30.5c-.9 4.8 1.4 9.6 5.8 13" stroke="#FFFFFF" stroke-width="2.2" opacity=".55" stroke-linecap="round"/>
  <!-- L5: aksen kecil, paku kayu dan titik -->
  <circle cx="48" cy="21.5" r="1.6" fill="#B45309"/>
  <circle cx="48" cy="74.5" r="1.6" fill="#B45309"/>
  <circle cx="24" cy="58" r="3" fill="#38BDF8"/>
  <!-- L6: kilau bintang -->
  <path d="M74 24l1.1 3 3 1.1-3 1.1-1.1 3-1.1-3-3-1.1 3-1.1z" fill="#FBBF24"/>
</svg>
