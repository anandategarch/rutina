<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" fill="none" role="img" aria-label="Tumpukan kertas daun dengan pensil dan pesawat kertas">
  <defs>
    <linearGradient id="hgW-paper" x1="90" y1="90" x2="300" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#FDF6EC"/><stop offset="1" stop-color="#F0E5D2"/></linearGradient>
    <linearGradient id="hgW-pencil" x1="330" y1="60" x2="370" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#E09963"/><stop offset="1" stop-color="#B96D45"/></linearGradient>
    <linearGradient id="hgW-leaf" x1="60" y1="120" x2="120" y2="196" gradientUnits="userSpaceOnUse"><stop stop-color="#9DBF7B"/><stop offset="1" stop-color="#477C51"/></linearGradient>
  </defs>
  <ellipse cx="210" cy="206" rx="170" ry="8" fill="#456C4D" opacity=".11"/>
  <!-- tumpukan kertas -->
  <g>
    <rect x="86" y="120" width="150" height="70" rx="9" fill="#E9DEC8" transform="rotate(-6 86 120)"/>
    <rect x="96" y="96" width="156" height="74" rx="9" fill="#F3E8D7" transform="rotate(-3 96 96)"/>
    <rect x="102" y="76" width="160" height="76" rx="10" fill="url(#hgW-paper)"/>
    <path d="M120 98h72M120 114h96M120 130h60" stroke="#C4B49A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M238 84l4.5 5 4.5-5-4.5-5Z" fill="#EDC77F"/>
  </g>
  <!-- pena -->
  <g transform="rotate(18 340 120)">
    <rect x="330" y="62" width="10" height="88" rx="5" fill="url(#hgW-pencil)"/>
    <path d="M330 150h10l-5 16Z" fill="#477B56"/>
    <rect x="327" y="50" width="16" height="14" rx="5" fill="#E9AD91"/>
    <rect x="332" y="86" width="6" height="40" rx="3" fill="#FDF6EC" opacity=".7"/>
  </g>
  <!-- pesawat kertas daun -->
  <g>
    <path d="M52 62l54 20-38 22Z" fill="#FDF6EC" stroke="#C4B49A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M68 78l38 4-16 14Z" fill="#E9DEC8"/>
    <path d="M28 54c14-10 30-8 36 4-12 8-28 7-36-4Z" fill="url(#hgW-leaf)" opacity=".9"/>
  </g>
  <!-- daun sudut -->
  <path d="M380 196c-2-12 6-20 17-20 3 12-5 19-17 20Z" fill="#A8C58B"/>
  <path d="M376 60c10-9 22-7 26 4-9 8-20 7-26-4Z" fill="#9DBF7B" opacity=".85"/>
  <path d="M396 122l1.8 5.6 5.6 1.8-5.6 1.8-1.8 5.6-1.8-5.6-5.6-1.8 5.6-1.8Z" fill="#EDC77F"/>
  <circle cx="44" cy="170" r="4" fill="#E9AD91" opacity=".8"/>
</svg>
