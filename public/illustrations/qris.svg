<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>QRIS — bayar dengan ponsel</title>
  <defs>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema emerald -->
  <circle cx="48" cy="48" r="46" fill="#ECFDF5"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="80" rx="20" ry="4" fill="#0F172A" opacity=".07"/>
  <!-- L3 ponsel -->
  <rect x="28" y="18" width="40" height="62" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="33" y="26" width="30" height="44" rx="4" fill="#F8FAFC"/>
  <!-- pola QR -->
  <g fill="url(#g-em)">
    <rect x="37" y="30" width="9" height="9" rx="1.5"/>
    <rect x="40" y="33" width="3" height="3" rx="0.8" fill="#F8FAFC"/>
    <rect x="50" y="30" width="9" height="9" rx="1.5"/>
    <rect x="53" y="33" width="3" height="3" rx="0.8" fill="#F8FAFC"/>
    <rect x="37" y="41" width="9" height="9" rx="1.5"/>
    <rect x="40" y="44" width="3" height="3" rx="0.8" fill="#F8FAFC"/>
    <rect x="50" y="43" width="4" height="4" rx="1"/>
    <rect x="56" y="49" width="4" height="4" rx="1"/>
    <rect x="50" y="55" width="4" height="4" rx="1" fill="#10B981"/>
    <rect x="44" y="49" width="4" height="4" rx="1" fill="#10B981"/>
  </g>
  <!-- L4 garis pindai -->
  <path d="M34 40h28" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
  <path d="M42 40l-8-2M54 40l8-2" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- tombol & speaker ponsel -->
  <rect x="43" y="22" width="10" height="2" rx="1" fill="#CBD5E1"/>
  <circle cx="48" cy="76" r="2.5" fill="#CBD5E1"/>
  <!-- L5 sinyal nirkabel -->
  <path d="M22 34q-3-6 0-12M74 34q3-6 0-12" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85"/>
  <!-- L6 bintang kilau -->
  <path d="M22 56l1.2 3 3 1.2-3 1.2L22 64.6l-1.2-3-3-1.2 3-1.2z" fill="#FBBF24"/>
  <circle cx="74" cy="58" r="3" fill="#38BDF8"/>
</svg>
