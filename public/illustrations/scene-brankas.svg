<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" fill="none" role="img" aria-label="Brankas kokoh dengan tunas tumbuh di atasnya dan tumpukan koin di samping">
  <defs>
    <linearGradient id="sbBg" x1="0" y1="0" x2="360" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFEF8"/><stop offset=".5" stop-color="#F2FDF5"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient>
    <linearGradient id="sbSafe" x1="120" y1="30" x2="250" y2="104" gradientUnits="userSpaceOnUse"><stop stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <radialGradient id="sbCoin" cx=".5" cy=".5" r=".5"><stop stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
  </defs>
  <rect width="360" height="110" rx="14" fill="url(#sbBg)"/>
  <ellipse cx="185" cy="104" rx="120" ry="6" fill="#059669" opacity=".12"/>
  <!-- brankas -->
  <g>
    <rect x="118" y="34" width="134" height="70" rx="12" fill="url(#sbSafe)"/>
    <rect x="118" y="34" width="134" height="14" rx="7" fill="#10B981"/>
    <rect x="128" y="56" width="64" height="38" rx="8" fill="#065F46" opacity=".28"/>
    <rect x="128" y="56" width="64" height="38" rx="8" fill="none" stroke="#A7F3D0" stroke-width="2" opacity=".8"/>
    <!-- pemutar kombinasi -->
    <circle cx="216" cy="76" r="17" fill="#064E3B"/>
    <circle cx="216" cy="76" r="12" fill="#059669" stroke="#A7F3D0" stroke-width="2"/>
    <path d="M216 64v7" stroke="#FCD34D" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="216" cy="76" r="2.6" fill="#FDE68A"/>
    <!-- kaki brankas -->
    <rect x="126" y="100" width="16" height="6" rx="3" fill="#065F46"/>
    <rect x="228" y="100" width="16" height="6" rx="3" fill="#065F46"/>
    <!-- kilau pintu -->
    <path d="M136 64c0 10 4 18 12 23" stroke="#D1FAE5" stroke-width="2.6" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- tunas tumbuh di atas brankas — saldo yang hidup -->
  <g transform="translate(163 34)">
    <path d="M0 0v-14" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <path d="M0-6c-9-1-12-7-5-11 7 1 12 6 5 11Z" fill="#34D399"/>
    <path d="M2-10c2-8 9-10 14-6-1 7-7 10-14 6Z" fill="#10B981"/>
  </g>
  <!-- tumpukan koin kiri -->
  <g>
    <ellipse cx="86" cy="96" rx="26" ry="5" fill="#059669" opacity=".1"/>
    <g>
      <ellipse cx="86" cy="92" rx="17" ry="6" fill="#F59E0B"/>
      <ellipse cx="86" cy="88" rx="17" ry="6" fill="#FCD34D"/>
      <ellipse cx="86" cy="84" rx="17" ry="6" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
      <path d="M79 84l7-3 7 3-7 3Z" fill="#D97706" opacity=".8"/>
    </g>
    <circle cx="60" cy="72" r="8" fill="url(#sbCoin)" stroke="#D97706" stroke-width="1.3"/>
    <path d="M60 68v8M56.5 72h7" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- koin jatuh ke tumpukan kanan -->
  <g>
    <circle cx="296" cy="60" r="8" fill="url(#sbCoin)" stroke="#D97706" stroke-width="1.3"/>
    <path d="M296 56v8M292.5 60h7" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="310" cy="78" r="6.2" fill="url(#sbCoin)" stroke="#D97706" stroke-width="1.2" opacity=".95"/>
    <path d="M310 75v6M307 78h6" stroke="#B45309" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M298 66c4 3 8 5 10 9" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1 5" opacity=".7"/>
    <ellipse cx="300" cy="96" rx="22" ry="4.6" fill="#059669" opacity=".1"/>
    <ellipse cx="300" cy="93" rx="15" ry="5" fill="#F59E0B"/>
    <ellipse cx="300" cy="89" rx="15" ry="5" fill="#FCD34D"/>
  </g>
  <!-- percikan perlindungan -->
  <path d="M252 22l4 6M138 18l-4 6M186 8v7" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>
  <circle cx="330" cy="26" r="4" fill="#A7F3D0" opacity=".9"/>
  <circle cx="30" cy="36" r="3.4" fill="#A7F3D0" opacity=".8"/>
  <!-- rumput kiri -->
  <g stroke="#047857" stroke-width="2.6" stroke-linecap="round" opacity=".8">
    <path d="M26 98c-3-5 2-8 0-12"/>
    <path d="M40 100c3-5-2-8 0-12"/>
  </g>
</svg>
