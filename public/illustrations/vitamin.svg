<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Vitamin — kebiasaan minum vitamin</title>
  <defs>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema emerald -->
  <circle cx="48" cy="48" r="46" fill="#ECFDF5"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="76" rx="22" ry="4" fill="#0F172A" opacity=".07"/>
  <!-- L3 kapsul besar (miring) -->
  <g transform="rotate(38 48 50)">
    <rect x="28" y="42" width="24" height="16" rx="8" fill="#FFFFFF"/>
    <rect x="52" y="42" width="16" height="16" rx="8" fill="url(#g-em)"/>
    <rect x="28" y="42" width="40" height="16" rx="8" fill="none" stroke="#D1FAE5" stroke-width="2"/>
    <path d="M32 46h8" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
  </g>
  <!-- L4 kilau kapsul -->
  <path d="M36 62q2-6 7-9" stroke="#FFFFFF" stroke-width="2" opacity=".4" stroke-linecap="round" fill="none"/>
  <!-- pil kecil -->
  <circle cx="26" cy="34" r="5.5" fill="url(#g-amb)"/>
  <path d="M23.5 31.5a5.5 5.5 0 0 1 4-1.5" stroke="#FFFFFF" stroke-width="2" opacity=".5" fill="none" stroke-linecap="round"/>
  <!-- L5 daun sehat -->
  <path d="M68 64c-2-6 1.5-10 7-10 1 5.5-2.5 9.5-7 10z" fill="#6EE7B7"/>
  <path d="M68.5 63.5L73 55.5" stroke="#047857" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>
  <!-- plus kesehatan -->
  <path d="M70 26v8M66 30h8" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- L6 bintang kilau -->
  <path d="M24 56l1.3 3.4 3.4 1.3-3.4 1.3L24 65.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
