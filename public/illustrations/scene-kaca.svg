<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" fill="none" role="img" aria-label="Kaca pembesar mengamatj dua tunas dengan percikan penemuan">
  <!-- Rutina · kaca penemuan — vektor semi-realistis: kaca pembesar berbingkai sage memeriksa tunas dengan kilau lensa -->
  <defs>
    <linearGradient id="latar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FEE7"/><stop offset=".5" stop-color="#ECFDF5"/><stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="bingkai" x1=".05" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#4ADE80"/><stop offset=".5" stop-color="#15803D"/><stop offset="1" stop-color="#052E16"/>
    </linearGradient>
    <linearGradient id="lensa" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".92"/><stop offset=".55" stop-color="#E0F2FE" stop-opacity=".78"/><stop offset="1" stop-color="#BAE6FD" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="gagang" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#FDE68A"/><stop offset=".45" stop-color="#F59E0B"/><stop offset=".8" stop-color="#D97706"/><stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="daunKiri" x1=".15" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".42" stop-color="#4ADE80"/><stop offset=".8" stop-color="#16A34A"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="daunKanan" x1=".85" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".42" stop-color="#34D399"/><stop offset=".8" stop-color="#15803D"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="batang" x1="0" y1="1" x2=".18" y2="0">
      <stop offset="0" stop-color="#14532D"/><stop offset=".5" stop-color="#22C55E"/><stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <radialGradient id="sinar" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bayang" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#052E16" stop-opacity=".22"/><stop offset=".62" stop-color="#052E16" stop-opacity=".09"/><stop offset="1" stop-color="#052E16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kerikil" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#EBDDD0"/><stop offset=".5" stop-color="#C9A57E"/><stop offset="1" stop-color="#8A6642"/>
    </radialGradient>
  </defs>
  <rect width="180" height="120" rx="14" fill="url(#latar)"/>
  <circle cx="24" cy="20" r="24" fill="url(#sinar)"/>
  <ellipse cx="90" cy="112" rx="60" ry="5.5" fill="url(#bayang)"/>
  <!-- percikan penemuan -->
  <path d="M34 26 l2.6 5.6 5.6 2.6 -5.6 2.6 -2.6 5.6 -2.6 -5.6 -5.6 -2.6 5.6 -2.6 Z" fill="#FCD34D"/>
  <path d="M148 38 l2 4.4 4.4 2 -4.4 2 -2 4.4 -2 -4.4 -4.4 -2 4.4 -2 Z" fill="#A7F3D0" opacity=".9"/>
  <circle cx="22" cy="66" r="2.4" fill="#7DD3FC" opacity=".8"/>
  <circle cx="160" cy="22" r="2" fill="#FDE68A" opacity=".8"/>
  <circle cx="56" cy="14" r="1.6" fill="#FDE68A" opacity=".6"/>
  <!-- tunas tinggi di kiri -->
  <g transform="translate(36 84)">
    <path d="M0 18 C-.5 10 -.5 2 0 -4" stroke="url(#batang)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M0 8 C-9 7 -12 1 -5 -3 C3 -2 0 4 0 8 Z" fill="url(#daunKiri)"/>
    <path d="M-1 6 C-4 4 -7 1 -5.5 -1.5" stroke="#14532D" stroke-width=".9" fill="none" opacity=".45" stroke-linecap="round"/>
    <path d="M2 2 C4 -6 11 -8 16 -4 C15 3 8 6 2 2 Z" fill="url(#daunKanan)"/>
    <path d="M3 0 C7 -3 11 -4 14 -3" stroke="#14532D" stroke-width=".9" fill="none" opacity=".45" stroke-linecap="round"/>
    <ellipse cx="-4" cy="2" rx="1.8" ry="2.4" fill="#BBF7D0" opacity=".65" transform="rotate(-24 -4 2)"/>
    <circle cx="-4.5" cy="1" r=".7" fill="#FFFFFF" opacity=".8"/>
    <circle cx="16" cy="-6" r="3" fill="#FCD34D"/>
    <circle cx="14.8" cy="-7" r=".9" fill="#FFFBEB" opacity=".7"/>
    <ellipse cx="9" cy="3" rx="2.2" ry="1.7" fill="#E11D48"/>
    <circle cx="7.4" cy="2.8" r=".9" fill="#450A0A"/>
    <path d="M9 1.6 C9.6 2.6 9.6 4 9 5" stroke="#450A0A" stroke-width=".6" fill="none" opacity=".7"/>
  </g>
  <!-- dua tunas kecil di bawah lensa -->
  <g transform="translate(90 88)">
    <path d="M0 16 V2" stroke="url(#batang)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M0 9 C-7 8 -9 3 -4 0 C6 1 0 4 0 9 Z" fill="url(#daunKiri)"/>
    <path d="M-1 7.5 C-4 6 -6 3.5 -5 1.5" stroke="#14532D" stroke-width=".8" fill="none" opacity=".45" stroke-linecap="round"/>
    <path d="M-14 18 V8" stroke="url(#batang)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M-14 12 C-19 11 -21 8 -17 6 C-11 7 -12 10 -14 12 Z" fill="url(#daunKanan)" opacity=".9"/>
    <path d="M-14.8 10.5 C-17 9.5 -18.5 8 -18 6.6" stroke="#14532D" stroke-width=".8" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M14 18 V6" stroke="url(#batang)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M14 10 C19 9 21 6 17 4 C11 5 12 8 14 10 Z" fill="url(#daunKiri)" opacity=".9"/>
    <path d="M14.8 8.5 C17 7.5 18.5 6 18 4.6" stroke="#14532D" stroke-width=".8" fill="none" opacity=".4" stroke-linecap="round"/>
    <circle cx="4" cy="0" r="2.6" fill="#FDE68A"/>
    <circle cx="3.2" cy="-0.8" r=".8" fill="#FFFBEB" opacity=".7"/>
  </g>
  <!-- kaca pembesar -->
  <g>
    <circle cx="90" cy="44" r="30" fill="url(#sinar)"/>
    <circle cx="90" cy="44" r="26" fill="url(#lensa)"/>
    <path d="M112 56 A23 23 0 0 1 96 66" stroke="#7DD3FC" stroke-width="3" fill="none" opacity=".4" stroke-linecap="round"/>
    <circle cx="90" cy="44" r="26" fill="none" stroke="url(#bingkai)" stroke-width="6"/>
    <circle cx="90" cy="44" r="29" fill="none" stroke="#052E16" stroke-width="1" opacity=".4"/>
    <path d="M66 35 A26 26 0 0 1 103 22" stroke="#BBF7D0" stroke-width="2" fill="none" opacity=".7" stroke-linecap="round"/>
    <path d="M114 53 A26 26 0 0 1 96 69" stroke="#052E16" stroke-width="1.6" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M72 32 C74 26 79 22 85 20" stroke="#FFFFFF" stroke-width="4" fill="none" opacity=".9" stroke-linecap="round"/>
    <path d="M66 42 C66 36 68 30 72 26" stroke="#FFFFFF" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>
    <ellipse cx="102" cy="58" rx="5" ry="3" fill="#FFFBEB" opacity=".55" transform="rotate(-30 102 58)"/>
    <g transform="rotate(42 113 83)">
      <rect x="108" y="66" width="10" height="34" rx="5" fill="url(#gagang)"/>
      <rect x="110.5" y="69" width="4" height="28" rx="2" fill="#FFFBEB" opacity=".6"/>
      <rect x="107.6" y="95" width="10.8" height="5" rx="2.5" fill="#92400E" opacity=".85"/>
    </g>
  </g>
  <!-- rumput dan kerikil -->
  <g stroke-linecap="round" fill="none">
    <path d="M146 102 C143 98 148 95 146 92" stroke="#4ADE80" stroke-width="2.4" opacity=".85"/>
    <path d="M158 104 C161 100 156 97 158 94" stroke="#22C55E" stroke-width="2.2" opacity=".8"/>
    <path d="M140 104 C138 100 140 97 143 95" stroke="#34D399" stroke-width="2" opacity=".8"/>
    <path d="M165 108 C163 105 164 102 167 100" stroke="#16A34A" stroke-width="2" opacity=".75"/>
  </g>
  <ellipse cx="152" cy="107" rx="5.5" ry="3.2" fill="url(#kerikil)"/>
  <ellipse cx="150.6" cy="105.6" rx="1.8" ry="1" fill="#FFF7ED" opacity=".5"/>
  <circle cx="60" cy="108" r="1.6" fill="#86EFAC" opacity=".7"/>
  <circle cx="12" cy="96" r="1.6" fill="#FDE68A" opacity=".6"/>
</svg>
