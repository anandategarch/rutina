<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Kompas — arah tujuan yang jelas</title>
  <defs>
    <linearGradient id="g-org" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
    <linearGradient id="g-slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema sky -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="80" rx="18" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- L3 badan kompas -->
  <circle cx="48" cy="48" r="26" fill="#FFFFFF" stroke="url(#g-slate)" stroke-width="5"/>
  <circle cx="48" cy="48" r="26" fill="url(#g-bghigh)"/>
  <!-- Tanda arah mata angin -->
  <path d="M48 24v4M72 48h-4M48 72v-4M24 48h4" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- jarum: utara oranye, selatan slate -->
  <path d="M48 32l5 14-5 4-5-4z" fill="url(#g-org)"/>
  <path d="M48 64l-5-14 5-4 5 4z" fill="url(#g-slate)"/>
  <circle cx="48" cy="48" r="3.5" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <!-- L4 kilau kaca -->
  <path d="M32 38a20 20 0 0 1 10-9" stroke="#FFFFFF" stroke-width="3" opacity=".6" fill="none" stroke-linecap="round"/>
  <!-- L5 angin kecil -->
  <path d="M14 34q4-3 8 0M74 62q-4 3-8 0" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- titik utara -->
  <circle cx="48" cy="15" r="3" fill="#FB923C"/>
  <!-- L6 bintang kilau -->
  <path d="M22 22l1.3 3.4 3.4 1.3-3.4 1.3L22 31.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
</svg>
