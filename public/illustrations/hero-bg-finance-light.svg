    <path d="M468 258 C468 252 468 247 468 242" stroke="#22C55E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M468 246 C461 245 457 239 460 234 C466 235 469 240 468 246 Z" fill="url(#fbl-leafA)"/>
    <path d="M467 244 C463 241 460 237 459 235" stroke="#14532D" stroke-width=".9" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M468 244 C468 238 472 234 477 235 C476 240 472 244 468 244 Z" fill="url(#fbl-leafB)"/>
    <ellipse cx="452" cy="238" rx="1.6" ry="2.2" fill="#BBF7D0" opacity=".7"/>
    <circle cx="451.4" cy="237.4" r=".6" fill="#FFFFFF" opacity=".8"/>
    <ellipse cx="742" cy="264" rx="11" ry="2.5" fill="url(#fbl-soft)" opacity=".8"/>
    <path d="M742 262 C742 256 742 251 742 246" stroke="#22C55E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M742 250 C735 249 731 243 734 238 C740 239 743 244 742 250 Z" fill="url(#fbl-leafA)"/>
    <path d="M741 248 C737 245 734 241 733 239" stroke="#14532D" stroke-width=".9" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M742 248 C742 242 746 238 751 239 C750 244 746 248 742 248 Z" fill="url(#fbl-leafB)"/>
