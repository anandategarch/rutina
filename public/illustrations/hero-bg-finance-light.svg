  </g>

  <!-- bukit tengah -->
  <path d="M-20 246 C30 206 98 194 158 214 C204 230 236 228 274 210 C326 186 390 192 440 224 C480 250 530 256 570 242 C612 229 656 230 696 240 C736 250 786 254 826 240 C850 232 874 231 892 234 C912 237 940 240 960 242 L960 300 L-20 300 Z" fill="url(#fbl-h2)"/>
  <path d="M-20 246 C30 206 98 194 158 214 C204 230 236 228 274 210 C326 186 390 192 440 224 C480 250 530 256 570 242 C612 229 656 230 696 240 C736 250 786 254 826 240 C850 232 874 231 892 234 C912 237 940 240 960 242" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".28" stroke-linecap="round"/>
