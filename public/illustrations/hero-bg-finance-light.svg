    <path d="M663.5 247 C659.5 245.5 658 242 660 240 C663 241.5 664 244.5 663.5 247 Z" fill="#B45309" opacity=".5"/>
    <path d="M664.5 245.5 C668 243.5 669.5 240.5 667.8 238.5 C664.8 240 664 242.8 664.5 245.5 Z" fill="#B45309" opacity=".45"/>
    <path d="M654 242 C655.5 237.5 659.5 234.5 664.5 234" stroke="#FFF7ED" stroke-width="1.8" fill="none" opacity=".55" stroke-linecap="round"/>
    <circle cx="658" cy="241" r="1.4" fill="#FFFFFF" opacity=".8"/>
    <ellipse cx="884" cy="244" rx="16" ry="3.5" fill="url(#fbl-soft)"/>
    <circle cx="884" cy="231" r="14" fill="url(#fbl-coinEdge)"/>
    <circle cx="884" cy="228" r="14" fill="url(#fbl-coin)"/>
    <circle cx="884" cy="228" r="8.5" fill="none" stroke="#C9963F" stroke-width="1.6" opacity=".6"/>
    <path d="M884 233 L884 225" stroke="#92400E" stroke-width="1.6" stroke-linecap="round" opacity=".55" fill="none"/>
    <path d="M883.5 227 C878 225 876 220 879 217 C883 219 884.5 223 883.5 227 Z" fill="#B45309" opacity=".55"/>
    <path d="M884.5 225 C889 222 891 218 888.5 215.5 C885 217.5 884 221 884.5 225 Z" fill="#B45309" opacity=".5"/>
