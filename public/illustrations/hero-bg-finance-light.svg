    <circle cx="566" cy="258" r="6" fill="url(#fbl-coin)" opacity=".95"/>
    <circle cx="566" cy="258" r="3.5" fill="none" stroke="#C9963F" stroke-width="1" opacity=".55"/>
    <circle cx="563.5" cy="255.5" r=".9" fill="#FFFFFF" opacity=".8"/>
