    <path d="M248 263 C247 256 249 251 253 247" stroke="#16A34A" stroke-width="2" opacity=".65"/>
    <path d="M620 270 C618 262 620 256 625 252" stroke="#22C55E" stroke-width="2.4" opacity=".7"/>
