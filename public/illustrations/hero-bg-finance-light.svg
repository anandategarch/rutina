  <circle cx="836" cy="104" r="46" fill="url(#fbl-sunCore)" opacity=".45"/>
  <circle cx="836" cy="104" r="20" fill="#FFFBEB" opacity=".5"/>

  <!-- burung jauh -->
  <path d="M300 62 q7 -8 14 0 q7 -8 14 0" stroke="#0F172A" stroke-width="2" fill="none" opacity=".14" stroke-linecap="round"/>
  <path d="M640 92 q6 -7 12 0 q6 -7 12 0" stroke="#0F172A" stroke-width="1.8" fill="none" opacity=".12" stroke-linecap="round"/>

  <!-- bukit belakang (paling terang, ber-kabut) -->
  <path d="M-20 214 C60 158 150 150 226 184 C288 212 344 208 394 178 C452 144 522 148 580 186 C626 216 676 220 720 202 C760 186 800 176 840 192 C880 206 920 208 960 196 L960 300 L-20 300 Z" fill="url(#fbl-h1)"/>
  <path d="M-20 214 C60 158 150 150 226 184 C288 212 344 208 394 178 C452 144 522 148 580 186 C626 216 676 220 720 202 C760 186 800 176 840 192 C880 206 920 208 960 196" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".35" stroke-linecap="round"/>
  <ellipse cx="480" cy="218" rx="480" ry="18" fill="url(#fbl-whiteMist)"/>
  <ellipse cx="250" cy="188" rx="280" ry="34" fill="url(#fbl-mist)"/>
