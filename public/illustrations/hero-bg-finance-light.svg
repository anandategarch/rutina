  <!-- kunang-kunang emas -->
  <g fill="#FDE68A">
    <path d="M228 112 l2.2 7 7 2.2 -7 2.2 -2.2 7 -2.2 -7 -7 -2.2 7 -2.2 Z" opacity=".8"/>
    <path d="M902 172 l1.8 5.6 5.6 1.8 -5.6 1.8 -1.8 5.6 -1.8 -5.6 -5.6 -1.8 5.6 -1.8 Z" opacity=".7"/>
    <circle cx="540" cy="96" r="4" opacity=".55"/>
    <circle cx="748" cy="70" r="3.4" opacity=".5"/>
