<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" fill="none" role="img" aria-label="Lembah botani bernuansa sage dengan taburan koin keemasan">
  <!-- v2.16 · latar penuh hero Keuangan — dirancang untuk kartu TERANG:
       bukit sage lembut menempel dasar, sinar madu kanan, koin kecil tersebar.
       Aman di-crop (object-fit:cover, object-position:bottom): motif utama
       berada di zona tengah-bawah; sisi kiri dibiarkan senyap untuk teks. -->
  <defs>
    <radialGradient id="fbl-sun" cx="0" cy="0" r="1">
      <stop stop-color="#FDE68A" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#FDE68A" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fbl-h1" x1="0" y1="140" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E3F4EA"/><stop offset="1" stop-color="#CFEBDC"/>
    </linearGradient>
    <linearGradient id="fbl-h2" x1="0" y1="170" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CDEDD8"/><stop offset="1" stop-color="#B2DFC5"/>
    </linearGradient>
    <linearGradient id="fbl-h3" x1="0" y1="205" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4E2C7"/><stop offset="1" stop-color="#8FD2AB"/>
    </linearGradient>
    <linearGradient id="fbl-coin" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F7DE9B"/><stop offset="1" stop-color="#E3B452"/>
    </linearGradient>
    <linearGradient id="fbl-mist" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#BBF7D0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#BBF7D0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#BBF7D0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- sinar madu dari kanan -->
  <circle cx="836" cy="104" r="168" fill="url(#fbl-sun)"/>
  <circle cx="836" cy="104" r="46" fill="#FDE68A" opacity=".22"/>

  <!-- kabut lembut -->
  <ellipse cx="250" cy="188" rx="280" ry="34" fill="url(#fbl-mist)"/>
  <ellipse cx="620" cy="212" rx="320" ry="38" fill="url(#fbl-mist)"/>

  <!-- bukit belakang -->
  <path d="M-20 214C60 158 150 150 226 184c62 28 118 24 168-6 58-34 128-30 186 8 46 30 96 34 140 16 20-8 44-10 60-6v104H-20Z" fill="url(#fbl-h1)"/>

  <!-- bukit tengah -->
  <path d="M-20 246c50-40 118-52 178-32 46 16 78 14 116-4 52-24 116-18 166 14 40 26 90 32 130 18 22-7 46-8 60-4v62H-20Z" fill="url(#fbl-h2)"/>

  <!-- bukit depan -->
  <path d="M-20 276c36-26 84-34 132-22 40 10 66 8 96-6 44-20 100-14 144 10 34 18 76 22 108 10 18-7 36-9 60-6v38H-20Z" fill="url(#fbl-h3)"/>

  <!-- garis lembah -->
  <path d="M96 252c44-26 92-32 138-18" stroke="#7FC89B" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <path d="M560 268c52-22 108-24 156-6" stroke="#7FC89B" stroke-width="3" stroke-linecap="round" opacity=".45"/>

  <!-- kecambah di lereng -->
  <g stroke="#5FB987" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path d="M150 252v-14"/>
    <path d="M468 258v-12"/>
    <path d="M742 262v-12"/>
  </g>
  <g fill="#8FD3A5" opacity=".8">
    <path d="M150 240c-9-1-13-8-8-13 7 1 11 7 8 13Z"/>
    <path d="M151 242c1-7 8-10 13-6-1 6-6 9-13 6Z"/>
    <path d="M468 248c-9-1-13-8-8-13 7 1 11 7 8 13Z"/>
    <path d="M469 250c1-7 8-10 13-6-1 6-6 9-13 6Z"/>
    <path d="M742 252c-9-1-13-8-8-13 7 1 11 7 8 13Z"/>
    <path d="M743 254c1-7 8-10 13-6-1 6-6 9-13 6Z"/>
  </g>

  <!-- koin kecil tersebar di lereng -->
  <g>
    <circle cx="384" cy="236" r="14" fill="url(#fbl-coin)" stroke="#C9963F" stroke-width="2.4"/>
    <circle cx="384" cy="236" r="8.5" fill="none" stroke="#C9963F" stroke-width="1.8" opacity=".6"/>
    <circle cx="664" cy="248" r="12" fill="url(#fbl-coin)" stroke="#C9963F" stroke-width="2.2" opacity=".9"/>
    <circle cx="664" cy="248" r="7" fill="none" stroke="#C9963F" stroke-width="1.6" opacity=".6"/>
    <circle cx="884" cy="228" r="14" fill="url(#fbl-coin)" stroke="#C9963F" stroke-width="2.4"/>
    <circle cx="884" cy="228" r="8.5" fill="none" stroke="#C9963F" stroke-width="1.7" opacity=".6"/>
  </g>

  <!-- kunang-kunang emas -->
  <g fill="#E9BE63">
    <path d="M228 112l2.2 7 7 2.2-7 2.2-2.2 7-2.2-7-7-2.2 7-2.2Z"/>
    <path d="M902 172l1.8 5.6 5.6 1.8-5.6 1.8-1.8 5.6-1.8-5.6-5.6-1.8 5.6-1.8Z" opacity=".8"/>
    <circle cx="540" cy="96" r="4" opacity=".55"/>
    <circle cx="748" cy="70" r="3.4" opacity=".45"/>
    <circle cx="128" cy="84" r="3.2" opacity=".4"/>
  </g>
</svg>
