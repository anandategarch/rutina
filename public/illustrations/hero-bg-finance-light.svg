    <path d="M350 228 C346 220 348 214 354 210 C356 218 354 224 352 229 Z"/>
    <path d="M560 238 C556 230 558 224 564 220 C566 228 564 234 562 239 Z"/>
    <path d="M580 234 C577 227 579 221 584 217 C586 224 584 230 582 235 Z"/>
