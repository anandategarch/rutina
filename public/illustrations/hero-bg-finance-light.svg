<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" fill="none" role="img" aria-label="Lembah botani bernuansa sage dengan taburan koin keemasan">
  <!-- Rutina · hero keuangan (terang) — vektor semi-realistis: lembah sage ber-perspektif udara, mentari madu kanan, koin ber-relief tunas -->
  <!-- motif utama zona tengah-bawah; sisi kiri senyap untuk teks; aman di-crop dari bawah -->
  <defs>
    <radialGradient id="fbl-sun" cx="0" cy="0" r="1">
      <stop stop-color="#FDE68A" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#FDE68A" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fbl-sunCore" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FFFBEB"/><stop offset=".5" stop-color="#FDE68A"/><stop offset="1" stop-color="#FCD34D"/>
    </radialGradient>
    <linearGradient id="fbl-h1" x1="0" y1="150" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF7EF"/><stop offset=".5" stop-color="#D9F0E0"/><stop offset="1" stop-color="#C6E9D3"/>
    </linearGradient>
    <linearGradient id="fbl-h2" x1="0" y1="200" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBECD9"/><stop offset=".55" stop-color="#ACDFC0"/><stop offset="1" stop-color="#8FD2AB"/>
    </linearGradient>
    <linearGradient id="fbl-h3" x1="0" y1="236" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4E2C7"/><stop offset=".5" stop-color="#92D4AD"/><stop offset="1" stop-color="#74C295"/>
    </linearGradient>
    <radialGradient id="fbl-coin" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FFFBEB"/><stop offset=".35" stop-color="#FDE68A"/><stop offset=".7" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/>
    </radialGradient>
    <linearGradient id="fbl-coinEdge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FCD34D"/><stop offset=".5" stop-color="#D97706"/><stop offset="1" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="fbl-leafA" x1=".15" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="fbl-leafB" x1=".85" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="fbl-mist" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#BBF7D0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#BBF7D0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#BBF7D0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fbl-whiteMist" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fbl-soft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3E2723" stop-opacity=".3"/><stop offset=".62" stop-color="#3E2723" stop-opacity=".12"/><stop offset="1" stop-color="#3E2723" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- mentari madu dari kanan -->
