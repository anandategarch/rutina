<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Kunci — pencapaian terbuka</title>
  <defs>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema amber -->
  <circle cx="48" cy="48" r="46" fill="#FEF3C7"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="78" rx="18" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- cincin gantungan -->
  <circle cx="48" cy="78" r="4" fill="none" stroke="#B45309" stroke-width="2.5"/>
  <!-- L3 kunci emas (miring) -->
  <g transform="rotate(38 48 48)">
    <!-- kepala kunci -->
    <circle cx="48" cy="30" r="13" fill="url(#g-amb)"/>
    <circle cx="48" cy="30" r="5.5" fill="#FEF3C7"/>
    <!-- batang -->
    <rect x="44.5" y="41" width="7" height="34" rx="3" fill="url(#g-amb)"/>
    <!-- gigi kunci -->
    <path d="M51.5 66h7v6h-7z" fill="#D97706"/>
    <path d="M51.5 55h5v5.5h-5z" fill="#D97706"/>
  </g>
  <!-- L4 kilau -->
  <path d="M31 43q0-7 5-11" stroke="#FFFFFF" stroke-width="2.5" opacity=".5" fill="none" stroke-linecap="round"/>
  <!-- L5 percikan keberhasilan -->
  <path d="M22 34l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="url(#g-em)"/>
  <circle cx="72" cy="62" r="3" fill="#10B981"/>
  <!-- L6 bintang kilau -->
  <path d="M70 22l1.3 3.4 3.4 1.3-3.4 1.3L70 31.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
</svg>
