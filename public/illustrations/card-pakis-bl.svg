<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" preserveAspectRatio="xMinYMax meet">
  <!-- Rutina · PAKIS-BL — vektor semi-realistis: ujung pakis berurat bersori, pucuk menggulung, rachis meruncing (versi halus) -->
  <defs>
    <radialGradient id="w-pkbl" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#ECFDF5" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#D1FAE5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#D1FAE5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rh-pkbl" x1=".05" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".52" stop-color="#22C55E"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="lf-pkbl" x1=".1" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="lf2-pkbl" x1=".1" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="ck-pkbl" cx=".4" cy=".35" r=".85">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
  </defs>
  <!-- cuci lembut sudut kiri-bawah -->
  <rect width="110" height="100" fill="url(#w-pkbl)"/>
  <!-- rachis: pita meruncing bergradasi -->
  <path d="M3.4 97.2C10.4 78.6 22.4 62.8 38.2 52.9C44.1 49 50.1 46.1 56.6 43.9L58.2 45.9C51.9 48 46 50.8 40.3 54.6C24.9 64 13.7 79.4 7 98.4C5.2 99.6 3.4 98.8 3.4 97.2Z" fill="url(#rh-pkbl)"/>
  <path d="M5 96.4C11.6 79 23 63.6 38.6 54" fill="none" stroke="#D1FAE5" stroke-width=".8" opacity=".45" stroke-linecap="round"/>
  <!-- pinnae mungil berurat -->
  <g transform="translate(24 76)">
    <path d="M0 0C-2-8 -9-13 -17-11C-15-3 -7 2 0 0Z" fill="url(#lf-pkbl)" stroke="#15803D" stroke-width=".6" stroke-opacity=".5"/>
    <path d="M-1-1C-7-6-12-9-16.5-9.5" fill="none" stroke="#14532D" stroke-width=".9" opacity=".38" stroke-linecap="round"/>
    <path d="M-7-6C-7.2-7.8-7-9.2-6.4-10.4" fill="none" stroke="#14532D" stroke-width=".6" opacity=".3" stroke-linecap="round"/>
    <path d="M-2.5-1C-8 .6-14 .2-18.5-1.6C-13.5 1.6-7 1.8-2.5-1Z" fill="#14532D" opacity=".22"/>
    <path d="M-2.2-2.2C-7-7.4-13.5-10.8-18.8-10.4" fill="none" stroke="#D1FAE5" stroke-width="1.1" opacity=".45" stroke-linecap="round"/>
  </g>
  <g transform="translate(30 70)">
    <path d="M0 0C2-8 9-13 17-11C15-3 7 2 0 0Z" fill="url(#lf-pkbl)" stroke="#15803D" stroke-width=".6" stroke-opacity=".5"/>
    <path d="M1-1C7-6 12-9 16.5-9.5" fill="none" stroke="#14532D" stroke-width=".9" opacity=".38" stroke-linecap="round"/>
    <path d="M7-6C7.2-7.8 7-9.2 6.4-10.4" fill="none" stroke="#14532D" stroke-width=".6" opacity=".3" stroke-linecap="round"/>
    <path d="M2.5-1C8 .6 14 .2 18.5-1.6C13.5 1.6 7 1.8 2.5-1Z" fill="#14532D" opacity=".22"/>
    <path d="M2.2-2.2C7-7.4 13.5-10.8 18.8-10.4" fill="none" stroke="#D1FAE5" stroke-width="1.1" opacity=".45" stroke-linecap="round"/>
  </g>
  <g transform="translate(40 60)">
    <path d="M0 0C-2-7 -8-11 -14-9C-12.4-2.4-6 2 0 0Z" fill="url(#lf2-pkbl)" stroke="#15803D" stroke-width=".6" stroke-opacity=".5"/>
    <path d="M-1-1C-5.4-5-10-7.6-13.8-8" fill="none" stroke="#14532D" stroke-width=".9" opacity=".36" stroke-linecap="round"/>
    <path d="M-2-1.8C-7.4-6.6-12.6-9.6-17.4-9.4" fill="none" stroke="#A7F3D0" stroke-width="1" opacity=".45" stroke-linecap="round"/>
  </g>
  <g transform="translate(46 54)">
    <path d="M0 0C2-7 8-11 14-9C12.4-2.4 6 2 0 0Z" fill="url(#lf-pkbl)" stroke="#15803D" stroke-width=".6" stroke-opacity=".5"/>
    <path d="M1-1C5.4-5 10-7.6 13.8-8" fill="none" stroke="#14532D" stroke-width=".9" opacity=".36" stroke-linecap="round"/>
  </g>
  <g transform="translate(54 46)">
    <path d="M0 0C-1.8-6 -6.4-9 -10.6-7.4C-9.4-1.4 -4.2 1.2 0 0Z" fill="url(#lf2-pkbl)" stroke="#15803D" stroke-width=".6" stroke-opacity=".5"/>
  </g>
  <!-- sorum -->
  <g fill="#15803D" opacity=".45">
    <circle cx="16" cy="72.5" r="1.2"/><circle cx="19.5" cy="75" r="1.1"/>
    <circle cx="40" cy="65.5" r="1.1"/><circle cx="52" cy="49.5" r="1"/>
  </g>
  <!-- fiddlehead: pucuk menggulung dengan spiral dalam -->
  <g transform="translate(58 42)">
    <path d="M0 0C2.2-11.5 9.5-19 18-17C21.5-16 22.8-12.2 20.6-9.2C18.4-6.3 13-5.6 8.6-7.3C4.7-8.8 1.7-4.5 0 0Z" fill="url(#lf2-pkbl)" stroke="#15803D" stroke-width=".7" stroke-opacity=".55"/>
    <path d="M2.2-2.6C3.4-8.6 7.6-13.6 13.6-14.2" fill="none" stroke="#14532D" stroke-width=".9" opacity=".4" stroke-linecap="round"/>
    <path d="M4.4-4C5.6-8.2 8.6-11.6 12.6-12.4" fill="none" stroke="#D1FAE5" stroke-width=".9" opacity=".5" stroke-linecap="round"/>
    <circle cx="18.2" cy="-14.2" r="1.3" fill="url(#lf-pkbl)"/>
  </g>
  <!-- embun -->
  <ellipse cx="22" cy="62" rx="2" ry="2.6" transform="rotate(-46 22 62)" fill="#D1FAE5" opacity=".5"/>
  <circle cx="21.5" cy="61.3" r=".55" fill="#FFFFFF" opacity=".8"/>
  <!-- koin kecil timbul -->
  <g transform="translate(12 68)">
    <circle r="5" fill="#F59E0B"/>
    <circle r="4.5" fill="url(#ck-pkbl)"/>
    <circle r="2.9" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M0 2.2L0-.6" stroke="#D97706" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M0-.4C-1-1.1-1.7-2.2-1.9-3.4C-.4-3 .3-1.9 0-.4Z" fill="#D97706" opacity=".85"/>
    <path d="M0-.4C1-1.1 1.7-2.2 1.9-3.4C.4-3-.3-1.9 0-.4Z" fill="#B45309" opacity=".85"/>
    <path d="M-3.8-1.9A4.3 4.3 0 0 1-.7-4.4" fill="none" stroke="#FFFBEB" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- percik -->
  <circle cx="66" cy="57" r="2.4" fill="#A7F3D0" opacity=".85"/>
  <circle cx="34" cy="38" r="1.8" fill="#A7F3D0" opacity=".8"/>
  <circle cx="72" cy="44" r="1.5" fill="#FDE68A" opacity=".7"/>
  <path d="M45 72l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z" fill="#FBBF24" opacity=".85"/>
</svg>
