    <ellipse cy="2.8" rx="3" ry="4.8" fill="url(#ab-kn)"/>
    <circle cy="2.2" r="1.1" fill="#FFFBEB" opacity=".85"/>
    <ellipse cy="-.8" rx="2.4" ry="1.7" fill="#334155"/>
    <ellipse cy="-3.6" rx="2.5" ry="2.1" fill="#475569"/>
    <path d="M-2.4-3.8C-1.6-5.6 1.6-5.6 2.4-3.8Z" fill="#FDE047" opacity=".6"/>
    <ellipse cx="-3" cy="-2.6" rx="2.8" ry="1.1" transform="rotate(-40 -3 -2.6)" fill="#E2E8F0" opacity=".55"/>
    <ellipse cx="3" cy="-2.6" rx="2.8" ry="1.1" transform="rotate(25 3 -2.6)" fill="#F1F5F9" opacity=".5"/>
  </g>
  <g transform="translate(118 30) rotate(18)">
    <circle r="11" fill="url(#gl-kn)" opacity=".9"/>
    <ellipse cy="2" rx="2.2" ry="3.6" fill="url(#ab-kn)"/>
    <circle cy="1.6" r=".8" fill="#FFFBEB" opacity=".85"/>
    <ellipse cy="-2.6" rx="1.8" ry="1.6" fill="#475569"/>
    <ellipse cx="-2.2" cy="-2" rx="2" ry=".9" transform="rotate(-40 -2.2 -2)" fill="#E2E8F0" opacity=".5"/>
  </g>
  <g transform="translate(92 52) rotate(-14)">
    <circle r="8" fill="url(#gl-kn)" opacity=".8"/>
    <ellipse cy="1.6" rx="1.7" ry="2.8" fill="url(#ab-kn)"/>
    <circle cy="1.2" r=".6" fill="#FFFBEB" opacity=".8"/>
    <ellipse cy="-2" rx="1.4" ry="1.3" fill="#475569"/>
  </g>
  <g transform="translate(168 92) rotate(30)">
    <circle r="9" fill="url(#gl-kn)" opacity=".85"/>
    <ellipse cy="1.8" rx="1.9" ry="3" fill="url(#ab-kn)"/>
    <circle cy="1.4" r=".65" fill="#FFFBEB" opacity=".8"/>
    <ellipse cy="-2.2" rx="1.5" ry="1.4" fill="#475569"/>
  </g>
  <g transform="translate(140 88) rotate(-8)">
    <circle r="7" fill="url(#gl-kn)" opacity=".7"/>
    <ellipse cy="1.4" rx="1.5" ry="2.4" fill="url(#ab-kn)"/>
    <ellipse cy="-1.8" rx="1.2" ry="1.1" fill="#475569"/>
  </g>
  <g transform="translate(76 44) rotate(10)">
    <circle r="6" fill="url(#gl-kn)" opacity=".6"/>
    <ellipse cy="1.2" rx="1.3" ry="2" fill="url(#ab-kn)"/>
    <ellipse cy="-1.4" rx="1" ry="1" fill="#475569"/>
  </g>
  <g transform="translate(132 62) rotate(-22)">
    <circle r="6" fill="url(#gl-kn)" opacity=".75"/>
    <ellipse cy="1.2" rx="1.3" ry="2.1" fill="url(#ab-kn)"/>
    <ellipse cy="-1.4" rx="1" ry="1" fill="#475569"/>
  </g>
  <!-- jejak melayang bertitik -->
  <g fill="none" stroke="#F59E0B" stroke-width="1.1" stroke-linecap="round" opacity=".55" stroke-dasharray="1.5 4.5">
    <path d="M158 68c2 4 3 7 3 10"/>
    <path d="M112 40c-2 5-3 9-3 13"/>
    <path d="M162 102c3 4 5 7 5 9"/>
  </g>
  <!-- koin amber timbul (gema ilustrasi hero) -->
  <g transform="translate(70 24)">
    <circle r="6.2" fill="#F59E0B"/>
    <circle r="5.5" fill="url(#ck-kn)"/>
    <circle r="3.8" fill="none" stroke="#F59E0B" stroke-width=".8" opacity=".55"/>
    <path d="M0 2.6L0-.8" stroke="#D97706" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
    <path d="M0-.6C-1.3-1.4-2.1-2.7-2.3-4.1C-.5-3.6.4-2.3 0-.6Z" fill="#D97706" opacity=".85"/>
    <path d="M0-.6C1.3-1.4 2.1-2.7 2.3-4.1C.5-3.6-.4-2.3 0-.6Z" fill="#B45309" opacity=".85"/>
    <path d="M-4.7-2.3A5.3 5.3 0 0 1-.9-5.4" fill="none" stroke="#FFFBEB" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- percik -->
  <g>
    <circle cx="176" cy="80" r="2.2" fill="#34D399" opacity=".85"/>
    <circle cx="104" cy="70" r="2" fill="#A7F3D0" opacity=".9"/>
    <circle cx="96" cy="84" r="1.6" fill="#FDE047" opacity=".7"/>
    <path d="M96 60l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1z" fill="#FBBF24" opacity=".9"/>
  </g>
</svg>
