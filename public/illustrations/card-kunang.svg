<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · KUNANG — vektor semi-realistis: kunang-kunang berbadan bersegmen bersayap tipis, pendar lembut berlapis -->
  <defs>
    <radialGradient id="w-kn" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FEF3C7" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ECFDF5" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl-kn" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset=".35" stop-color="#FDE047" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ab-kn" cx=".45" cy=".35" r=".9">
      <stop offset="0" stop-color="#FEF9C3"/><stop offset=".6" stop-color="#FDE047"/><stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="br-kn" x1="0" y1="0" x2=".5" y2=".95">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".52" stop-color="#22C55E"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="lf-kn" x1=".05" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="ck-kn" cx=".4" cy=".35" r=".85">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
  </defs>
  <!-- cuci warna senja kebun di sudut -->
  <rect width="180" height="170" fill="url(#w-kn)"/>
  <!-- ranting tipis meruncing bergradasi -->
  <path d="M61.4 1.4C96 5 131 20.4 153.4 45.8C162.4 55.4 168.9 63.2 174.4 71.4L176.2 74.2C175 76.4 172.4 76.6 171 75.2C166 68.6 159.6 60.8 150.8 52.4C128.8 27.6 94.4 11.6 60.4 7.4C58.6 4.4 59.4 1.8 61.4 1.4Z" fill="url(#br-kn)"/>
  <path d="M64 3.8C97 7.4 130 22 152 45" fill="none" stroke="#D1FAE5" stroke-width=".9" opacity=".4" stroke-linecap="round"/>
  <!-- daun mint halus berurat -->
  <g transform="translate(78 14) rotate(-20) scale(.62)">
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" fill="url(#lf-kn)" stroke="#15803D" stroke-width=".7" stroke-opacity=".5"/>
    <path d="M2-1C9.5-5.5 19.5-7.5 27.5-6" fill="none" stroke="#14532D" stroke-width="1.1" opacity=".38" stroke-linecap="round"/>
    <path d="M4 .8C10.5 5 18.5 4.6 25-.6C19 3.6 11 5.4 4 .8Z" fill="#14532D" opacity=".22"/>
    <path d="M3-2.2C9.5-8 18.5-9.6 26.5-6.4" fill="none" stroke="#D1FAE5" stroke-width="1.4" opacity=".5" stroke-linecap="round"/>
  </g>
  <g transform="translate(126 40) rotate(-46) scale(.56)">
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" fill="url(#lf-kn)" stroke="#15803D" stroke-width=".7" stroke-opacity=".5"/>
    <path d="M2-1C9.5-5.5 19.5-7.5 27.5-6" fill="none" stroke="#14532D" stroke-width="1.2" opacity=".36" stroke-linecap="round"/>
    <path d="M3-2.2C9.5-8 18.5-9.6 26.5-6.4" fill="none" stroke="#D1FAE5" stroke-width="1.4" opacity=".45" stroke-linecap="round"/>
  </g>
  <g transform="translate(158 84) rotate(-20) scale(.44)">
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" fill="url(#lf-kn)" stroke="#15803D" stroke-width=".9" stroke-opacity=".5"/>
    <path d="M2-1C9.5-5.5 19.5-7.5 27.5-6" fill="none" stroke="#14532D" stroke-width="1.2" opacity=".35" stroke-linecap="round"/>
  </g>
