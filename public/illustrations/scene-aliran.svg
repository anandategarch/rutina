<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" fill="none" role="img" aria-label="Aliran sungai koin mengalir melewati taman — arus kas yang mengairi">
  <defs>
    <linearGradient id="saBg" x1="0" y1="0" x2="360" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#ECFDF5"/><stop offset=".55" stop-color="#F0FDF4"/><stop offset="1" stop-color="#FFFEF8"/></linearGradient>
    <linearGradient id="saRiver" x1="40" y1="40" x2="330" y2="92" gradientUnits="userSpaceOnUse"><stop stop-color="#BAE6FD"/><stop offset=".5" stop-color="#7DD3FC"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <radialGradient id="saCoin" cx=".5" cy=".5" r=".5"><stop stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
    <linearGradient id="saBank" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6EE7B7"/><stop offset="1" stop-color="#10B981"/></linearGradient>
  </defs>
  <rect width="360" height="110" rx="14" fill="url(#saBg)"/>
  <!-- tepian sungai -->
  <path d="M18 52c36-20 62 10 98-6 40-18 66 14 104-4 30-14 66-6 122 8v34c-56-16-92-22-122-8-38 18-64-14-104 4-36 16-62-14-98 6Z" fill="url(#saRiver)" opacity=".9"/>
  <path d="M18 52c36-20 62 10 98-6 40-18 66 14 104-4 30-14 66-6 122 8" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- riak air -->
  <path d="M92 58c8-3 14-3 20 0M188 52c8-3 14-3 20 0M272 62c8-3 14-3 20 0" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
  <!-- koin hanyut di aliran -->
  <g>
    <circle cx="130" cy="52" r="9" fill="url(#saCoin)" stroke="#D97706" stroke-width="1.4"/>
    <path d="M130 47.5v9M126.5 52h7" stroke="#B45309" stroke-width="1.9" stroke-linecap="round"/>
    <circle cx="196" cy="66" r="7.4" fill="url(#saCoin)" stroke="#D97706" stroke-width="1.3" opacity=".95"/>
    <path d="M196 62.5v7M193 66h6" stroke="#B45309" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="256" cy="58" r="6" fill="url(#saCoin)" stroke="#D97706" stroke-width="1.2" opacity=".9"/>
    <path d="M256 55v6M253 58h6" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- perahu kertas kecil membawa koin -->
  <g transform="translate(64 44) rotate(-4)">
    <path d="M0 10 8 0l8 10Z" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-6 10h28l-5 7H1Z" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="8" cy="-4" r="4.4" fill="url(#saCoin)" stroke="#D97706" stroke-width="1.2"/>
    <path d="M8-6.8v5.6M5.2-4h5.6" stroke="#B45309" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- tebing sage kiri-atas dengan tunas -->
  <path d="M0 0h150c-8 16-26 26-50 28-28 2-52-10-100-6Z" fill="url(#saBank)" opacity=".55"/>
  <path d="M0 0h150c-8 16-26 26-50 28" stroke="#A7F3D0" stroke-width="2.6" stroke-linecap="round" opacity=".8" fill="none"/>
  <g transform="translate(120 18)">
    <path d="M0 12V2" stroke="#047857" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M0 7c-7-1-9-6-4-9 5 1 9 5 4 9Z" fill="#34D399"/>
  </g>
  <!-- tebing kanan-bawah dengan rumput -->
  <path d="M360 110H232c10-13 30-19 52-17 24 2 44 9 76 5Z" fill="url(#saBank)" opacity=".5"/>
  <g stroke="#047857" stroke-width="2.6" stroke-linecap="round" opacity=".85">
    <path d="M238 96c-3-5 2-8 0-12"/>
    <path d="M330 94c3-5-2-8 0-12"/>
  </g>
  <circle cx="316" cy="26" r="5.6" fill="#FCD34D" opacity=".85"/>
  <path d="M330 18l3 5M302 18l-3 5M316 10v-5" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="180" cy="106" rx="160" ry="5" fill="#059669" opacity=".1"/>
</svg>
