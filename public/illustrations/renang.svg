<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Berenang — kebiasaan renang</title>
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
    <linearGradient id="g-blu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <clipPath id="clip-bola"><circle cx="48" cy="48" r="46"/></clipPath>
  </defs>
  <!-- L1 latar tema sky -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L3 ombak belakang (terpotong mengikuti lingkaran) -->
  <g clip-path="url(#clip-bola)">
  <path d="M12 58c6-9 12-9 18 0s12-9 18 0 12-9 18 0 12-9 18 0V96H12z" fill="#BAE6FD"/>
  <!-- perenang: kepala -->
  <circle cx="47" cy="44" r="9" fill="#FCD9B8"/>
  <path d="M38 44c0-6 4-9.5 9-9.5s9 3.5 9 9.5c-2.5-3-5.5-4-9-4s-6.5 1-9 4z" fill="url(#g-blu)"/>
  <path d="M43 45q1.5 1.5 3 0M51 45q1.5 1.5 3 0" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M45.5 49.5q2 1.8 4 0" stroke="#C2410C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- lengan menyembul ke atas -->
  <path d="M57 52c8-3 12-9 13-16" stroke="#FCD9B8" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  <!-- ombak depan menutup pangkal lengan -->
  <path d="M8 64c5.3-9 10.7-9 16 0s10.7-9 16 0 10.7-9 16 0 10.7-9 16 0 10.7-9 16 0V96H8z" fill="url(#g-sky)"/>
  <!-- L4 kilau buih di puncak ombak -->
  <path d="M8 64c5.3-9 10.7-9 16 0s10.7-9 16 0 10.7-9 16 0 10.7-9 16 0 10.7-9 16 0" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- L5 percikan & gelembung -->
  <circle cx="73" cy="28" r="2.2" fill="#38BDF8"/><circle cx="78" cy="37" r="1.8" fill="#38BDF8"/>
  <circle cx="56" cy="55" r="3" fill="#FFFFFF" opacity=".7"/>
  <circle cx="28" cy="52" r="2.5" fill="#FFFFFF" opacity=".7"/><circle cx="66" cy="54" r="2" fill="#FFFFFF" opacity=".7"/>
  <!-- L6 bintang kilau -->
  <path d="M25 18l1.4 3.6 3.6 1.4-3.6 1.4L25 28.2l-1.4-3.6-3.6-1.4 3.6-1.4z" fill="#FBBF24"/>
  <circle cx="72" cy="47" r="2.5" fill="#FCD34D"/>
</svg>
