<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none" role="img" aria-label="Barisan tunas dalam pot dengan rambatan dan kupu-kupu">
  <defs>
    <linearGradient id="hgH-pot" x1="300" y1="128" x2="408" y2="186" gradientUnits="userSpaceOnUse"><stop stop-color="#E09963"/><stop offset="1" stop-color="#B96D45"/></linearGradient>
    <linearGradient id="hgH-pot2" x1="96" y1="132" x2="184" y2="184" gradientUnits="userSpaceOnUse"><stop stop-color="#D58C58"/><stop offset="1" stop-color="#A85F43"/></linearGradient>
    <linearGradient id="hgH-leafA" x1="240" y1="34" x2="320" y2="132" gradientUnits="userSpaceOnUse"><stop stop-color="#9DBF7B"/><stop offset="1" stop-color="#477C51"/></linearGradient>
