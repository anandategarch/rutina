    </linearGradient>
    <radialGradient id="slbGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".14"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
