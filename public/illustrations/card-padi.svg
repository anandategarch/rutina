<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · PADI — vektor semi-realistis: bulir emas bergradasi menunduk, janggut halus, daun ramping -->
  <defs>
    <radialGradient id="w-pd" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FEF3C7" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#FFFBEB" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFFBEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gr-pd" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="sk-pd" x1=".1" y1="0" x2=".5" y2=".9">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset=".55" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="lf-pd" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="cn-pd" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="dw-pd" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
  </defs>

  <!-- cuci warna ladang emas di sudut -->
  <rect width="180" height="170" fill="url(#w-pd)"/>

  <!-- daun rumput ramping di belakang batang: gradasi + urat tengah -->
  <path d="M172.6 127.4C150 112.4 126 97.4 106 91L104.4 93.2C124.6 100 148 114.8 171 130.6Z" fill="url(#lf-pd)"/>
  <path d="M170 128.6C148.6 114.4 126.6 100.4 107.4 92.4" fill="none" stroke="#14532D" stroke-width=".7" opacity=".38" stroke-linecap="round"/>
  <path d="M169.6 125.4C149 111.6 128.4 98.4 108.6 91.6" fill="none" stroke="#D9F99D" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
  <!-- embun di daun rumput -->
  <ellipse cx="141" cy="103.6" rx="1.5" ry="2.1" fill="url(#dw-pd)" transform="rotate(-32 141 103.6)"/>
  <circle cx="140.3" cy="102.7" r=".55" fill="#FFFFFF" opacity=".85"/>

  <!-- batang padi utama menunduk: meruncing bergradasi -->
  <path d="M170.8 109.6C158.8 93.4 146.6 63.2 132.6 35C126.6 23 118.6 12.8 108.6 8.4L107.2 6.6C117.8 11.2 125.8 21.6 131.8 33.8C145.8 62 157.8 91.8 169 106.8Z" fill="url(#sk-pd)"/>
  <path d="M169.4 107.6C157.6 91.8 145.6 62.2 131.8 34.2C126 22.4 118.4 12.6 108.4 8.2" fill="none" stroke="#FDE68A" stroke-width=".8" opacity=".55" stroke-linecap="round"/>
  <path d="M170 108.8C158.4 93 146.4 63.4 132.6 35.6" fill="none" stroke="#92400E" stroke-width=".8" opacity=".3" stroke-linecap="round"/>

  <!-- bulir padi: bulir bola bergradasi di sepanjang ujung batang -->
  <g transform="translate(0 7)">
    <g fill="url(#gr-pd)" stroke="#B45309" stroke-width=".7" stroke-linejoin="round">
      <ellipse cx="100" cy="6" rx="4" ry="7" transform="rotate(24 100 6)"/>
      <ellipse cx="108" cy="7" rx="4" ry="7" transform="rotate(38 108 7)"/>
      <ellipse cx="115" cy="10" rx="4" ry="7" transform="rotate(52 115 10)"/>
      <ellipse cx="120" cy="14" rx="4" ry="7" transform="rotate(66 120 14)"/>
      <ellipse cx="124" cy="19" rx="4" ry="7" transform="rotate(80 124 19)"/>
      <ellipse cx="127" cy="25" rx="4" ry="7" transform="rotate(94 127 25)"/>
      <ellipse cx="129" cy="31" rx="4" ry="7" transform="rotate(108 129 31)"/>
    </g>
    <!-- kilau bulir sisi kiri-atas -->
    <g fill="#FFFBEB" opacity=".75">
      <circle cx="98.4" cy="3.4" r=".9"/>
      <circle cx="106.6" cy="4.6" r=".85"/>
      <circle cx="113.4" cy="7.8" r=".85"/>
      <circle cx="122.2" cy="16.8" r=".8"/>
      <circle cx="125.4" cy="22.6" r=".8"/>
    </g>
    <!-- janggut bulir -->
    <g stroke="#B45309" stroke-width=".9" stroke-linecap="round" opacity=".65" fill="none">
      <path d="M100 1C98 -1 96 -2 93 -4"/>
      <path d="M115 4C114 1 113 -1 111 -3"/>
      <path d="M124 13C124 10 124 7 123 5"/>
      <path d="M129.4 28C130.4 25 130.6 22 130 19.6"/>
    </g>
  </g>

  <!-- batang kedua menunduk -->
  <path d="M176.8 119.4C166.8 105.4 158.8 85.2 150.8 67.2C144.8 55.2 136.8 47.2 127.8 44.2L126.4 42.6C136 45.6 144 54 150 66C158 84 166.2 103.8 175.6 116.8Z" fill="url(#sk-pd)"/>
  <g fill="url(#gr-pd)" stroke="#B45309" stroke-width=".7" stroke-linejoin="round">
    <ellipse cx="122" cy="40" rx="3.4" ry="6" transform="rotate(30 122 40)"/>
    <ellipse cx="128" cy="43" rx="3.4" ry="6" transform="rotate(50 128 43)"/>
    <ellipse cx="133" cy="48" rx="3.4" ry="6" transform="rotate(70 133 48)"/>
    <ellipse cx="136" cy="54" rx="3.4" ry="6" transform="rotate(88 136 54)"/>
  </g>
  <g fill="#FFFBEB" opacity=".7">
    <circle cx="120.8" cy="38" r=".8"/>
    <circle cx="131.6" cy="46.4" r=".7"/>
  </g>

  <!-- batang ketiga kecil -->
  <path d="M178.4 131C172.6 123.2 168.6 113.2 164.6 103.2C161.6 97.2 156.6 93.2 151.6 92.2L151 90.4C156.8 91.4 162.4 96 165.6 102.4C169.6 112.4 173.6 122.4 179.4 130Z" fill="url(#sk-pd)" opacity=".92"/>
  <g fill="url(#gr-pd)" stroke="#B45309" stroke-width=".7" stroke-linejoin="round">
    <ellipse cx="147" cy="88" rx="2.8" ry="5" transform="rotate(40 147 88)"/>
    <ellipse cx="151" cy="93" rx="2.8" ry="5" transform="rotate(62 151 93)"/>
  </g>
  <circle cx="145.8" cy="86.4" r=".7" fill="#FFFBEB" opacity=".7"/>

  <!-- serbuk sari melayang -->
  <g fill="#FDE68A" opacity=".75">
    <circle cx="94" cy="22" r="1.5"/>
    <circle cx="88" cy="34" r="1.2"/>
    <circle cx="102" cy="14" r="1.1"/>
  </g>

  <!-- koin amber: muka radial, cincin, kecambah timbul, kilau sabit -->
  <g>
    <circle cx="70" cy="14" r="6.4" fill="url(#cn-pd)" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="70" cy="14" r="4.7" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M70 17.6C70.2 16.2 71 15.2 72.3 14.8" fill="none" stroke="#B45309" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M72.3 14.8C72 13.4 72.8 12.2 74.1 12.4C74.3 13.7 73.5 14.8 72.3 14.8Z" fill="#D97706" opacity=".9"/>
    <path d="M72.3 14.8C71.6 13.4 70.2 13 69.2 13.8C69.6 15.1 71 15.6 72.3 14.8Z" fill="#B45309" opacity=".9"/>
    <path d="M66.2 11.2a5.6 5.6 0 0 1 3.8 -2.6" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    <circle cx="67.4" cy="11.4" r=".8" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- percik ladang: titik berkilau -->
  <g>
    <circle cx="92" cy="34" r="2.6" fill="#FBBF24"/>
    <circle cx="91.2" cy="33.2" r=".9" fill="#FEF3C7" opacity=".8"/>
    <circle cx="86" cy="44" r="2.2" fill="#34D399" opacity=".9"/>
    <circle cx="98" cy="24" r="2" fill="#86EFAC" opacity=".9"/>
    <circle cx="98.6" cy="23.4" r=".7" fill="#D9F99D" opacity=".8"/>
    <path d="M140 70l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1z" fill="#FBBF24" opacity=".9"/>
    <circle cx="118" cy="58" r="1.6" fill="#FDE68A" opacity=".7"/>
  </g>
</svg>
