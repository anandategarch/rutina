<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · SPRIG — vektor semi-realistis: ranting muda tujuh daun bergradasi berurat, embun, kerintil baru, kumbang -->
  <defs>
    <radialGradient id="w" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#D1FAE5" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#D1FAE5" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D1FAE5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lfOut" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="lfIn" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset=".5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="lfTip" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#D9F99D"/>
      <stop offset=".5" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="stemG" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset=".5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="berryG" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".55" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </radialGradient>
    <radialGradient id="cnA" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="dwG" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
  </defs>

  <!-- cuci warna mint sudut -->
  <rect width="180" height="170" fill="url(#w)"/>

  <!-- batang meruncing bergradasi mengikuti sudut -->
  <path d="M57.4 1.2C95.8 3 132.2 18.8 155.6 45.2C164.2 54.8 170.6 62.6 174.7 70.5L177.3 73.7C170.9 65.8 163.5 57.5 154.2 47.6C133 22 96.2 5.7 56.8 3.4Z" fill="url(#stemG)"/>
  <path d="M58.4 2C96.6 3.8 132.6 19.6 156 46C164.6 55.6 170.8 63.2 174.6 70.6" fill="none" stroke="#BBF7D0" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
  <path d="M155 48.6C134.2 23.4 97.4 7 57.4 4.8" fill="none" stroke="#14532D" stroke-width=".8" opacity=".3" stroke-linecap="round"/>
  <!-- kail ujung batang turun ke sudut dalam -->
  <path d="M175.4 72.4C172.6 76.6 168.8 79.6 164.4 81.4" fill="none" stroke="url(#stemG)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M174.8 74.4C172.4 77.4 169.4 79.6 166 80.8" fill="none" stroke="#BBF7D0" stroke-width=".7" opacity=".45" stroke-linecap="round"/>

  <!-- daun A keluar: gradasi + urat + rim -->
  <g transform="translate(84 12) rotate(-14) scale(.7)" stroke-linejoin="round">
    <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfOut)" stroke="#14532D" stroke-width=".9"/>
    <path d="M2 .6C10 -1.6 20 -2.6 27 -3.4" fill="none" stroke="#14532D" stroke-width="1.1" opacity=".42" stroke-linecap="round"/>
    <path d="M2.6 -1.4C10 -6.6 19 -8.4 26 -6" fill="none" stroke="#D9F99D" stroke-width="1.2" opacity=".5" stroke-linecap="round"/>
    <path d="M27.6 -3.8C24 1.2 17.4 4.6 9.8 5.4" fill="none" stroke="#14532D" stroke-width="1.7" opacity=".2" stroke-linecap="round"/>
  </g>
  <!-- daun B masuk: lebih gelap, punggung daun -->
  <g transform="translate(103 12) rotate(152)" stroke-linejoin="round">
    <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfIn)" stroke="#14532D" stroke-width=".9" opacity=".97"/>
    <path d="M2 .6C10 -1.6 20 -2.6 27 -3.4" fill="none" stroke="#14532D" stroke-width="1.1" opacity=".42" stroke-linecap="round"/>
    <path d="M2.6 -1.4C10 -6.6 19 -8.4 26 -6" fill="none" stroke="#BBF7D0" stroke-width="1.2" opacity=".45" stroke-linecap="round"/>
    <path d="M27.6 -3.8C24 1.2 17.4 4.6 9.8 5.4" fill="none" stroke="#14532D" stroke-width="1.7" opacity=".22" stroke-linecap="round"/>
  </g>
  <!-- daun C keluar dengan embun -->
  <g transform="translate(126 25) rotate(-46) scale(.8)" stroke-linejoin="round">
    <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfOut)" stroke="#14532D" stroke-width=".9"/>
    <path d="M2 .6C10 -1.6 20 -2.6 27 -3.4" fill="none" stroke="#14532D" stroke-width="1.1" opacity=".42" stroke-linecap="round"/>
    <path d="M2.6 -1.4C10 -6.6 19 -8.4 26 -6" fill="none" stroke="#D9F99D" stroke-width="1.2" opacity=".5" stroke-linecap="round"/>
    <path d="M27.6 -3.8C24 1.2 17.4 4.6 9.8 5.4" fill="none" stroke="#14532D" stroke-width="1.7" opacity=".2" stroke-linecap="round"/>
    <ellipse cx="15" cy="-2" rx="1.6" ry="2.2" fill="url(#dwG)" transform="rotate(-40 15 -2)"/>
    <circle cx="14.2" cy="-3" r=".6" fill="#FFFFFF" opacity=".85"/>
  </g>
  <!-- daun D masuk di belakang koin -->
  <g transform="translate(147 39) rotate(166) scale(.85)" stroke-linejoin="round">
    <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfIn)" stroke="#14532D" stroke-width=".9" opacity=".97"/>
    <path d="M2 .6C10 -1.6 20 -2.6 27 -3.4" fill="none" stroke="#14532D" stroke-width="1.1" opacity=".42" stroke-linecap="round"/>
    <path d="M2.6 -1.4C10 -6.6 19 -8.4 26 -6" fill="none" stroke="#BBF7D0" stroke-width="1.2" opacity=".45" stroke-linecap="round"/>
  </g>

  <!-- koin amber besar: muka radial, cincin, kecambah timbul, kilau sabit -->
  <g>
    <circle cx="139" cy="55" r="10" fill="url(#cnA)" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="139" cy="55" r="7.4" fill="none" stroke="#F59E0B" stroke-width=".8" opacity=".55"/>
    <path d="M139 60.4C139.3 58.3 140.5 56.8 142.5 56.2" fill="none" stroke="#B45309" stroke-width="1" stroke-linecap="round" opacity=".9"/>
    <path d="M142.5 56.2C142 54.1 143.2 52.3 145.2 52.6C145.5 54.6 144.3 56.2 142.5 56.2Z" fill="#D97706" opacity=".9"/>
    <path d="M142.5 56.2C141.4 54.1 139.3 53.5 137.8 54.7C138.4 56.7 140.5 57.4 142.5 56.2Z" fill="#B45309" opacity=".9"/>
    <path d="M133.1 50.6a8.8 8.8 0 0 1 6 -4" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>
    <circle cx="135" cy="51.2" r="1.2" fill="#FFFBEB" opacity=".85"/>
    <!-- kumbang kecil beristirahat di koin -->
    <g transform="translate(135.2 58.4)">
      <ellipse rx="2.6" ry="2" fill="#E11D48" stroke="#9F1239" stroke-width=".45"/>
      <path d="M0 -2L0 2" stroke="#7F1D1D" stroke-width=".5" fill="none"/>
      <circle cx="0" cy="-2.3" r=".95" fill="#7F1D1D"/>
      <circle cx="-1.2" cy="-.4" r=".45" fill="#450A0A"/>
      <circle cx="1" cy=".5" r=".4" fill="#450A0A"/>
      <ellipse cx="-.9" cy="-1.1" rx=".8" ry=".4" fill="#FCA5A5" opacity=".65"/>
    </g>
  </g>

  <!-- daun E keluar di depan koin -->
  <g transform="translate(157 57) rotate(-18) scale(.62)" stroke-linejoin="round">
    <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfOut)" stroke="#14532D" stroke-width="1"/>
    <path d="M2 .6C10 -1.6 20 -2.6 27 -3.4" fill="none" stroke="#14532D" stroke-width="1.1" opacity=".42" stroke-linecap="round"/>
    <path d="M2.6 -1.4C10 -6.6 19 -8.4 26 -6" fill="none" stroke="#D9F99D" stroke-width="1.2" opacity=".5" stroke-linecap="round"/>
  </g>
  <!-- daun ujung muda -->
  <g transform="translate(164 81) rotate(-62) scale(.5)" stroke-linejoin="round">
    <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfTip)" stroke="#14532D" stroke-width="1.2"/>
    <path d="M2 .6C10 -1.6 20 -2.6 27 -3.4" fill="none" stroke="#14532D" stroke-width="1.2" opacity=".4" stroke-linecap="round"/>
  </g>

  <!-- kerintil baru: sulur muda melingkar + daun bayi -->
  <path d="M164.4 81.6C160 83.2 158 87.6 160.8 90.8C163 93.2 167 92 166.8 88.8C166.6 86.6 164 85.9 162.8 87.7" fill="none" stroke="url(#stemG)" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
  <g transform="translate(157 89) rotate(-30) scale(.28)" stroke-linejoin="round">
    <path d="M0 0C7 -9 20 -11 30 -4C23 6 8 7 0 0Z" fill="url(#lfTip)" stroke="#14532D" stroke-width="1.6"/>
  </g>

  <!-- daun kecil lepas, gaya garis halus -->
  <g transform="translate(150 76) rotate(-10)" stroke-linejoin="round">
    <path d="M0 0C5 -6 13 -7 20 -3C15 3 5 4 0 0Z" fill="url(#lfIn)" stroke="#6EE7B7" stroke-width="1.3"/>
  </g>

  <!-- beri hijau + beri amber dengan kilau -->
  <g>
    <circle cx="170" cy="90" r="3.1" fill="url(#berryG)" stroke="#16A34A" stroke-width=".8"/>
    <circle cx="169" cy="88.9" r="1" fill="#D9F99D" opacity=".85"/>
    <circle cx="176" cy="85" r="2.5" fill="url(#berryG)" stroke="#16A34A" stroke-width=".7"/>
    <circle cx="175.2" cy="84.1" r=".8" fill="#D9F99D" opacity=".8"/>
    <circle cx="163" cy="96" r="2.2" fill="url(#cnA)" stroke="#F59E0B" stroke-width=".7"/>
    <circle cx="162.3" cy="95.2" r=".75" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- koin kecil sahabat -->
  <g>
    <circle cx="70" cy="13" r="6.2" fill="url(#cnA)" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="70" cy="13" r="4.6" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M70 16.6C70.2 15.2 71 14.2 72.3 13.8" fill="none" stroke="#B45309" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M72.3 13.8C72 12.4 72.8 11.2 74.1 11.4C74.3 12.7 73.5 13.8 72.3 13.8Z" fill="#D97706" opacity=".9"/>
    <path d="M72.3 13.8C71.6 12.4 70.2 12 69.2 12.8C69.6 14.1 71 14.6 72.3 13.8Z" fill="#B45309" opacity=".9"/>
    <path d="M66.2 10.2a5.6 5.6 0 0 1 3.8 -2.6" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    <circle cx="67.4" cy="10.4" r=".8" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- beri & percik: titik serbuk berkilau -->
  <g>
    <path d="M156 84l1.3 3.4 3.4 1.3 -3.4 1.3 -1.3 3.4 -1.3 -3.4 -3.4 -1.3 3.4 -1.3z" fill="#FBBF24" opacity=".9"/>
    <circle cx="118" cy="44" r="2.2" fill="#7DD3FC" opacity=".8"/>
    <circle cx="168" cy="106" r="2.6" fill="#86EFAC"/>
    <circle cx="168.6" cy="105.4" r=".9" fill="#D9F99D" opacity=".8"/>
    <circle cx="102" cy="30" r="2" fill="#A7F3D0" opacity=".9"/>
  </g>
</svg>
