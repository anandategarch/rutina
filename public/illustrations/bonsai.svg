<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Bonsai — kesabaran merawat kebiasaan</title>
  <defs>
    <linearGradient id="g-em2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7B8"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <linearGradient id="g-slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema slate -->
  <circle cx="48" cy="48" r="46" fill="#F1F5F9"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="80" rx="20" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- L3 pot bonsai -->
  <path d="M30 64h36l-3.5 13h-29z" fill="url(#g-slate)"/>
  <rect x="26" y="60" width="44" height="7" rx="3" fill="#94A3B8"/>
  <path d="M33 70h4.5M45 70h5M57 70h4.5" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- batang berliku -->
  <path d="M48 63c-2-8 2-12-1-18-2.5-4.5-8-5-11-9M47 52c4-3 7-8 6-13-.8-4-4-6-5-10" stroke="#B45309" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- L4 tajuk awan (3 gumpal) -->
  <ellipse cx="28" cy="31" rx="11.5" ry="8" fill="url(#g-em2)"/>
  <ellipse cx="60" cy="22" rx="12" ry="8.5" fill="url(#g-em2)"/>
  <ellipse cx="46" cy="38" rx="9" ry="6.5" fill="#6EE7B7"/>
  <!-- kilau tajuk -->
  <path d="M22 29q3-4 8-4.5M54 20q3-3.5 8-3.5" stroke="#FFFFFF" stroke-width="2" opacity=".45" fill="none" stroke-linecap="round"/>
  <!-- L5 daun jatuh -->
  <path d="M70 44c-1-3.5 1-5.5 3.8-5.2.2 2.8-1.6 4.9-3.8 5.2z" fill="#6EE7B7"/>
  <path d="M22 50c-1-3.5 1-5.5 3.8-5.2.2 2.8-1.6 4.9-3.8 5.2z" fill="#34D399"/>
  <!-- L6 bintang kilau -->
  <path d="M72 60l1.2 3 3 1.2-3 1.2L72 68.6l-1.2-3-3-1.2 3-1.2z" fill="#FBBF24"/>
