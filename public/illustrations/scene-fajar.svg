<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 118" fill="none" role="img" aria-label="Fajar di atas bukit: mentari terbit menemani secangkir teh hangat dan burung-burung kecil">
  <defs>
    <linearGradient id="sfSky" x1="20" y1="4" x2="140" y2="82" gradientUnits="userSpaceOnUse"><stop stop-color="#E0F2FE"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#FCD34D"/></linearGradient>
    <radialGradient id="sfSun" cx=".5" cy=".5" r=".5"><stop stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>
    <linearGradient id="sfHill" x1="16" y1="70" x2="150" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#6EE7B7"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <linearGradient id="sfCup" x1="96" y1="84" x2="122" y2="106" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
  </defs>
  <!-- langit fajar -->
  <rect x="8" y="6" width="154" height="80" rx="16" fill="url(#sfSky)"/>
  <!-- mentari terbit dari balik bukit -->
  <circle cx="62" cy="72" r="20" fill="url(#sfSun)"/>
  <path d="M62 42v-8M62 110v-6M32 72h-8M92 72h8M41 51l-6-6M83 51l6-6" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  <path d="M8 86h154" stroke="#FCD34D" stroke-width="3" stroke-linecap="round" opacity=".55" stroke-dasharray="1 8"/>
  <!-- burung-burung pagi -->
  <path d="M104 30c4-4 8-4 11 0 3-4 7-4 11 0" stroke="#0369A1" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M128 42c3-3 6-3 8 0 2-3 5-3 8 0" stroke="#0369A1" stroke-width="2.1" stroke-linecap="round" opacity=".8"/>
  <!-- bukit -->
  <path d="M8 96c18-24 34-14 44-20 14-8 30 4 44-6 14-10 44-4 66 12v30H8Z" fill="url(#sfHill)"/>
  <path d="M8 96c18-24 34-14 44-20 14-8 30 4 44-6 8-6 20-7 32-4" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="85" cy="108" rx="70" ry="7" fill="#059669" opacity=".12"/>
  <!-- cangkir teh hangat di bukit -->
  <g>
    <path d="M96 84h26l-3 14c-.6 3-2.4 4.5-5.4 4.5h-9.2c-3 0-4.8-1.5-5.4-4.5Z" fill="url(#sfCup)" stroke="#BAE6FD" stroke-width="1.6"/>
    <path d="M96 84h26v5H96Z" fill="#7DD3FC" opacity=".65"/>
    <path d="M122 88c5-1 8 2 7 6-1 3.6-4 5-7 4" stroke="#0369A1" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M102 79c-2-3 2-5 0-8M112 79c-2-3 2-5 0-8" stroke="#7DD3FC" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
  </g>
  <!-- rerumputan -->
  <g stroke="#047857" stroke-width="2.6" stroke-linecap="round">
    <path d="M34 102c-3-4 1-8-1-12"/>
    <path d="M46 104c-3-5 2-8 0-13"/>
    <path d="M140 102c3-4-1-8 1-12"/>
    <path d="M150 104c3-5-2-8 0-13"/>
  </g>
  <circle cx="28" cy="94" r="3" fill="#FCD34D"/>
  <circle cx="153" cy="92" r="2.6" fill="#FCD34D" opacity=".9"/>
  <!-- tunas kecil menyambut pagi -->
  <g transform="translate(66 88)">
    <path d="M0 14V2" stroke="#047857" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M0 8c-6-1-8-5-4-8 4 1 7 4 4 8Z" fill="#34D399"/>
  </g>
</svg>
