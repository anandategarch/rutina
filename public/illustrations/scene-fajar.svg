<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 118" fill="none" role="img" aria-label="Fajar di atas bukit: mentari terbit menemani secangkir teh hangat dan burung-burung kecil">
  <!-- Rutina · fajar — vektor semi-realistis: langit fajar berlapis, mentari berhalo, bukit berkabut, teh hangat -->
  <defs>
    <linearGradient id="sfSky" x1="0" y1="6" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE"/><stop offset=".35" stop-color="#BAE6FD"/>
      <stop offset=".6" stop-color="#FECDD3"/><stop offset=".82" stop-color="#FDE68A"/><stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <radialGradient id="sfSun" cx=".4" cy=".35" r=".65">
      <stop offset="0" stop-color="#FFFBEB"/><stop offset=".55" stop-color="#FDE68A"/><stop offset=".85" stop-color="#FCD34D"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="sfHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".45"/><stop offset=".55" stop-color="#FDE68A" stop-opacity=".18"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sfHalo2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".2"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sfCloud" x1=".2" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="sfFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="sfHill" x1=".1" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".45" stop-color="#4ADE80"/><stop offset=".8" stop-color="#16A34A"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="sfCup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="sfTea" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <linearGradient id="sfStem" x1="0" y1="1" x2=".12" y2="0">
      <stop offset="0" stop-color="#14532D"/><stop offset=".5" stop-color="#22C55E"/><stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="sfLeafL" x1=".15" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".42" stop-color="#4ADE80"/><stop offset=".8" stop-color="#16A34A"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="sfLeafR" x1=".85" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".42" stop-color="#34D399"/><stop offset=".8" stop-color="#15803D"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="sfShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3E2723" stop-opacity=".28"/><stop offset=".6" stop-color="#3E2723" stop-opacity=".1"/><stop offset="1" stop-color="#3E2723" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sfPebble" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#EBDDD0"/><stop offset=".5" stop-color="#C9A57E"/><stop offset="1" stop-color="#8A6642"/>
    </radialGradient>
  </defs>
  <!-- langit fajar -->
  <rect x="8" y="6" width="154" height="80" rx="16" fill="url(#sfSky)"/>
  <!-- mentari terbit dengan dua lingkar halo -->
  <circle cx="62" cy="72" r="42" fill="url(#sfHalo2)"/>
  <circle cx="62" cy="72" r="28" fill="url(#sfHalo)"/>
  <ellipse cx="62" cy="76" rx="46" ry="9" fill="#FDE68A" opacity=".3"/>
  <g stroke-linecap="round">
    <path d="M62 46v-9" stroke="#FCD34D" stroke-width="3.2" opacity=".85"/>
    <path d="M36 72h-9" stroke="#FCD34D" stroke-width="3" opacity=".75"/>
    <path d="M88 72h9" stroke="#FBBF24" stroke-width="3" opacity=".6"/>
    <path d="M44 54l-6-6" stroke="#FCD34D" stroke-width="3" opacity=".75"/>
    <path d="M80 54l6-6" stroke="#FBBF24" stroke-width="3" opacity=".6"/>
  </g>
  <circle cx="62" cy="72" r="20" fill="url(#sfSun)"/>
  <path d="M62 72L82 72A20 20 0 0 1 62 92Z" fill="#D97706" opacity=".28"/>
  <path d="M62 52A20 20 0 0 0 42 72L62 72Z" fill="#FFFBEB" opacity=".4"/>
  <circle cx="56" cy="64" r="3.4" fill="#FFFFFF" opacity=".7"/>
  <!-- awan bergradasi -->
  <path d="M104 32C104 26 110 22 116 24C118 18 126 17 130 21C136 18 142 22 141 28C145 30 145 34 141 36L108 36C105 35 104 34 104 32Z" fill="url(#sfCloud)" opacity=".9"/>
  <path d="M112 33C116 28 124 27 130 30C128 34 121 35 116 34Z" fill="#E2E8F0" opacity=".5"/>
  <path d="M24 24C24 19 29 16 34 18C36 13 43 13 46 17C50 15 55 18 54 23C57 25 56 28 53 29L27 29C25 28 24 26 24 24Z" fill="url(#sfCloud)" opacity=".75"/>
  <path d="M30 26C34 22 40 22 44 25C42 27.4 35 28 30 26Z" fill="#E2E8F0" opacity=".4"/>
  <!-- burung pagi -->
  <path d="M96 14c3-3 6-3 8 0 2-3 5-3 8 0" stroke="#0F172A" stroke-width="2" stroke-linecap="round" opacity=".25"/>
  <path d="M144 40c2.6-2.6 5.2-2.6 7.8 0 2.6-2.6 5.2-2.6 7.8 0" stroke="#0F172A" stroke-width="1.7" stroke-linecap="round" opacity=".2"/>
  <!-- bukit jauh berkabut -->
  <g fill="url(#sfFar)" opacity=".55">
    <path d="M8 95C16 86 28 84 38 88C44 90 48 92 50 95Z"/>
    <path d="M96 74C112 62 132 62 146 72C154 77 158 79 162 81L162 96L96 96Z"/>
  </g>
  <g fill="#15803D" opacity=".38">
    <ellipse cx="118" cy="61.4" rx="2.8" ry="2.6"/><path d="M118 63.6v3" stroke="#15803D" stroke-width="1.2" opacity=".9"/>
    <ellipse cx="130" cy="62.6" rx="2.2" ry="2" opacity=".85"/>
  </g>
  <!-- bukit utama -->
  <path d="M8 96c18-24 34-14 44-20 14-8 30 4 44-6 14-10 44-4 66 12v30H8Z" fill="url(#sfHill)"/>
  <path d="M8 96c18-24 34-14 44-20 14-8 30 4 44-6 14-10 44-4 66 12" stroke="#D9F99D" stroke-width="2.4" opacity=".5" stroke-linecap="round"/>
  <path d="M12 116C40 100 80 96 118 100C138 102 152 104 162 106V126H12Z" fill="#14532D" opacity=".18"/>
  <ellipse cx="85" cy="92" rx="60" ry="5" fill="#FDE68A" opacity=".14"/>
  <!-- cangkir teh hangat -->
  <g>
    <ellipse cx="109" cy="103" rx="17" ry="4" fill="url(#sfShadow)"/>
    <path d="M96 84h26l-3 13.5c-.6 2.8-2.4 4.3-5.4 4.3h-9.2c-3 0-4.8-1.5-5.4-4.3Z" fill="url(#sfCup)"/>
    <ellipse cx="109" cy="84" rx="13" ry="3.1" fill="url(#sfTea)"/>
    <path d="M97.5 83.2C101 81.5 117 81.5 120.5 83.2" stroke="#FFFBEB" stroke-width="1.4" opacity=".7" stroke-linecap="round"/>
    <path d="M97.5 85.6l2.4 11" stroke="#FFFFFF" stroke-width="1.7" opacity=".6" stroke-linecap="round"/>
    <path d="M118.5 86l-2.4 10.2" stroke="#94A3B8" stroke-width="2" opacity=".4" stroke-linecap="round"/>
    <path d="M122 88c5-1 8 2 7 6-1 3.6-4 5-7 4" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M122 88.8c3.6-.6 5.8 1.6 5 4.6" stroke="#F8FAFC" stroke-width="1" opacity=".55" stroke-linecap="round"/>
    <g stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" opacity=".85">
      <path d="M102 82c-2-3 2-5 0-8"/>
      <path d="M112 81c-2-3 2-5 0-8"/>
    </g>
    <path d="M107 77c-1.4-2.2 1.4-3.4 0-5.6" stroke="#E0F2FE" stroke-width="1.7" stroke-linecap="round" opacity=".5"/>
  </g>
  <!-- tunas kecil menyambut pagi -->
  <g transform="translate(66 88)">
    <ellipse cy="2" rx="6" ry="2.2" fill="url(#sfShadow)"/>
    <path d="M0 0V-14" stroke="url(#sfStem)" stroke-width="2.4" stroke-linecap="round"/>
    <g transform="translate(0 -9) scale(.9)">
      <path d="M0 0C-8-2-13-8-7-13C-2-10-2-5 0 0Z" fill="url(#sfLeafL)"/>
      <path d="M0 0C8-2 13-8 7-13C2-10 2-5 0 0Z" fill="url(#sfLeafR)"/>
      <path d="M0 0C-4-3-6-7-5-11M0 0C4-3 6-7 5-11" stroke="#14532D" stroke-width="1" opacity=".38" stroke-linecap="round"/>
    </g>
    <ellipse cx="4.4" cy="-16" rx="1.5" ry="2" fill="#BBF7D0" opacity=".6"/>
    <circle cx="4.2" cy="-16.7" r=".55" fill="#FFFFFF" opacity=".8"/>
  </g>
  <!-- rerumputan depan -->
  <g stroke-linecap="round">
    <path d="M34 102c-3-4 1-8-1-12" stroke="#4ADE80" stroke-width="2.4" opacity=".85"/>
    <path d="M40 104c-2-4 2-7 0-11" stroke="#22C55E" stroke-width="2" opacity=".8"/>
    <path d="M46 104c3-5-2-8 0-13" stroke="#16A34A" stroke-width="2.2" opacity=".8"/>
    <path d="M140 102c3-4-1-8 1-12" stroke="#4ADE80" stroke-width="2.4" opacity=".85"/>
    <path d="M146 104c2-4-2-7 0-11" stroke="#22C55E" stroke-width="2" opacity=".8"/>
    <path d="M150 104c-3-5 2-8 0-13" stroke="#16A34A" stroke-width="2.2" opacity=".8"/>
    <path d="M70 108c-2.6-3.4 1-7-.6-10.4" stroke="#34D399" stroke-width="1.9" opacity=".75"/>
    <path d="M118 110c2.6-3.4-1-7 .6-10.4" stroke="#34D399" stroke-width="1.9" opacity=".75"/>
  </g>
  <!-- kerikil, embun, butir -->
  <ellipse cx="26" cy="106" rx="5" ry="3" fill="url(#sfPebble)"/>
  <ellipse cx="24.6" cy="104.8" rx="1.7" ry=".9" fill="#FFF7ED" opacity=".55"/>
  <ellipse cx="152" cy="108" rx="4" ry="2.4" fill="url(#sfPebble)" opacity=".95"/>
  <ellipse cx="45" cy="93" rx="1.7" ry="2.3" fill="#BBF7D0" opacity=".6"/>
  <circle cx="44.7" cy="92.2" r=".6" fill="#FFFFFF" opacity=".8"/>
  <g fill="#431407" opacity=".28">
    <circle cx="60" cy="110" r="1.2"/><circle cx="100" cy="112" r="1.3"/><circle cx="130" cy="106" r="1.1"/><circle cx="20" cy="110" r="1.2"/>
  </g>
  <circle cx="152" cy="90" r="2.2" fill="#FCD34D" opacity=".85"/>
  <path d="M30 90l1.6 3.8 3.8 1.6-3.8 1.6-1.6 3.8-1.6-3.8-3.8-1.6 3.8-1.6Z" fill="#FCD34D" opacity=".8"/>
  <g fill="#FDE68A" opacity=".55">
    <circle cx="88" cy="64" r="1.4"/><circle cx="146" cy="68" r="1.2"/>
  </g>
</svg>
