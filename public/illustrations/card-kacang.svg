<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · KACANG POLONG — butir kecil dalam satu polong: kebiasaan runtut
       yang enak dipetik satu-satu (kartu kebiasaan: urutan & versi mini) -->
  <defs>
    <radialGradient id="w-kc" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#ECFDF5" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#F0FDF4" stop-opacity=".24"/>
      <stop offset="1" stop-color="#F0FDF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pd-kc" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- cuci warna kebun musim semi di sudut -->
  <rect width="180" height="170" fill="url(#w-kc)"/>

  <!-- tangkai utama melengkung ke sudut -->
  <path d="M58 2C96 4 132 20 156 46C165 56 172 64 177 74" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" opacity=".92"/>
  <path d="M120 14C124 24 130 34 136 40" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" opacity=".78"/>

  <!-- polong utama bergelayut — badan ramping memanjang + jendela butir sejajar -->
  <g transform="translate(141 62) rotate(-18) scale(1.12)">
    <path d="M-27 4C-25 -7 -12 -13 1 -11C12 -9 18 -2 17 6C16 14 5 18 -6 16C-16 14 -25 12 -27 4Z" fill="url(#pd-kc)" stroke="#059669" stroke-width="1.1" stroke-linejoin="round"/>
    <g fill="#ECFDF5" stroke="#059669" stroke-width="1">
      <circle cx="-17" cy="3" r="4.6"/>
      <circle cx="-6" cy="4" r="4.8"/>
      <circle cx="5" cy="3" r="4.6"/>
    </g>
    <!-- ekor polong melengkung (ciri khas polong) -->
    <path d="M17 6C22 5 25 2 26 -2C27 -5 25 -7 23 -6" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- sulur sulung melingkar (ciri khas kebun) -->
  <path d="M168 96C174 92 177 96 173 100C169 104 164 101 166 96C167.6 92.6 163 92 162 95" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>

  <!-- bunga polong (kupu-kupu kecil putih) -->
  <g transform="translate(100 34)">
    <g fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1.1">
      <path d="M-1.4 0C-8 -7 -15 -5 -16 -1C-13 3 -6 3 -1.4 1.6Z"/>
      <path d="M1.4 0C8 -7 15 -5 16 -1C13 3 6 3 1.4 1.6Z"/>
    </g>
    <circle r="2.2" fill="#F59E0B"/>
  </g>

  <!-- polong muda sahabat -->
  <g transform="translate(164 112) rotate(28) scale(.5)">
    <path d="M-27 8C-25 -7 -12 -15 2 -13C14 -11 21 0 19 11C17 21 6 27 -6 25C-17 23 -25 19 -27 8Z" fill="#A7F3D0" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#ECFDF5" stroke="#059669" stroke-width="1.6">
      <circle cx="-16" cy="6" r="4.6"/>
      <circle cx="-4" cy="8" r="4.8"/>
    </g>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="70" cy="14" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="70" cy="14" r="2.6" fill="#FDE68A"/>

  <!-- percik -->
  <g>
    <circle cx="92" cy="52" r="2.6" fill="#FBBF24"/>
    <circle cx="86" cy="62" r="2.2" fill="#34D399"/>
    <circle cx="99" cy="42" r="2" fill="#A7F3D0" opacity=".9"/>
    <path d="M118 84l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
