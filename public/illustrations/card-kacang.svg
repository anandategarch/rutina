<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · KACANG POLONG — vektor semi-realistis: polong bergradasi dengan jendela butir bola berkilau -->
  <defs>
    <radialGradient id="w-kc" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#ECFDF5" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#F0FDF4" stop-opacity=".24"/>
      <stop offset="1" stop-color="#F0FDF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pd-kc" x1=".15" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="pd2-kc" x1=".15" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/>
      <stop offset=".5" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="bn-kc" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#F0FDF4"/>
      <stop offset=".6" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </radialGradient>
    <linearGradient id="st-kc" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset=".5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="pw-kc" cx=".4" cy=".3" r="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".7" stop-color="#FFF1F2"/>
      <stop offset="1" stop-color="#FECDD3"/>
    </radialGradient>
    <radialGradient id="cn-kc" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="dw-kc" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
  </defs>

  <!-- cuci warna kebun musim semi di sudut -->
  <rect width="180" height="170" fill="url(#w-kc)"/>

  <!-- tangkai utama: batang meruncing bergradasi -->
  <path d="M57.4 1.2C95.8 3 132.2 18.8 155.6 45.2C164.2 54.8 170.6 62.6 174.7 70.5L177.3 73.7C170.9 65.8 163.5 57.5 154.2 47.6C133 22 96.2 5.7 56.8 3.4Z" fill="url(#st-kc)"/>
  <path d="M58.4 2C96.6 3.8 132.6 19.6 156 46C164.6 55.6 170.8 63.2 174.6 70.6" fill="none" stroke="#BBF7D0" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
  <path d="M155 48.6C134.2 23.4 97.4 7 57.4 4.8" fill="none" stroke="#14532D" stroke-width=".8" opacity=".3" stroke-linecap="round"/>
  <!-- cabang penggantung polong -->
  <path d="M120 14C124 24 130 34 136 40" fill="none" stroke="url(#st-kc)" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>

  <!-- polong utama: badan ramping + jendela butir sejajar -->
  <g transform="translate(141 62) rotate(-18) scale(1.12)" stroke-linejoin="round">
    <path d="M-27 4C-25 -7 -12 -13 1 -11C12 -9 18 -2 17 6C16 14 5 18 -6 16C-16 14 -25 12 -27 4Z" fill="url(#pd-kc)" stroke="#14532D" stroke-width="1"/>
    <!-- bayang inti bawah polong -->
    <path d="M13 -4C17 0 17 6 12 10C6 13.6 -1 15 -6 14C0 11 6 6 7 -1C9 -2.6 11 -3.6 13 -4Z" fill="#14532D" opacity=".22"/>
    <!-- rim cahaya atas polong -->
    <path d="M-25.4 1.6C-22 -6 -12 -11 -1 -10.8" fill="none" stroke="#D9F99D" stroke-width="1.2" opacity=".55" stroke-linecap="round"/>
    <!-- urat memanjang polong -->
    <path d="M-26 5C-16 -1 -4 -1 16 5" fill="none" stroke="#14532D" stroke-width=".9" opacity=".38" stroke-linecap="round"/>
    <!-- jendela butir: bola hijau muda berkilau -->
    <g fill="url(#bn-kc)" stroke="#14532D" stroke-width=".9">
      <circle cx="-17" cy="3" r="4.6"/>
      <circle cx="-6" cy="4" r="4.8"/>
      <circle cx="5" cy="3" r="4.6"/>
    </g>
    <g fill="#FFFFFF" opacity=".7">
      <circle cx="-18.4" cy="1.4" r="1.1"/>
      <circle cx="-7.4" cy="2.4" r="1.15"/>
      <circle cx="3.6" cy="1.4" r="1.1"/>
    </g>
    <!-- ekor polong melengkung -->
    <path d="M17 6C22 5 25 2 26 -2C27 -5 25 -7 23 -6" fill="none" stroke="url(#st-kc)" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>
    <!-- embun di polong -->
    <ellipse cx="2" cy="-8" rx="1.3" ry="1.8" fill="url(#dw-kc)" transform="rotate(-20 2 -8)"/>
    <circle cx="1.4" cy="-8.8" r=".5" fill="#FFFFFF" opacity=".85"/>
  </g>

  <!-- sulur sulung melingkar khas kebun -->
  <path d="M168 96C174 92 177 96 173 100C169 104 164 101 166 96C167.6 92.6 163 92 162 95" fill="none" stroke="url(#st-kc)" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>

  <!-- bunga polong: kupu-kupu kecil putih bergradasi -->
  <g transform="translate(100 34)">
    <g fill="url(#pw-kc)" stroke="#FDA4AF" stroke-width="1.1">
      <path d="M-1.4 0C-8 -7 -15 -5 -16 -1C-13 3 -6 3 -1.4 1.6Z"/>
      <path d="M1.4 0C8 -7 15 -5 16 -1C13 3 6 3 1.4 1.6Z"/>
    </g>
    <g fill="none" stroke="#FDA4AF" stroke-width=".6" opacity=".4">
      <path d="M-8 -3C-10 -1.6 -12.6 -1 -14.6 -1"/>
      <path d="M8 -3C10 -1.6 12.6 -1 14.6 -1"/>
    </g>
    <circle r="2.2" fill="#F59E0B"/>
    <circle r="1" fill="#FDE68A"/>
    <circle cx="-.8" cy="-.8" r=".4" fill="#FFFBEB" opacity=".8"/>
  </g>

  <!-- polong muda sahabat -->
  <g transform="translate(164 112) rotate(28) scale(.5)" stroke-linejoin="round">
    <path d="M-27 8C-25 -7 -12 -15 2 -13C14 -11 21 0 19 11C17 21 6 27 -6 25C-17 23 -25 19 -27 8Z" fill="url(#pd2-kc)" stroke="#14532D" stroke-width="1.6"/>
    <path d="M-25 9C-14 2 0 0 17 10" fill="none" stroke="#14532D" stroke-width="1" opacity=".35" stroke-linecap="round"/>
    <g fill="url(#bn-kc)" stroke="#14532D" stroke-width="1.4">
      <circle cx="-16" cy="6" r="4.6"/>
      <circle cx="-4" cy="8" r="4.8"/>
    </g>
    <circle cx="-17.4" cy="4.4" r="1" fill="#FFFFFF" opacity=".7"/>
  </g>

  <!-- koin amber: muka radial, cincin, kecambah timbul, kilau sabit -->
  <g>
    <circle cx="70" cy="14" r="6.4" fill="url(#cn-kc)" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="70" cy="14" r="4.7" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M70 17.6C70.2 16.2 71 15.2 72.3 14.8" fill="none" stroke="#B45309" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M72.3 14.8C72 13.4 72.8 12.2 74.1 12.4C74.3 13.7 73.5 14.8 72.3 14.8Z" fill="#D97706" opacity=".9"/>
    <path d="M72.3 14.8C71.6 13.4 70.2 13 69.2 13.8C69.6 15.1 71 15.6 72.3 14.8Z" fill="#B45309" opacity=".9"/>
    <path d="M66.2 11.2a5.6 5.6 0 0 1 3.8 -2.6" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    <circle cx="67.4" cy="11.4" r=".8" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- percik kebun: titik berkilau -->
  <g>
    <circle cx="92" cy="52" r="2.6" fill="#FBBF24"/>
    <circle cx="91.2" cy="51.2" r=".9" fill="#FEF3C7" opacity=".8"/>
    <circle cx="86" cy="62" r="2.2" fill="#34D399" opacity=".9"/>
    <circle cx="99" cy="42" r="2" fill="#86EFAC" opacity=".9"/>
    <circle cx="99.6" cy="41.4" r=".7" fill="#D9F99D" opacity=".8"/>
    <path d="M118 84l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1z" fill="#FBBF24" opacity=".9"/>
    <circle cx="104" cy="70" r="1.6" fill="#FDE68A" opacity=".7"/>
  </g>
</svg>
