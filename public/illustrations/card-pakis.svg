<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · PAKIS — daun pakis anak-tangga: ritme teratur hari demi hari (kartu pekan/ritme & arus dana) -->
  <defs>
    <radialGradient id="w-pk" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#D1FAE5" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#ECFDF5" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lf-pk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <!-- cuci warna hutan hijau di sudut -->
  <rect width="180" height="170" fill="url(#w-pk)"/>

  <!-- rachis (tulang daun) pakis melengkung ke sudut -->
  <path d="M56 4C96 8 136 24 158 50C166 60 172 68 177 76" fill="none" stroke="#059669" stroke-width="2.8" stroke-linecap="round" opacity=".9"/>

  <!-- pinnae (anak daun) berselang-seling mengecil ke ujung -->
  <g stroke-linejoin="round">
    <!-- pasangan besar arah masuk kartu -->
    <g fill="url(#lf-pk)" stroke="#10B981" stroke-width=".9">
      <path d="M0 0C-3-10 -12-16 -22-13C-20-3 -9 3 0 0Z" transform="translate(74 14)"/>
      <path d="M0 0C3-10 12-16 22-13C20-3 9 3 0 0Z" transform="translate(86 24)"/>
      <path d="M0 0C-3-9 -11-14 -20-11C-18-2 -8 3 0 0Z" transform="translate(96 30)"/>
      <path d="M0 0C3-9 11-14 20-11C18-2 8 3 0 0Z" transform="translate(108 38)"/>
      <path d="M0 0C-3-8 -10-13 -18-10C-16-2 -7 2 0 0Z" transform="translate(118 46)"/>
      <path d="M0 0C3-8 10-13 18-10C16-2 7 2 0 0Z" transform="translate(128 56)"/>
      <path d="M0 0C-2.6-7 -9-11 -15-9C-13-2 -6 2 0 0Z" transform="translate(138 64)"/>
      <path d="M0 0C2.6-7 9-11 15-9C13-2 6 2 0 0Z" transform="translate(146 74)"/>
      <path d="M0 0C-2.2-6 -7.6-9.6 -12.6-7.6C-11-1.6 -5 1.6 0 0Z" transform="translate(154 84)"/>
      <path d="M0 0C2.2-6 7.6-9.6 12.6-7.6C11-1.6 5 1.6 0 0Z" transform="translate(160 96)"/>
      <path d="M0 0C-1.8-5 -6.4-8 -10.6-6.4C-9.4-1.4 -4.2 1.2 0 0Z" transform="translate(166 108)"/>
      <path d="M0 0C1.8-5 6.4-8 10.6-6.4C9.4-1.4 4.2 1.2 0 0Z" transform="translate(170 122)"/>
    </g>
  </g>

  <!-- sorum (bulatan spora) di beberapa pinna -->
  <g fill="#059669" opacity=".5">
    <circle cx="66" cy="9" r="1.7"/>
    <circle cx="90" cy="21" r="1.5"/>
    <circle cx="112" cy="35" r="1.4"/>
    <circle cx="134" cy="53" r="1.2"/>
  </g>

  <!-- tunas gulung muda (fiddlehead) menghadap kartu -->
  <g transform="translate(52 30)">
    <path d="M0 0C2-14 12-22 22-19C24-9 14 0 0 0Z" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M4-4C7-11 13-15 19-14" fill="none" stroke="#6EE7B7" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="80" cy="38" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="80" cy="38" r="2.6" fill="#FDE68A"/>

  <!-- percik -->
  <g>
    <circle cx="172" cy="86" r="2.6" fill="#34D399"/>
    <circle cx="168" cy="102" r="2.2" fill="#FCD34D"/>
    <circle cx="130" cy="70" r="2" fill="#A7F3D0" opacity=".9"/>
    <circle cx="106" cy="56" r="1.9" fill="#A7F3D0" opacity=".8"/>
    <path d="M152 118l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
