<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Bintang jatuh">
  <defs>
    <linearGradient id="g-amb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
    <radialGradient id="meteor-halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FDE68A" stop-opacity=".8"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1: latar sky malam lembut -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/>
  <circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2: bayangan halus -->
  <ellipse cx="32" cy="78" rx="15" ry="2.8" fill="#0F172A" opacity=".05"/>
  <!-- L3: halo bintang -->
  <circle cx="63" cy="31" r="17" fill="url(#meteor-halo)"/>
  <!-- bintang utama besar (4 titik) -->
  <path d="M63 12l4.2 14.8L82 31l-14.8 4.2L63 50l-4.2-14.8L44 31l14.8-4.2z" fill="url(#g-amb2)"/>
  <path d="M63 21l2 8 8 2-8 2-2 8-2-8-8-2 8-2z" fill="#FDE68A"/>
  <circle cx="63" cy="31" r="2.6" fill="#FFFFFF"/>
  <!-- L4: ekor jatuh tiga lapis -->
  <path d="M50 46Q31 58 17 76" stroke="url(#g-sky)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity=".8"/>
  <path d="M56 52Q42 62 30 74" stroke="url(#g-sky)" stroke-width="3.8" stroke-linecap="round" fill="none" opacity=".55"/>
  <path d="M61 58Q52 65 45 73" stroke="url(#g-sky)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".35"/>
  <!-- percikan ekor -->
  <circle cx="36" cy="52" r="2.2" fill="#7DD3FC"/>
  <circle cx="27" cy="62" r="1.8" fill="#BAE6FD"/>
  <!-- L5: bintang kecil sekitar -->
  <path d="M25 24l1 2.6 2.6 1-2.6 1L25 31.2l-1-2.6-2.6-1 2.6-1z" fill="#94A3B8"/>
  <path d="M76 52l1 2.6 2.6 1-2.6 1L76 59.2l-1-2.6-2.6-1 2.6-1z" fill="#94A3B8"/>
  <circle cx="70" cy="16" r="1.8" fill="#CBD5E1"/>
  <!-- L6: bintang kilau -->
  <path d="M34 34l1.2 3.2 3.2 1.2-3.2 1.2L34 42.8l-1.2-3.2-3.2-1.2 3.2-1.2z" fill="#FBBF24"/>
</svg>
