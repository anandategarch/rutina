<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · MAPLE — vektor semi-realistis: daun maple bergradasi dengan urat tegas dan petiole meruncing -->
  <defs>
    <radialGradient id="w-mp" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FFEDD5" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#FFF7ED" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FFF7ED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lf-mp" x1=".15" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset=".5" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="lf2-mp" x1=".15" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#FECDD3"/>
      <stop offset=".5" stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="br-mp" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset=".5" stop-color="#B45309"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="pt-mp" x1=".2" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset=".6" stop-color="#C2410C"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <radialGradient id="cn-mp" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="dw-mp" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
  </defs>

  <!-- cuci warna musim gugur di sudut -->
  <rect width="180" height="170" fill="url(#w-mp)"/>

  <!-- ranting kayu meruncing bergradasi -->
  <path d="M57.4 1.2C95.8 3 132.2 18.8 155.6 45.2C164.2 54.8 170.6 62.6 174.7 70.5L177.3 73.7C170.9 65.8 163.5 57.5 154.2 47.6C133 22 96.2 5.7 56.8 3.4Z" fill="url(#br-mp)"/>
  <path d="M58.4 2C96.6 3.8 132.6 19.6 156 46C164.6 55.6 170.8 63.2 174.6 70.6" fill="none" stroke="#FCD34D" stroke-width=".8" opacity=".45" stroke-linecap="round"/>
  <path d="M155 48.6C134.2 23.4 97.4 7 57.4 4.8" fill="none" stroke="#571F05" stroke-width=".8" opacity=".3" stroke-linecap="round"/>

  <!-- daun maple besar: lima lobus runcing dari satu pangkal -->
  <g transform="translate(141 44) rotate(14)" stroke-linejoin="round">
    <g fill="url(#lf-mp)" stroke="#C2410C" stroke-width="1.1">
      <path d="M0 2C-2 -4 -2 -14 0 -26C2 -14 2 -4 0 2Z"/>
      <path d="M0 0C-3 -6 -8 -13 -15 -17C-10 -8 -5 -2 0 0Z"/>
      <path d="M0 0C3 -6 8 -13 15 -17C10 -8 5 -2 0 0Z"/>
      <path d="M0 0C-4 -2 -10 -2 -14 1C-8 2 -3 1 0 0Z"/>
      <path d="M0 0C4 -2 10 -2 14 1C8 2 3 1 0 0Z"/>
    </g>
    <!-- bayang inti lobus kanan-bawah -->
    <path d="M1 .6C3.4 -5.4 8 -12.6 14.6 -16.6C10.6 -8.6 5.6 -2.6 .6 1Z" fill="#9A3412" opacity=".22"/>
    <path d="M.4 .2C4.4 -1.6 9.6 -1.6 13.6 .6C8.6 1.6 3.6 .8 .4 .2Z" fill="#9A3412" opacity=".25"/>
    <!-- rim cahaya lobus kiri-atas -->
    <path d="M0 0C-3 -6 -8 -13 -15 -17" fill="none" stroke="#FED7AA" stroke-width="1.6" opacity=".5" stroke-linecap="round"/>
    <ellipse cx="-1.6" cy="-9" rx="1.5" ry="3" fill="#FFFFFF" opacity=".4" transform="rotate(-8 -1.6 -9)"/>
    <!-- urat daun: ibu + anak -->
    <g fill="none" stroke="#9A3412" stroke-linecap="round">
      <path d="M0 2L0 -23" stroke-width="1" opacity=".45"/>
      <path d="M0 -8C-2.4 -11.6 -5.4 -13.8 -8.6 -15.2" stroke-width=".7" opacity=".35"/>
      <path d="M0 -8C2.4 -11.6 5.4 -13.8 8.6 -15.2" stroke-width=".7" opacity=".35"/>
      <path d="M0 -.6C-4.6 -1.6 -9.4 -.6 -13.4 1" stroke-width=".7" opacity=".3"/>
      <path d="M0 -.6C4.6 -1.6 9.4 -.6 13.4 1" stroke-width=".7" opacity=".3"/>
    </g>
    <!-- petiole meruncing -->
    <path d="M0 2C-.6 8 -.8 15 -.4 21.4L.6 21.6C.4 15 .4 8 .8 2.4Z" fill="url(#pt-mp)"/>
    <!-- embun di lobus kiri-bawah -->
    <ellipse cx="-7.4" cy="3.4" rx="1.5" ry="2.1" fill="url(#dw-mp)" transform="rotate(-20 -7.4 3.4)"/>
    <circle cx="-8.1" cy="2.6" r=".55" fill="#FFFFFF" opacity=".85"/>
  </g>

  <!-- daun maple muda (rose, masih berubah warna) -->
  <g transform="translate(112 22) rotate(-16) scale(.62)" stroke-linejoin="round">
    <g fill="url(#lf2-mp)" stroke="#BE123C" stroke-width="1.7">
      <path d="M0 2C-2 -4 -2 -14 0 -26C2 -14 2 -4 0 2Z"/>
      <path d="M0 0C-3 -6 -8 -13 -15 -17C-10 -8 -5 -2 0 0Z"/>
      <path d="M0 0C3 -6 8 -13 15 -17C10 -8 5 -2 0 0Z"/>
      <path d="M0 0C-4 -2 -10 -2 -14 1C-8 2 -3 1 0 0Z"/>
      <path d="M0 0C4 -2 10 -2 14 1C8 2 3 1 0 0Z"/>
    </g>
    <path d="M0 -8C-2.4 -11.6 -5.4 -13.8 -8.6 -15.2M0 -8C2.4 -11.6 5.4 -13.8 8.6 -15.2" fill="none" stroke="#9F1239" stroke-width="1.1" opacity=".4" stroke-linecap="round"/>
    <path d="M0 0C-3 -6 -8 -13 -15 -17" fill="none" stroke="#FECDD3" stroke-width="2.4" opacity=".5" stroke-linecap="round"/>
    <path d="M0 2L0 22" fill="none" stroke="#C2410C" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- daun maple mini sahabat di ranting -->
  <g transform="translate(168 100) rotate(24) scale(.46)" stroke-linejoin="round">
    <g fill="url(#lf-mp)" stroke="#C2410C" stroke-width="2">
      <path d="M0 2C-2 -4 -2 -14 0 -26C2 -14 2 -4 0 2Z"/>
      <path d="M0 0C-3 -6 -8 -13 -15 -17C-10 -8 -5 -2 0 0Z"/>
      <path d="M0 0C3 -6 8 -13 15 -17C10 -8 5 -2 0 0Z"/>
      <path d="M0 0C-4 -2 -10 -2 -14 1C-8 2 -3 1 0 0Z"/>
      <path d="M0 0C4 -2 10 -2 14 1C8 2 3 1 0 0Z"/>
    </g>
    <path d="M0 2L0 20" fill="none" stroke="#C2410C" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- daun melayang lepas dari ranting -->
  <g transform="translate(88 52) rotate(38) scale(.42)" opacity=".92" stroke-linejoin="round">
    <g fill="url(#lf2-mp)" stroke="#BE123C" stroke-width="2.2">
      <path d="M0 2C-2 -4 -2 -14 0 -26C2 -14 2 -4 0 2Z"/>
      <path d="M0 0C-3 -6 -8 -13 -15 -17C-10 -8 -5 -2 0 0Z"/>
      <path d="M0 0C3 -6 8 -13 15 -17C10 -8 5 -2 0 0Z"/>
      <path d="M0 0C-4 -2 -10 -2 -14 1C-8 2 -3 1 0 0Z"/>
      <path d="M0 0C4 -2 10 -2 14 1C8 2 3 1 0 0Z"/>
    </g>
    <path d="M0 2L0 18" fill="none" stroke="#C2410C" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M0 -8C-2 -11.6 -4.6 -13.4 -7 -14.6" fill="none" stroke="#9F1239" stroke-width="1.4" opacity=".4" stroke-linecap="round"/>
  </g>
  <!-- jejak angin lembut di bawah daun melayang -->
  <path d="M74 62C78 64 82 64 86 63M78 68C81.4 69.4 85 69.2 88 68" fill="none" stroke="#FDA4AF" stroke-width="1.2" opacity=".4" stroke-linecap="round"/>

  <!-- koin amber: muka radial, cincin, kecambah timbul, kilau sabit -->
  <g>
    <circle cx="70" cy="14" r="6.4" fill="url(#cn-mp)" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="70" cy="14" r="4.7" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M70 17.6C70.2 16.2 71 15.2 72.3 14.8" fill="none" stroke="#B45309" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M72.3 14.8C72 13.4 72.8 12.2 74.1 12.4C74.3 13.7 73.5 14.8 72.3 14.8Z" fill="#D97706" opacity=".9"/>
    <path d="M72.3 14.8C71.6 13.4 70.2 13 69.2 13.8C69.6 15.1 71 15.6 72.3 14.8Z" fill="#B45309" opacity=".9"/>
    <path d="M66.2 11.2a5.6 5.6 0 0 1 3.8 -2.6" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    <circle cx="67.4" cy="11.4" r=".8" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- percik musim gugur: titik berkilau -->
  <g>
    <circle cx="96" cy="38" r="2.6" fill="#FBBF24"/>
    <circle cx="95.2" cy="37.2" r=".9" fill="#FEF3C7" opacity=".8"/>
    <circle cx="90" cy="48" r="2.2" fill="#34D399" opacity=".9"/>
    <circle cx="102" cy="28" r="2" fill="#86EFAC" opacity=".9"/>
    <circle cx="102.6" cy="27.4" r=".7" fill="#D9F99D" opacity=".8"/>
    <path d="M132 76l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1z" fill="#FBBF24" opacity=".9"/>
    <circle cx="112" cy="62" r="1.6" fill="#FDE68A" opacity=".7"/>
  </g>
</svg>
