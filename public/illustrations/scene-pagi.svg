<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" fill="none" role="img" aria-label="Ilustrasi rutinitas pagi: kamar terang dengan jendela besar, matahari pagi, tanaman pot di ambang jendela, dan meja kayu berisi teh hangat serta buku">
  <defs>
    <!-- Gradien kaca jendela: langit pagi yang lembut -->
    <linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/><stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g-em2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EE7B8"/><stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="g-amb2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="g-blu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A16207"/><stop offset="1" stop-color="#713F12"/>
    </linearGradient>
    <!-- Kilau radial putih untuk permukaan putih (bingkai, ambang, cangkir) -->
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dinding kamar bernuansa #F0FDF4 -->
  <rect width="480" height="320" fill="#F0FDF4"/>

  <!-- Lapisan udara pagi: blob besar beropacity rendah -->
  <circle cx="372" cy="44" r="150" fill="#E0F2FE" opacity=".45"/>
  <circle cx="120" cy="54" r="95" fill="#FEF3C7" opacity=".5"/>
  <circle cx="252" cy="148" r="92" fill="#ECFDF5" opacity=".55"/>
  <circle cx="432" cy="212" r="96" fill="#D1FAE5" opacity=".4"/>

  <!-- Lantai: band emerald lembut dengan garis horizon halus -->
  <path d="M0 252C120 244 250 258 360 250C415 246 455 252 480 248L480 320H0Z" fill="url(#g-em2)" opacity=".5"/>
  <path d="M0 292C140 284 300 296 480 286L480 320H0Z" fill="url(#g-em)" opacity=".3"/>
  <path d="M0 252C120 244 250 258 360 250C415 246 455 252 480 248" stroke="#FFFFFF" stroke-width="2.5" opacity=".55"/>

  <!-- Bingkai foto kecil di dinding -->
  <rect x="246" y="76" width="54" height="66" rx="7" fill="#FFFFFF"/>
  <rect x="246" y="76" width="54" height="66" rx="7" fill="url(#g-bghigh)"/>
  <rect x="254" y="84" width="38" height="50" rx="4" fill="url(#g-glass)"/>
  <path d="M254 122c6-8 14-10 20-5 5-5 12-6 18-3v20h-38z" fill="#6EE7B8" opacity=".85"/>
  <circle cx="282" cy="95" r="5" fill="#FCD34D"/>

  <!-- Jendela besar: bingkai putih -->
  <rect x="34" y="40" width="172" height="172" rx="12" fill="#FFFFFF"/>
  <rect x="34" y="40" width="172" height="172" rx="12" fill="url(#g-bghigh)"/>
  <!-- Kaca jendela dengan pemandangan pagi -->
  <rect x="47" y="53" width="146" height="146" rx="7" fill="url(#g-glass)"/>
  <path d="M47 194c15-10 33-12 47-5 12-8 29-10 42-4 12-5 27-6 39-2 6 1 12 2 18 3v13H47z" fill="#D1FAE5" opacity=".8"/>
  <!-- Matahari pagi dengan pendar hangat -->
  <circle cx="157" cy="94" r="33" fill="#FDE68A" opacity=".45"/>
  <circle cx="157" cy="94" r="23" fill="url(#g-amb2)"/>
  <path d="M147 85a15 15 0 0 1 9-6" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity=".45"/>
  <!-- Awan putih di kaca jendela -->
  <g fill="#FFFFFF" opacity=".92">
    <ellipse cx="74" cy="99" rx="15" ry="8.5"/>
    <ellipse cx="90" cy="96" rx="11" ry="7"/>
    <ellipse cx="61" cy="101" rx="9" ry="5.5"/>
  </g>
  <g fill="#FFFFFF" opacity=".85">
    <ellipse cx="78" cy="163" rx="12" ry="7"/>
    <ellipse cx="92" cy="161" rx="9" ry="5.5"/>
  </g>
  <!-- Palang jendela -->
  <rect x="114" y="53" width="7" height="146" rx="3.5" fill="#FFFFFF"/>
  <rect x="47" y="121" width="146" height="7" rx="3.5" fill="#FFFFFF"/>
  <!-- Kilau kaca jendela -->
  <path d="M66 160 86 138" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".3"/>
  <path d="M78 168 94 150" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".22"/>
  <!-- Bingkai bawah jendela (penghubung kaca ke ambang) -->
  <rect x="41" y="199" width="158" height="14" rx="7" fill="#FFFFFF"/>
  <!-- Ambang jendela -->
  <rect x="24" y="212" width="192" height="13" rx="6.5" fill="#FFFFFF"/>
  <rect x="24" y="212" width="192" height="13" rx="6.5" fill="url(#g-bghigh)"/>
  <rect x="34" y="225" width="172" height="4.5" rx="2.25" fill="#0F172A" opacity=".06"/>

  <!-- Tanaman pot kecil di ambang jendela -->
  <ellipse cx="118" cy="213.5" rx="17" ry="3" fill="#0F172A" opacity=".08"/>
  <path d="M108 172c-13 8-17 20-12 28 8-2 15-16 12-28z" fill="url(#g-em)"/>
  <path d="M128 172c13 8 17 20 12 28-8-2-15-16-12-28z" fill="url(#g-em)"/>
  <path d="M118 166c-6 12-6 24 0 32 6-8 6-20 0-32z" fill="url(#g-em2)"/>
  <rect x="100" y="188" width="36" height="8" rx="4" fill="#FDE68A"/>
  <path d="M103 196h30l-4 14c-1 2.4-3 4-5.6 4h-10.8c-2.6 0-4.6-1.6-5.6-4z" fill="url(#g-amb2)"/>
  <path d="M108 200c-1 4-1 7 0 10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".4"/>

  <!-- Meja kayu di kanan bawah -->
  <ellipse cx="356" cy="310" rx="108" ry="9" fill="#0F172A" opacity=".07"/>
  <rect x="272" y="238" width="13" height="72" rx="6" fill="url(#g-wood)"/>
  <rect x="428" y="238" width="13" height="72" rx="6" fill="url(#g-wood)"/>
  <rect x="252" y="226" width="210" height="16" rx="8" fill="url(#g-wood)"/>
  <path d="M266 235c50-2 106-2 156 0" stroke="#713F12" stroke-width="1.5" opacity=".35"/>
  <path d="M268 231h34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".35"/>

  <!-- Cangkir teh hangat dengan uap tipis -->
  <ellipse cx="312" cy="232" rx="29" ry="5" fill="#0F172A" opacity=".06"/>
  <ellipse cx="312" cy="230" rx="27" ry="5.5" fill="#FFFFFF"/>
  <ellipse cx="312" cy="230" rx="27" ry="5.5" fill="url(#g-bghigh)"/>
  <path d="M288 197c2 18 10 27 24 29 14-2 22-11 24-29z" fill="#FFFFFF"/>
  <path d="M288 197c2 18 10 27 24 29 14-2 22-11 24-29z" fill="url(#g-bghigh)"/>
  <!-- Pegangan cangkir -->
  <path d="M337 203c11 0 16 7 14 14-1.6 6-7 9-13 8" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  <path d="M337 203c11 0 16 7 14 14-1.6 6-7 9-13 8" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Permukaan teh dan bayangan sisi cangkir -->
  <ellipse cx="312" cy="197" rx="24" ry="6" fill="#E2E8F0"/>
  <ellipse cx="312" cy="197" rx="19" ry="4.5" fill="url(#g-amb2)"/>
  <path d="M328 205c-1 9-6 16-13 20" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <!-- Uap teh naik -->
  <path d="M303 186c-5-7 4-11 0-18-3-5 1-9 0-13" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
  <path d="M320 184c-4-6 3-10 0-16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".45"/>

  <!-- Buku tertutup berwarna biru -->
  <ellipse cx="406" cy="230" rx="47" ry="4" fill="#0F172A" opacity=".06"/>
  <g transform="rotate(-4 406 224)">
    <rect x="364" y="221" width="80" height="9" rx="3.5" fill="#FFFFFF"/>
    <path d="M371 225h64M371 227.5h58" stroke="#E2E8F0" stroke-width="1.3"/>
    <rect x="358" y="211" width="90" height="13" rx="5" fill="url(#g-blu)"/>
    <path d="M366 216h26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".4"/>
    <path d="M428 218v10l4-3 4 3v-10z" fill="#F97316"/>
  </g>

  <!-- Bintang kilau pagi di dekat matahari -->
  <path transform="translate(178 72) scale(.9)" d="M0 -8L2 -2 8 0 2 2 0 8 -2 2 -8 0 -2 -2Z" fill="#FBBF24"/>
  <path transform="translate(216 56) scale(.7)" d="M0 -8L2 -2 8 0 2 2 0 8 -2 2 -8 0 -2 -2Z" fill="#FBBF24"/>
</svg>
