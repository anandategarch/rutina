<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Kunang-kunang senja">
  <defs>
    <radialGradient id="kunang-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FDE68A" stop-opacity=".9"/><stop offset=".45" stop-color="#FCD34D" stop-opacity=".55"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1: latar slate senja -->
  <circle cx="48" cy="48" r="46" fill="#F1F5F9"/>
  <circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2: bayangan tanah -->
  <ellipse cx="48" cy="80" rx="20" ry="3.2" fill="#0F172A" opacity=".06"/>
  <!-- L3: pendar besar ekor kunang -->
  <circle cx="38" cy="60" r="16" fill="url(#kunang-glow)"/>
  <ellipse cx="38" cy="60" rx="6" ry="7.5" fill="#FCD34D"/>
  <ellipse cx="38" cy="60" rx="3.4" ry="4.5" fill="#FBBF24"/>
  <!-- badan kunang: kepala + toraks mengarah ke kanan-atas -->
  <g transform="rotate(35 55 42)">
    <ellipse cx="55" cy="42" rx="10" ry="6.5" fill="#334155"/>
    <path d="M50 38.5h10M50 42h10M50 45.5h10" stroke="#475569" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
    <circle cx="64" cy="42" r="4.5" fill="#334155"/>
    <circle cx="65.5" cy="40.8" r="1.2" fill="#FFFFFF" opacity=".85"/>
  </g>
  <!-- kaki kecil -->
  <path d="M59 49l3 3M56 51l2 3.5" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  <!-- L4: sayap terbuka jelas -->
  <ellipse cx="52" cy="30" rx="10" ry="4.5" transform="rotate(-38 52 30)" fill="#FFFFFF" opacity=".75"/>
  <ellipse cx="65" cy="33" rx="9" ry="4" transform="rotate(-16 65 33)" fill="#FFFFFF" opacity=".6"/>
  <path d="M46 27q5-4 11-3" stroke="#FFFFFF" stroke-width="1.6" opacity=".8" stroke-linecap="round" fill="none"/>
  <!-- L5: pendar teman -->
  <circle cx="22" cy="32" r="4.5" fill="url(#kunang-glow)"/>
  <circle cx="22" cy="32" r="1.8" fill="#FCD34D"/>
  <circle cx="72" cy="66" r="4" fill="url(#kunang-glow)"/>
  <circle cx="72" cy="66" r="1.5" fill="#FDE68A"/>
  <!-- rumput -->
  <path d="M28 78q1-6 5-8M35 78q0-7 4-9M42 78q1-5 4-6" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".8"/>
  <!-- L6: bintang kilau -->
  <path d="M26 18l1.2 3.2 3.2 1.2-3.2 1.2L26 26.8l-1.2-3.2-3.2-1.2 3.2-1.2z" fill="#FBBF24"/>
</svg>
