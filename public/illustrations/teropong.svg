<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Teropong — melihat wawasan lebih jauh</title>
  <defs>
    <linearGradient id="g-blu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="g-slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema sky -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="80" rx="20" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- L3 dua tabung teropong -->
  <g transform="rotate(-12 48 48)">
    <rect x="22" y="34" width="17" height="34" rx="6" fill="url(#g-blu)"/>
    <rect x="57" y="34" width="17" height="34" rx="6" fill="url(#g-blu)"/>
    <!-- lensa objektif lebih besar -->
    <rect x="20" y="60" width="21" height="10" rx="4" fill="url(#g-blu)"/>
    <rect x="55" y="60" width="21" height="10" rx="4" fill="url(#g-blu)"/>
    <!-- jembatan tengah -->
    <rect x="39" y="42" width="18" height="6" rx="3" fill="url(#g-slate)"/>
    <!-- roda fokus -->
    <circle cx="48" cy="52" r="6" fill="url(#g-slate)"/>
    <circle cx="48" cy="52" r="2.5" fill="#64748B"/>
  </g>
  <!-- L4 kilau lensa -->
  <path d="M28 40v14" stroke="#FFFFFF" stroke-width="2.5" opacity=".45" stroke-linecap="round" fill="none"/>
  <path d="M63 40v14" stroke="#FFFFFF" stroke-width="2.5" opacity=".45" stroke-linecap="round" fill="none"/>
  <!-- L5 garis pandang -->
  <path d="M14 24h6M12 30h4M14 36h6" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="78" cy="26" r="3.5" fill="#93C5FD"/>
  <!-- L6 bintang kilau -->
  <path d="M26 20l1.2 3 3 1.2-3 1.2L26 28.4l-1.2-3-3-1.2 3-1.2z" fill="#FBBF24"/>
</svg>
