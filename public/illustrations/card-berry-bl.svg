<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" preserveAspectRatio="xMinYMax meet">
  <!-- Rutina · BERRY-BL — vektor semi-realistis: beri bulat bergradasi berkilaup, kelopak buah, daun berurat (versi halus) -->
  <defs>
    <radialGradient id="w-brbl" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#FDF2F8" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ECFDF5" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="br-brbl" x1=".05" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#86EFAC"/><stop offset=".52" stop-color="#22C55E"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="bb-brbl" cx=".36" cy=".3" r=".95">
      <stop offset="0" stop-color="#FDA4AF"/><stop offset=".55" stop-color="#E11D48"/><stop offset="1" stop-color="#881337"/>
    </radialGradient>
    <radialGradient id="ab-brbl" cx=".36" cy=".3" r=".95">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="lf-brbl" x1=".05" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="ck-brbl" cx=".4" cy=".35" r=".85">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
  </defs>
  <!-- cuci lembut sudut kiri-bawah -->
  <rect width="110" height="100" fill="url(#w-brbl)"/>
  <!-- batang & cabang meruncing bergradasi -->
  <path d="M3.4 97.2C10.4 78.6 22.4 62.8 38.2 52.9C44.1 49 50.1 46.1 56.6 43.9L58.2 45.9C51.9 48 46 50.8 40.3 54.6C24.9 64 13.7 79.4 7 98.4C5.2 99.6 3.4 98.8 3.4 97.2Z" fill="url(#br-brbl)"/>
  <path d="M5 96.4C11.6 79 23 63.6 38.6 54" fill="none" stroke="#D1FAE5" stroke-width=".8" opacity=".45" stroke-linecap="round"/>
  <path d="M39.6 53.2C42.4 49.6 45.6 46.8 49.2 44.6L50.2 46C46.8 48.2 43.8 50.8 41.2 54.2Z" fill="url(#br-brbl)"/>
  <!-- daun tipis berurat -->
  <g transform="translate(21 73) rotate(-34) scale(.78)">
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" fill="url(#lf-brbl)" stroke="#15803D" stroke-width=".7" stroke-opacity=".5"/>
    <path d="M2-1C9.5-5.5 19.5-7.5 27.5-6" fill="none" stroke="#14532D" stroke-width="1" opacity=".35" stroke-linecap="round"/>
    <path d="M4 .8C10.5 5 18.5 4.6 25-.6C19 3.6 11 5.4 4 .8Z" fill="#14532D" opacity=".2"/>
    <path d="M3-2.2C9.5-8 18.5-9.6 26.5-6.4" fill="none" stroke="#D1FAE5" stroke-width="1.3" opacity=".45" stroke-linecap="round"/>
  </g>
  <g transform="translate(35 57) rotate(-58) scale(.6)">
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" fill="url(#lf-brbl)" stroke="#15803D" stroke-width=".9" stroke-opacity=".5"/>
    <path d="M2-1C9.5-5.5 19.5-7.5 27.5-6" fill="none" stroke="#14532D" stroke-width="1.1" opacity=".33" stroke-linecap="round"/>
    <path d="M3-2.2C9.5-8 18.5-9.6 26.5-6.4" fill="none" stroke="#D1FAE5" stroke-width="1.3" opacity=".45" stroke-linecap="round"/>
  </g>
  <!-- beri: bola bergradasi, kilau, kelopak buah -->
  <g transform="translate(58 38)">
    <circle r="6.6" fill="url(#bb-brbl)"/>
    <circle r="6.6" fill="none" stroke="#BE185D" stroke-width=".7" opacity=".4"/>
    <path d="M2.6 4.1C4.6 1.3 4.6-2.6 2.4-5.4C5.2-2.8 5.6 1.7 2.6 4.1Z" fill="#881337" opacity=".3"/>
    <ellipse cx="-2.4" cy="-3" rx="2" ry="1.4" transform="rotate(-38 -2.4 -3)" fill="#FDA4AF" opacity=".8"/>
    <circle cx="-2.8" cy="-3.3" r=".85" fill="#FFFFFF" opacity=".85"/>
    <path d="M0-6.6C-1.5-8.4-3.8-8.7-5.2-7.6C-3.4-8-1.1-7.8 0-6.6C1.1-7.8 3.4-8 5.2-7.6C3.8-8.7 1.5-8.4 0-6.6Z" fill="url(#lf-brbl)"/>
  </g>
  <g transform="translate(70 48)">
    <circle r="4.8" fill="url(#ab-brbl)"/>
    <circle r="4.8" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".5"/>
    <path d="M1.9 3C3.4 1 3.4-1.9 1.7-3.9C3.8-1.9 4 1.5 1.9 3Z" fill="#D97706" opacity=".28"/>
    <circle cx="-2" cy="-2.4" r=".7" fill="#FFFFFF" opacity=".85"/>
    <path d="M0-4.8C-1.1-6.3-2.9-6.6-4-5.7C-2.6-6-1-5.8 0-4.8C1-5.8 2.6-6 4-5.7C2.9-6.6 1.1-6.3 0-4.8Z" fill="url(#lf-brbl)"/>
  </g>
  <g transform="translate(49 50)">
    <circle r="4.2" fill="url(#bb-brbl)" opacity=".95"/>
    <circle cx="-1.8" cy="-2.2" r=".65" fill="#FFFFFF" opacity=".8"/>
    <path d="M0-4.2C-1-5.4-2.5-5.7-3.5-4.9C-2.4-5.2-1-5 0-4.2C1-5 2.4-5.2 3.5-4.9C2.5-5.7 1-5.4 0-4.2Z" fill="url(#lf-brbl)"/>
  </g>
  <!-- koin kecil timbul -->
  <g transform="translate(12 68)">
    <circle r="5" fill="#F59E0B"/>
    <circle r="4.5" fill="url(#ck-brbl)"/>
    <circle r="2.9" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M0 2.2L0-.6" stroke="#D97706" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M0-.4C-1-1.1-1.7-2.2-1.9-3.4C-.4-3 .3-1.9 0-.4Z" fill="#D97706" opacity=".85"/>
    <path d="M0-.4C1-1.1 1.7-2.2 1.9-3.4C.4-3-.3-1.9 0-.4Z" fill="#B45309" opacity=".85"/>
    <path d="M-3.8-1.9A4.3 4.3 0 0 1-.7-4.4" fill="none" stroke="#FFFBEB" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- percik -->
  <circle cx="82" cy="34" r="2.2" fill="#FB7185" opacity=".8"/>
  <circle cx="66" cy="57" r="2.4" fill="#A7F3D0" opacity=".85"/>
  <circle cx="78" cy="70" r="1.6" fill="#FDE68A" opacity=".7"/>
  <path d="M45 72l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z" fill="#FBBF24" opacity=".85"/>
</svg>
