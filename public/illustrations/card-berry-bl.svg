      <stop offset="0" stop-color="#FDF2F8" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ECFDF5" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bb-brbl" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#E11D48"/>
    </radialGradient>
  </defs>

  <rect width="110" height="100" fill="url(#w-brbl)"/>

  <!-- batang -->
