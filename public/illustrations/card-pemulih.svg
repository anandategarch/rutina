<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · PEMULIH — vektor semi-realistis: bulan sabit bergradasi dengan kawah, daun tertidur, dan debu malam -->
  <defs>
    <radialGradient id="w-pm" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#E0E7FF" stop-opacity=".48"/>
      <stop offset=".45" stop-color="#EEF2FF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mn-pm" x1=".1" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#E0E7FF"/>
      <stop offset=".5" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="lf-pm" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="st-pm" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset=".5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="cn-pm" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="dw-pm" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
  </defs>

  <!-- cuci malam teduh di sudut -->
  <rect width="180" height="170" fill="url(#w-pm)"/>

  <!-- tangkai malam: batang meruncing bergradasi indigo -->
  <path d="M57.4 1.2C95.8 3 132.2 18.8 155.6 45.2C164.2 54.8 170.6 62.6 174.7 70.5L177.3 73.7C170.9 65.8 163.5 57.5 154.2 47.6C133 22 96.2 5.7 56.8 3.4Z" fill="url(#st-pm)" opacity=".88"/>
  <path d="M58.4 2C96.6 3.8 132.6 19.6 156 46C164.6 55.6 170.8 63.2 174.6 70.6" fill="none" stroke="#E0E7FF" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
  <path d="M155 48.6C134.2 23.4 97.4 7 57.4 4.8" fill="none" stroke="#3730A3" stroke-width=".8" opacity=".3" stroke-linecap="round"/>

  <!-- bulan sabit besar: gradasi tiga lapis + kawah -->
  <g transform="translate(130 38)">
    <path d="M6 -24A26 26 0 1 0 16 16A20 20 0 0 1 6 -24Z" fill="url(#mn-pm)" stroke="#4338CA" stroke-width="1" stroke-linejoin="round"/>
    <path d="M10 -18A19 19 0 1 0 18 10A14.5 14.5 0 0 1 10 -18Z" fill="#C7D2FE" opacity=".45"/>
    <!-- rim cahaya sisi luar kiri-atas -->
    <path d="M2 -22A24 24 0 0 0 -8 -6" fill="none" stroke="#F5F3FF" stroke-width="1.4" opacity=".6" stroke-linecap="round"/>
    <!-- kawah kecil -->
    <circle cx="2" cy="-2" r="2.2" fill="#818CF8" opacity=".5"/>
    <circle cx="1.2" cy="-2.8" r=".7" fill="#E0E7FF" opacity=".6"/>
    <circle cx="14" cy="10" r="1.6" fill="#818CF8" opacity=".45"/>
    <circle cx="7" cy="6" r="1.2" fill="#818CF8" opacity=".4"/>
    <circle cx="8" cy="-14" r="1.4" fill="#E0E7FF" opacity=".5"/>
    <!-- kilau spekular -->
    <ellipse cx="0" cy="-12" rx="1.6" ry="2.6" fill="#F5F3FF" opacity=".5" transform="rotate(-24 0 -12)"/>
  </g>

  <!-- daun tertidur di ranting: mata terpejam, pulih -->
  <g transform="translate(84 22) rotate(-20)" stroke-linejoin="round">
    <path d="M0 0C-3 2 -5 4 -6 7" fill="none" stroke="url(#st-pm)" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
    <path d="M-6 7C-11 5 -17 6 -19 10C-17 15 -11 16 -6 14C-4.4 11.6 -4.8 9 -6 7Z" fill="url(#lf-pm)" stroke="#14532D" stroke-width=".95"/>
    <path d="M-6.6 7.6C-10 6.6 -14 6.8 -17.6 10.6" fill="none" stroke="#14532D" stroke-width=".9" opacity=".42" stroke-linecap="round"/>
    <path d="M-18.6 9.4C-16.6 6 -12.2 4.8 -7.6 6.2" fill="none" stroke="#D9F99D" stroke-width="1.1" opacity=".5" stroke-linecap="round"/>
    <!-- kelopak mata terpejam -->
    <path d="M-15 9c1.4 -1.4 3 -1.4 4.4 0M-11 11.4c1.2 -1 2.6 -1 3.8 0" stroke="#047857" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".75"/>
    <!-- embun malam berkilau -->
    <ellipse cx="-13" cy="13" rx="1.4" ry="1.9" fill="url(#dw-pm)" transform="rotate(-20 -13 13)"/>
    <circle cx="-13.7" cy="12.2" r=".5" fill="#FFFFFF" opacity=".85"/>
  </g>
  <g transform="translate(102 36) rotate(16) scale(.85)" stroke-linejoin="round">
    <path d="M0 0C2 3 4 5 5 8" fill="none" stroke="url(#st-pm)" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
    <path d="M5 8C10 6 16 7 18 11C16 16 10 17 5 15C3.4 12.6 3.8 10 5 8Z" fill="url(#lf-pm)" stroke="#14532D" stroke-width=".9" opacity=".96"/>
    <path d="M5.6 8.4C9 7.4 13 7.6 16.6 11.4" fill="none" stroke="#14532D" stroke-width=".9" opacity=".4" stroke-linecap="round"/>
  </g>

  <!-- debu malam melayang naik -->
  <g fill="#A5B4FC" opacity=".6">
    <circle cx="74" cy="40" r="1.4"/>
    <circle cx="80" cy="32" r="1.1"/>
    <circle cx="70" cy="48" r="1"/>
  </g>

  <!-- bintang kecil malam -->
  <g>
    <circle cx="60" cy="16" r="2.2" fill="#A5B4FC"/>
    <circle cx="59.2" cy="15.2" r=".8" fill="#E0E7FF" opacity=".8"/>
    <circle cx="120" cy="8" r="2.6" fill="#FBBF24"/>
    <circle cx="119.2" cy="7.2" r=".9" fill="#FEF3C7" opacity=".8"/>
    <circle cx="152" cy="66" r="2.2" fill="#818CF8"/>
    <path d="M166 30l1 2.6 2.6 1 -2.6 1 -1 2.6 -1 -2.6 -2.6 -1 2.6 -1z" fill="#FBBF24"/>
    <path d="M92 8l.8 2 2 .8 -2 .8 -.8 2 -.8 -2 -2 -.8 2 -.8z" fill="#FDE68A" opacity=".8"/>
  </g>

  <!-- koin amber: muka radial, cincin, kecambah timbul, kilau sabit -->
  <g>
    <circle cx="68" cy="8" r="5.6" fill="url(#cn-pm)" stroke="#F59E0B" stroke-width="1.1"/>
    <circle cx="68" cy="8" r="4.1" fill="none" stroke="#F59E0B" stroke-width=".6" opacity=".55"/>
    <path d="M68 11.2C68.2 10 68.8 9.1 69.9 8.7" fill="none" stroke="#B45309" stroke-width=".7" stroke-linecap="round" opacity=".9"/>
    <path d="M69.9 8.7C69.6 7.5 70.3 6.5 71.5 6.7C71.7 7.8 71 8.7 69.9 8.7Z" fill="#D97706" opacity=".9"/>
    <path d="M69.9 8.7C69.3 7.5 68.1 7.1 67.2 7.8C67.5 9 68.7 9.4 69.9 8.7Z" fill="#B45309" opacity=".9"/>
    <path d="M64.5 5.8a4.9 4.9 0 0 1 3.3 -2.3" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".75"/>
    <circle cx="65.5" cy="6" r=".7" fill="#FFFBEB" opacity=".85"/>
  </g>
</svg>
