<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · PEMULIH — bulan sabit berdaun: tidur & pemulihan yang
       menyiapkan tenaga baru (kartu Bugar: pemulihan harian) -->
  <defs>
    <radialGradient id="w-pm" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#E0E7FF" stop-opacity=".48"/>
      <stop offset=".45" stop-color="#EEF2FF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mn-pm" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="lf-pm" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- cuci malam teduh di sudut -->
  <rect width="180" height="170" fill="url(#w-pm)"/>

  <!-- tangkai utama melengkung ke sudut -->
  <path d="M58 2C96 4 132 20 156 46C165 56 172 64 177 74" fill="none" stroke="#4338CA" stroke-width="2.6" stroke-linecap="round" opacity=".7"/>

  <!-- bulan sabit besar di sudut -->
  <g transform="translate(130 38)">
    <path d="M6 -24A26 26 0 1 0 16 16A20 20 0 0 1 6 -24Z" fill="url(#mn-pm)" stroke="#4338CA" stroke-width="1" stroke-linejoin="round"/>
    <path d="M10 -18A19 19 0 1 0 18 10A14.5 14.5 0 0 1 10 -18Z" fill="#C7D2FE" opacity=".55"/>
    <circle cx="2" cy="-2" r="2.2" fill="#E0E7FF"/>
    <circle cx="14" cy="10" r="1.6" fill="#E0E7FF"/>
  </g>

  <!-- daun tertidur di ranting (mata tertutup = pulih) -->
  <g transform="translate(84 22) rotate(-20)">
    <path d="M0 0C-3 2 -5 4 -6 7" fill="none" stroke="#047857" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-6 7C-11 5 -17 6 -19 10C-17 15 -11 16 -6 14C-4.4 11.6 -4.8 9 -6 7Z" fill="url(#lf-pm)" stroke="#047857" stroke-width=".95" stroke-linejoin="round"/>
    <path d="M-15 9c1.4-1.4 3-1.4 4.4 0M-11 11.4c1.2-1 2.6-1 3.8 0" stroke="#047857" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".8"/>
  </g>
  <g transform="translate(102 36) rotate(16) scale(.85)">
    <path d="M0 0C2 3 4 5 5 8" fill="none" stroke="#047857" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M5 8C10 6 16 7 18 11C16 16 10 17 5 15C3.4 12.6 3.8 10 5 8Z" fill="url(#lf-pm)" stroke="#047857" stroke-width=".9" stroke-linejoin="round"/>
  </g>

  <!-- z-z kecil (tidur nyenyak) -->
  <g stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".85">
    <path d="M74 46h6l-6 5h6" transform="translate(0 -6)"/>
    <path d="M84 32h5l-5 4h5" transform="scale(.8) translate(4 -2)"/>
  </g>

  <!-- bintang kecil malam -->
  <g>
    <circle cx="60" cy="16" r="2.2" fill="#A5B4FC"/>
    <circle cx="120" cy="8" r="2.6" fill="#FBBF24"/>
    <circle cx="152" cy="66" r="2.2" fill="#818CF8"/>
    <path d="M166 30l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z" fill="#FBBF24"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="68" cy="8" r="5.6" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="68" cy="8" r="2.4" fill="#FDE68A"/>
</svg>
