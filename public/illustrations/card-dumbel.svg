<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · DUMBEL — vektor semi-realistis: batang baja metalik dengan piringan amber dan tunas bertumbuh -->
  <defs>
    <radialGradient id="w-dm" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#E2E8F0" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#F8FAFC" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sl-dm" x1=".2" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset=".5" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="pl-dm" x1=".2" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset=".5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="lf-dm" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="st-dm" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset=".5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="br-dm" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset=".5" stop-color="#B45309"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="cn-dm" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="dw-dm" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
  </defs>

  <!-- cuci perak lembut di sudut -->
  <rect width="180" height="170" fill="url(#w-dm)"/>

  <!-- ranting kayu meruncing bergradasi -->
  <path d="M57.4 1.2C95.8 3 132.2 18.8 155.6 45.2C164.2 54.8 170.6 62.6 174.7 70.5L177.3 73.7C170.9 65.8 163.5 57.5 154.2 47.6C133 22 96.2 5.7 56.8 3.4Z" fill="url(#br-dm)"/>
  <path d="M58.4 2C96.6 3.8 132.6 19.6 156 46C164.6 55.6 170.8 63.2 174.6 70.6" fill="none" stroke="#FCD34D" stroke-width=".8" opacity=".45" stroke-linecap="round"/>
  <path d="M155 48.6C134.2 23.4 97.4 7 57.4 4.8" fill="none" stroke="#571F05" stroke-width=".8" opacity=".3" stroke-linecap="round"/>

  <!-- barbel utama: batang baja + piringan amber + kilau spekular -->
  <g transform="translate(118 34) rotate(-24)" stroke-linejoin="round">
    <!-- batang baja metalik -->
    <rect x="-34" y="-2.6" width="68" height="5.2" rx="2.6" fill="url(#sl-dm)" stroke="#334155" stroke-width=".7"/>
    <path d="M-30 -1.2C-10 -1.8 10 -1.8 30 -1.2" fill="none" stroke="#F8FAFC" stroke-width="1.3" opacity=".6" stroke-linecap="round"/>
    <path d="M-30 2.2C-10 2.8 10 2.8 30 2.2" fill="none" stroke="#334155" stroke-width=".9" opacity=".5" stroke-linecap="round"/>
    <!-- piringan amber bergradasi -->
    <rect x="-30" y="-4.6" width="9" height="9.2" rx="3.4" fill="url(#pl-dm)" stroke="#92400E" stroke-width=".9"/>
    <rect x="-21" y="-6.8" width="8" height="13.6" rx="3.6" fill="url(#pl-dm)" stroke="#92400E" stroke-width=".9"/>
    <rect x="21" y="-6.8" width="8" height="13.6" rx="3.6" fill="url(#pl-dm)" stroke="#92400E" stroke-width=".9"/>
    <rect x="30" y="-4.6" width="9" height="9.2" rx="3.4" fill="url(#pl-dm)" stroke="#92400E" stroke-width=".9"/>
    <!-- kilau madu di sisi atas piringan -->
    <g fill="none" stroke="#FDE68A" stroke-width="1.1" opacity=".7" stroke-linecap="round">
      <path d="M-29.4 -3.8L-21.6 -3.8"/>
      <path d="M-20.6 -6L-13.4 -6"/>
      <path d="M13.4 -6L20.6 -6"/>
      <path d="M21.6 -3.8L29.4 -3.8"/>
    </g>
    <!-- bayang sisi bawah piringan -->
    <g fill="none" stroke="#78350F" stroke-width=".9" opacity=".4" stroke-linecap="round">
      <path d="M-29.4 4L-21.6 4"/>
      <path d="M-20.6 6.2L-13.4 6.2"/>
      <path d="M13.4 6.2L20.6 6.2"/>
      <path d="M21.6 4L29.4 4"/>
    </g>
    <!-- ring pematung slate -->
    <rect x="-16.6" y="-3.4" width="3" height="6.8" rx="1.5" fill="url(#sl-dm)" stroke="#334155" stroke-width=".5"/>
    <rect x="13.6" y="-3.4" width="3" height="6.8" rx="1.5" fill="url(#sl-dm)" stroke="#334155" stroke-width=".5"/>
    <!-- titik kilau ekor batang -->
    <circle cx="-34" cy="0" r=".8" fill="#F8FAFC" opacity=".7"/>
    <circle cx="34" cy="0" r=".8" fill="#F8FAFC" opacity=".7"/>
  </g>

  <!-- barbel mini kedua di ranting -->
  <g transform="translate(64 22) rotate(18) scale(.52)" stroke-linejoin="round">
    <rect x="-34" y="-2.6" width="68" height="5.2" rx="2.6" fill="url(#sl-dm)" stroke="#334155" stroke-width="1"/>
    <path d="M-26 -1C-8 -1.6 8 -1.6 26 -1" fill="none" stroke="#F8FAFC" stroke-width="1.6" opacity=".6" stroke-linecap="round"/>
    <rect x="-28" y="-5.6" width="8" height="11.2" rx="3.2" fill="url(#pl-dm)" stroke="#92400E" stroke-width="1.3"/>
    <rect x="20" y="-5.6" width="8" height="11.2" rx="3.2" fill="url(#pl-dm)" stroke="#92400E" stroke-width="1.3"/>
    <path d="M-27.4 -4.6L-20.6 -4.6M20.6 -4.6L27.4 -4.6" fill="none" stroke="#FDE68A" stroke-width="1.4" opacity=".7" stroke-linecap="round"/>
  </g>

  <!-- tunas menymbul dari ujung batang: kekuatan yang bertumbuh -->
  <g transform="translate(163 84) rotate(8)" stroke-linejoin="round">
    <path d="M0 0C-1 6 -2 10 -1 15" fill="none" stroke="url(#st-dm)" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M-1 15C-9 14 -14 8 -10 3C-3 4 0 9 -1 15Z" fill="url(#lf-dm)" stroke="#047857" stroke-width=".9"/>
    <path d="M-2.4 13.4C-6.4 12.4 -9.4 9.4 -9.6 6.4" fill="none" stroke="#14532D" stroke-width=".9" opacity=".45" stroke-linecap="round"/>
    <path d="M-9.4 4.6C-7.2 3.8 -4.6 4.6 -3.2 6.4" fill="none" stroke="#D9F99D" stroke-width="1.1" opacity=".55" stroke-linecap="round"/>
    <path d="M1 8C6 4 12 5 14 9C10 13 4 13 1 8Z" fill="url(#lf-dm)" stroke="#047857" stroke-width=".9" opacity=".95"/>
    <path d="M2 8.4C6 7 9.6 7.2 12.4 9.4" fill="none" stroke="#14532D" stroke-width=".9" opacity=".4" stroke-linecap="round"/>
    <ellipse cx="-7" cy="9.6" rx="1.5" ry="2" fill="url(#dw-dm)" transform="rotate(-24 -7 9.6)"/>
    <circle cx="-7.6" cy="8.8" r=".55" fill="#FFFFFF" opacity=".85"/>
  </g>

  <!-- koin amber: muka radial, cincin, kecambah timbul, kilau sabit -->
  <g>
    <circle cx="66" cy="34" r="6.4" fill="url(#cn-dm)" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="66" cy="34" r="4.7" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M66 37.6C66.2 36.2 67 35.2 68.3 34.8" fill="none" stroke="#B45309" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M68.3 34.8C68 33.4 68.8 32.2 70.1 32.4C70.3 33.7 69.5 34.8 68.3 34.8Z" fill="#D97706" opacity=".9"/>
    <path d="M68.3 34.8C67.6 33.4 66.2 33 65.2 33.8C65.6 35.1 67 35.6 68.3 34.8Z" fill="#B45309" opacity=".9"/>
    <path d="M62.2 31.2a5.6 5.6 0 0 1 3.8 -2.6" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    <circle cx="63.4" cy="31.4" r=".8" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- percik kekuatan: titik berkilau -->
  <g>
    <circle cx="102" cy="12" r="2.6" fill="#FBBF24"/>
    <circle cx="101.2" cy="11.2" r=".9" fill="#FEF3C7" opacity=".8"/>
    <circle cx="96" cy="52" r="2.2" fill="#94A3B8" opacity=".9"/>
    <circle cx="150" cy="6" r="2" fill="#86EFAC" opacity=".9"/>
    <circle cx="150.6" cy="5.4" r=".7" fill="#D9F99D" opacity=".8"/>
    <path d="M142 60l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1z" fill="#FBBF24" opacity=".9"/>
    <circle cx="128" cy="44" r="1.6" fill="#FDE68A" opacity=".7"/>
  </g>
</svg>
