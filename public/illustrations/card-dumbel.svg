<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · DUMBEL — barbel bertunas: kekuatan yang tumbuh pelan tiap
       set (kartu Bugar: latihan beban & buku beban) -->
  <defs>
    <radialGradient id="w-dm" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#E2E8F0" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#F8FAFC" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pl-dm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="sl-dm" x1="0" y1="0" x2=".1" y2="1">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lf-dm" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- cuci perak lembut di sudut -->
  <rect width="180" height="170" fill="url(#w-dm)"/>

  <!-- tangkai utama melengkung ke sudut -->
  <path d="M58 2C96 4 132 20 156 46C165 56 172 64 177 74" fill="none" stroke="#92400E" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>

  <!-- barbel utama mengapung di sudut — batang baja + sepasang piringan amber -->
  <g transform="translate(118 34) rotate(-24)">
    <rect x="-34" y="-2.6" width="68" height="5.2" rx="2.6" fill="url(#sl-dm)"/>
    <rect x="-30" y="-4.6" width="9" height="9.2" rx="3.4" fill="url(#pl-dm)" stroke="#92400E" stroke-width=".9"/>
    <rect x="-21" y="-6.8" width="8" height="13.6" rx="3.6" fill="url(#pl-dm)" stroke="#92400E" stroke-width=".9"/>
    <rect x="21" y="-6.8" width="8" height="13.6" rx="3.6" fill="url(#pl-dm)" stroke="#92400E" stroke-width=".9"/>
    <rect x="30" y="-4.6" width="9" height="9.2" rx="3.4" fill="url(#pl-dm)" stroke="#92400E" stroke-width=".9"/>
    <path d="M-27 -2h4M23 -2h4" stroke="#FFFFFF" stroke-width="1.6" opacity=".5" stroke-linecap="round"/>
  </g>

  <!-- barbel mini kedua, lebih jauh di ranting -->
  <g transform="translate(64 22) rotate(18) scale(.52)">
    <rect x="-34" y="-2.6" width="68" height="5.2" rx="2.6" fill="url(#sl-dm)"/>
    <rect x="-28" y="-5.6" width="8" height="11.2" rx="3.2" fill="url(#pl-dm)" stroke="#92400E" stroke-width="1.3"/>
    <rect x="20" y="-5.6" width="8" height="11.2" rx="3.2" fill="url(#pl-dm)" stroke="#92400E" stroke-width="1.3"/>
  </g>

  <!-- tunas menymbul dari ujung batang — kekuatan yang bertumbuh -->
  <g transform="translate(163 84) rotate(8)">
    <path d="M0 0C-1 6 -2 10 -1 15" fill="none" stroke="#047857" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M-1 15C-9 14 -14 8 -10 3C-3 4 0 9 -1 15Z" fill="url(#lf-dm)" stroke="#047857" stroke-width=".9" stroke-linejoin="round"/>
    <path d="M1 8C6 4 12 5 14 9C10 13 4 13 1 8Z" fill="#6EE7B7" stroke="#047857" stroke-width=".9" stroke-linejoin="round"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="66" cy="34" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="66" cy="34" r="2.6" fill="#FDE68A"/>

  <!-- percik kekuatan -->
  <g>
    <circle cx="102" cy="12" r="2.6" fill="#FBBF24"/>
    <circle cx="96" cy="52" r="2.2" fill="#94A3B8"/>
    <circle cx="150" cy="6" r="2" fill="#A7F3D0" opacity=".9"/>
    <path d="M142 60l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
