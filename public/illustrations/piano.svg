  <rect x="29" y="52" width="38" height="12" rx="2" fill="#FFFFFF"/>
  <rect x="29" y="52" width="38" height="12" rx="2" fill="url(#g-bghigh)"/>
  <path d="M38.5 52v12M48 52v12M57.5 52v12" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- tuts hitam -->
  <rect x="33" y="52" width="4.5" height="7.5" rx="1.5" fill="#0F172A"/>
  <rect x="42.5" y="52" width="4.5" height="7.5" rx="1.5" fill="#0F172A"/>
  <rect x="52" y="52" width="4.5" height="7.5" rx="1.5" fill="#0F172A"/>
