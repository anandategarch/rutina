  <path d="M31 33c1-5 5-8 9-8.5" stroke="#FFFFFF" stroke-width="2.5" opacity=".45" fill="none" stroke-linecap="round"/>
  <!-- tangan terbuka (sedekah) -->
  <path d="M30 66c2 6 8 10 15 11l10-4c2.5-1 3-4 1-5.5-1.5-1.2-4-1-6 0l-6 2.5" stroke="#FCD9B8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- L5 koin kebaikan (melayang bebas di kanan) -->
  <circle cx="76" cy="28" r="6" fill="url(#g-amb)" stroke="#B45309" stroke-width="1.8"/>
  <path d="M73.5 25.5a6 6 0 0 1 3.5-1.2" stroke="#FFFFFF" stroke-width="1.8" opacity=".6" fill="none" stroke-linecap="round"/>
  <circle cx="82" cy="42" r="3.5" fill="url(#g-amb)"/>
  <circle cx="24" cy="18" r="3" fill="#F59E0B"/>
  <!-- L6 bintang kilau -->
  <path d="M24 24l1.3 3.4 3.4 1.3-3.4 1.3L24 33.4l-1.3-3.4-3.4-1.3 3.4-1.3z" fill="#FBBF24"/>
