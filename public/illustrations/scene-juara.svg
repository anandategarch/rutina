<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" fill="none" role="img" aria-label="Ilustrasi perayaan juara: piala emas besar dengan pita di atas podium tiga tingkat bernomor satu, dua, dan tiga, dikelilingi konfeti warna-warni dan lampu sorot lembut">
  <defs>
    <linearGradient id="g-em" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g-em2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EE7B8"/><stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="g-amb2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Kilau radial putih untuk permukaan podium -->
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Kanvas dasar -->
  <rect width="480" height="320" fill="#F8FAFC"/>

  <!-- Blob latar besar beropacity rendah -->
  <circle cx="110" cy="60" r="120" fill="#E0F2FE" opacity=".5"/>
  <circle cx="400" cy="70" r="110" fill="#ECFDF5" opacity=".5"/>
  <circle cx="58" cy="240" r="90" fill="#D1FAE5" opacity=".45"/>
  <circle cx="430" cy="250" r="100" fill="#FEF3C7" opacity=".35"/>
  <circle cx="245" cy="36" r="130" fill="#FEF3C7" opacity=".45"/>

  <!-- Lantai: band emerald lembut dengan garis horizon halus -->
  <path d="M0 320v-70c90-12 180-16 270-8 70 6 140 6 210-4v82Z" fill="url(#g-em2)" opacity=".45"/>
  <path d="M0 320v-34c120-10 240-10 360-4 40 2 80 2 120-2v40Z" fill="url(#g-em)" opacity=".3"/>
  <path d="M0 250c90-12 180-16 270-8 70 6 140 6 210-4" stroke="#FFFFFF" stroke-width="2.5" opacity=".55"/>

  <!-- Lampu sorot lembut dari atas menuju podium -->
  <path d="M172 0L322 0 334 236 158 236Z" fill="#FEF3C7" opacity=".32"/>
  <path d="M212 0L280 0 298 232 192 232Z" fill="#FFFFFF" opacity=".2"/>
  <ellipse cx="245" cy="118" rx="66" ry="88" fill="#FEF3C7" opacity=".35"/>

  <!-- Bayangan podium di lantai -->
  <ellipse cx="245" cy="262" rx="172" ry="12" fill="#0F172A" opacity=".08"/>

  <!-- Podium tingkat 2 (kiri) -->
  <path d="M96 258v-44c0-5.5 4.5-10 10-10h74c5.5 0 10 4.5 10 10v44Z" fill="url(#g-em2)"/>
  <rect x="90" y="198" width="102" height="16" rx="8" fill="#FFFFFF"/>
  <rect x="90" y="198" width="102" height="16" rx="8" fill="url(#g-bghigh)"/>
  <path d="M130 224c0-8 5-13 12-13s12 5 12 11c0 6-4 9-9 13-5 4-10 9-15 17h27" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Podium tingkat 3 (kanan) -->
  <path d="M304 258v-32c0-5.5 4.5-10 10-10h70c5.5 0 10 4.5 10 10v32Z" fill="url(#g-em2)"/>
  <rect x="298" y="210" width="96" height="16" rx="8" fill="#FFFFFF"/>
  <rect x="298" y="210" width="96" height="16" rx="8" fill="url(#g-bghigh)"/>
  <path d="M336 229c1-5 5-9 11-9 6 0 11 4 11 9 0 5-3 8-7 9 4 1 8 5 8 9 0 6-5 10-12 10-5 0-9-2-11-5" stroke="#0F172A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Podium tingkat 1 (tengah, tertinggi) -->
  <path d="M190 258v-70c0-6.6 5.4-12 12-12h86c6.6 0 12 5.4 12 12v70Z" fill="url(#g-em)"/>
  <rect x="182" y="170" width="126" height="18" rx="9" fill="#FFFFFF"/>
  <rect x="182" y="170" width="126" height="18" rx="9" fill="url(#g-bghigh)"/>
  <path d="M240 202l9-6v38" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M202 192v26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".3"/>

  <!-- Piala juara: bayangan di permukaan podium -->
  <ellipse cx="245" cy="176" rx="34" ry="5" fill="#0F172A" opacity=".08"/>
  <!-- Pita oranye menjuntai dari dasar piala -->
  <path d="M236 164c-8 4-16 6-25 5l7 7-5 7c9 1 17-2 24-7z" fill="#F97316"/>
  <path d="M254 164c8 4 16 6 25 5l-7 7 5 7c-9 1-17-2-24-7z" fill="#F97316"/>
  <!-- Gagangan piala -->
  <path d="M211 100c-15 1-23 9-21 20 2 9 10 14 19 13" stroke="url(#g-amb2)" stroke-width="8" stroke-linecap="round"/>
  <path d="M279 100c15 1 23 9 21 20-2 9-10 14-19 13" stroke="url(#g-amb2)" stroke-width="8" stroke-linecap="round"/>
  <!-- Batang, badan, dan dasar piala -->
  <path d="M239 136h12v16h-12z" fill="url(#g-amb)"/>
  <path d="M211 96c3 26 13 42 34 46 21-4 31-20 34-46z" fill="url(#g-amb)"/>
  <rect x="230" y="150" width="30" height="9" rx="4.5" fill="url(#g-amb)"/>
  <rect x="224" y="159" width="42" height="11" rx="5.5" fill="url(#g-amb2)"/>
  <!-- Bibir piala dan mulut cangkir -->
  <ellipse cx="245" cy="96" rx="34" ry="7.5" fill="url(#g-amb2)"/>
  <ellipse cx="245" cy="96.5" rx="26" ry="5" fill="#D97706"/>
  <!-- Kilau putih pada piala -->
  <path d="M219 106c1 14 6 24 13 30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".45"/>
  <circle cx="223" cy="103" r="2" fill="#FFFFFF" opacity=".5"/>

  <!-- Konfeti persegi panjang kecil berwarna-warni -->
  <rect x="148" y="56" width="4.5" height="9" rx="1.5" fill="#10B981" transform="rotate(-25 150 60)"/>
  <rect x="328" y="48" width="4.5" height="8" rx="1.5" fill="#38BDF8" transform="rotate(30 330 52)"/>
  <rect x="108" y="118" width="5" height="9" rx="1.5" fill="#FCD34D" transform="rotate(20 110 122)"/>
  <rect x="378" y="128" width="4.5" height="8" rx="1.5" fill="#EC4899" transform="rotate(-15 380 132)"/>
  <rect x="73" y="168" width="4.5" height="8" rx="1.5" fill="#38BDF8" transform="rotate(-30 75 172)"/>
  <rect x="413" y="178" width="4.5" height="9" rx="1.5" fill="#10B981" transform="rotate(25 415 182)"/>
  <rect x="198" y="38" width="4.5" height="8" rx="1.5" fill="#10B981" transform="rotate(15 200 42)"/>
  <rect x="288" y="32" width="4.5" height="8" rx="1.5" fill="#38BDF8" transform="rotate(-20 290 36)"/>
  <rect x="58" y="88" width="4.5" height="8" rx="1.5" fill="#EC4899" transform="rotate(40 60 92)"/>
  <rect x="438" y="66" width="5" height="9" rx="1.5" fill="#FCD34D" transform="rotate(-30 440 70)"/>
  <rect x="126" y="184" width="4.5" height="8" rx="1.5" fill="#FCD34D" transform="rotate(15 128 188)"/>
  <rect x="398" y="196" width="4.5" height="8" rx="1.5" fill="#EC4899" transform="rotate(-20 400 200)"/>
  <rect x="150" y="268" width="5" height="8" rx="1.5" fill="#38BDF8" transform="rotate(12 152 272)"/>
  <rect x="348" y="270" width="5" height="8" rx="1.5" fill="#FCD34D" transform="rotate(-14 350 274)"/>

  <!-- Bintang kilau perayaan -->
  <path transform="translate(181 84) scale(1.05)" d="M0 -8L2 -2 8 0 2 2 0 8 -2 2 -8 0 -2 -2Z" fill="#FBBF24"/>
  <path transform="translate(314 96) scale(.85)" d="M0 -8L2 -2 8 0 2 2 0 8 -2 2 -8 0 -2 -2Z" fill="#FBBF24"/>
  <path transform="translate(245 50) scale(.7)" d="M0 -8L2 -2 8 0 2 2 0 8 -2 2 -8 0 -2 -2Z" fill="#FBBF24"/>
</svg>
