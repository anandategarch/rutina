<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · STROBERI — vektor semi-realistis: buah bergradasi dengan biji mengilap, kelopak berurat, dan bunga -->
  <defs>
    <radialGradient id="w-sb" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FEE2E2" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#FFF1F2" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFF1F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bd-sb" cx=".38" cy=".28" r="1">
      <stop offset="0" stop-color="#FDA4AF"/>
      <stop offset=".55" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#E11D48"/>
    </radialGradient>
    <radialGradient id="bd2-sb" cx=".38" cy=".28" r="1">
      <stop offset="0" stop-color="#FECDD3"/>
      <stop offset=".6" stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </radialGradient>
    <linearGradient id="lf-sb" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset=".5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="st-sb" x1=".1" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset=".5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="pw-sb" cx=".4" cy=".3" r="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".7" stop-color="#FFF1F2"/>
      <stop offset="1" stop-color="#FECDD3"/>
    </radialGradient>
    <radialGradient id="cn-sb" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <radialGradient id="dw-sb" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".55" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </radialGradient>
  </defs>

  <!-- cuci warna kebun stroberi di sudut -->
  <rect width="180" height="170" fill="url(#w-sb)"/>

  <!-- sulur utama: batang meruncing bergradasi -->
  <path d="M57.4 1.2C95.8 3 132.2 18.8 155.6 45.2C164.2 54.8 170.6 62.6 174.7 70.5L177.3 73.7C170.9 65.8 163.5 57.5 154.2 47.6C133 22 96.2 5.7 56.8 3.4Z" fill="url(#st-sb)"/>
  <path d="M58.4 2C96.6 3.8 132.6 19.6 156 46C164.6 55.6 170.8 63.2 174.6 70.6" fill="none" stroke="#BBF7D0" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
  <path d="M155 48.6C134.2 23.4 97.4 7 57.4 4.8" fill="none" stroke="#14532D" stroke-width=".8" opacity=".3" stroke-linecap="round"/>
  <!-- cabang penggantung buah -->
  <path d="M120 14C124.6 23.4 131.8 31.4 139.6 37.6" fill="none" stroke="url(#st-sb)" stroke-width="1.7" stroke-linecap="round" opacity=".85"/>
  <!-- embun di sulur -->
  <ellipse cx="126" cy="31" rx="1.8" ry="2.4" fill="url(#dw-sb)" transform="rotate(-24 126 31)"/>
  <circle cx="125.2" cy="30" r=".6" fill="#FFFFFF" opacity=".85"/>

  <!-- stroberi utama bergelayut di sulur -->
  <g transform="translate(144 64)">
    <path d="M0 -10C0 -10 -2 -12 -4 -11" fill="none" stroke="url(#st-sb)" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
    <!-- kelopak daun bergradasi dengan urat -->
    <g stroke-linejoin="round">
      <path d="M0 -8C-6 -12 -13 -11 -15 -6C-11 -2 -5 -2 0 -5Z" fill="url(#lf-sb)" stroke="#14532D" stroke-width=".8"/>
      <path d="M0 -8C6 -12 13 -11 15 -6C11 -2 5 -2 0 -5Z" fill="url(#lf-sb)" stroke="#14532D" stroke-width=".8"/>
      <path d="M-3 -7C-4 -12 -2 -16 0 -17C2 -16 4 -12 3 -7Z" fill="url(#lf-sb)" stroke="#14532D" stroke-width=".8"/>
      <g fill="none" stroke="#14532D" stroke-width=".55" opacity=".4" stroke-linecap="round">
        <path d="M-13.4 -6.4C-11 -4.4 -7.6 -3.6 -3.4 -4.4"/>
        <path d="M13.4 -6.4C11 -4.4 7.6 -3.6 3.4 -4.4"/>
        <path d="M0 -16C0 -13 0 -10 .6 -7"/>
      </g>
    </g>
    <!-- badan stroberi: gradasi + bayang inti + rim cahaya -->
    <path d="M-11 -5C-13 4 -9 16 0 21C9 16 13 4 11 -5C7 -9 -7 -9 -11 -5Z" fill="url(#bd-sb)" stroke="#BE123C" stroke-width="1" stroke-linejoin="round"/>
    <path d="M6.8 -6.4C10.4 1.6 8 12.4 1.4 19C7 12.8 8.8 3.2 6.8 -6.4Z" fill="#881337" opacity=".28"/>
    <path d="M-9.8 -3.6C-11 3.4 -8.6 11.4 -3.4 16.6C-8.4 11.6 -10.2 3.6 -8.6 -3.4Z" fill="#FECDD3" opacity=".5"/>
    <ellipse cx="-4.4" cy="-1.6" rx="1.8" ry="2.9" fill="#FFFFFF" opacity=".55" transform="rotate(-14 -4.4 -1.6)"/>
    <!-- biji stroberi dengan bayang tipis -->
    <g fill="#FDE68A">
      <circle cx="-5.6" cy="1" r="1.15"/><circle cx="0" cy="-1.4" r="1.15"/><circle cx="5.6" cy="1" r="1.15"/>
      <circle cx="-3" cy="7.4" r="1.05"/><circle cx="3" cy="7.4" r="1.05"/><circle cx="0" cy="12.6" r="1"/>
      <circle cx="-7.4" cy="-3.4" r=".95"/><circle cx="7.4" cy="-3.4" r=".95"/><circle cx="-4.8" cy="13.8" r=".85"/>
    </g>
    <g fill="#B45309" opacity=".3">
      <circle cx="-5.6" cy="1.8" r=".55"/><circle cx="0" cy="-.6" r=".55"/><circle cx="5.6" cy="1.8" r=".55"/>
      <circle cx="-3" cy="8.2" r=".5"/><circle cx="3" cy="8.2" r=".5"/><circle cx="0" cy="13.4" r=".5"/>
    </g>
  </g>

  <!-- bunga stroberi: lima lempeng putih bergradasi -->
  <g transform="translate(96 30) scale(.8)">
    <g fill="url(#pw-sb)" stroke="#FDA4AF" stroke-width="1.1">
      <ellipse rx="4.6" ry="7.4" transform="rotate(0) translate(0 -5.4)"/>
      <ellipse rx="4.6" ry="7.4" transform="rotate(72) translate(0 -5.4)"/>
      <ellipse rx="4.6" ry="7.4" transform="rotate(144) translate(0 -5.4)"/>
      <ellipse rx="4.6" ry="7.4" transform="rotate(216) translate(0 -5.4)"/>
      <ellipse rx="4.6" ry="7.4" transform="rotate(288) translate(0 -5.4)"/>
    </g>
    <circle r="2.6" fill="#F59E0B"/>
    <circle r="1.1" fill="#FDE68A"/>
    <circle cx="-1.4" cy="-.8" r=".45" fill="#FFFBEB" opacity=".8"/>
    <circle cx="5.8" cy="-6" r=".8" fill="#FDE68A" opacity=".7"/>
    <circle cx="-6.2" cy="-4.6" r=".7" fill="#FDE68A" opacity=".6"/>
  </g>

  <!-- stroberi muda sahabat -->
  <g transform="translate(163 100) scale(.55) rotate(-14)">
    <g fill="url(#lf-sb)" stroke="#14532D" stroke-width="1.2" stroke-linejoin="round">
      <path d="M0 -8C-6 -12 -13 -11 -15 -6C-11 -2 -5 -2 0 -5Z"/>
      <path d="M0 -8C6 -12 13 -11 15 -6C11 -2 5 -2 0 -5Z"/>
    </g>
    <path d="M-11 -5C-13 4 -9 16 0 21C9 16 13 4 11 -5C7 -9 -7 -9 -11 -5Z" fill="url(#bd2-sb)" stroke="#BE123C" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M6.8 -6.4C10.4 1.6 8 12.4 1.4 19C7 12.8 8.8 3.2 6.8 -6.4Z" fill="#881337" opacity=".24"/>
    <ellipse cx="-4" cy="-.4" rx="1.9" ry="3" fill="#FFFFFF" opacity=".45" transform="rotate(-14 -4 -.4)"/>
    <g fill="#FDE68A"><circle cx="-4" cy="1" r="1.4"/><circle cx="4" cy="1" r="1.4"/><circle cx="0" cy="8" r="1.3"/><circle cx="0" cy="-3" r="1.2"/></g>
  </g>

  <!-- koin amber: muka radial, cincin, kecambah timbul, kilau sabit -->
  <g>
    <circle cx="70" cy="14" r="6.4" fill="url(#cn-sb)" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="70" cy="14" r="4.7" fill="none" stroke="#F59E0B" stroke-width=".7" opacity=".55"/>
    <path d="M70 17.6C70.2 16.2 71 15.2 72.3 14.8" fill="none" stroke="#B45309" stroke-width=".8" stroke-linecap="round" opacity=".9"/>
    <path d="M72.3 14.8C72 13.4 72.8 12.2 74.1 12.4C74.3 13.7 73.5 14.8 72.3 14.8Z" fill="#D97706" opacity=".9"/>
    <path d="M72.3 14.8C71.6 13.4 70.2 13 69.2 13.8C69.6 15.1 71 15.6 72.3 14.8Z" fill="#B45309" opacity=".9"/>
    <path d="M66.2 11.2a5.6 5.6 0 0 1 3.8 -2.6" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
    <circle cx="67.4" cy="11.4" r=".8" fill="#FFFBEB" opacity=".85"/>
  </g>

  <!-- percik kebun: titik berkilau -->
  <g>
    <circle cx="170" cy="122" r="2.6" fill="#FBBF24"/>
    <circle cx="169.2" cy="121.2" r=".9" fill="#FEF3C7" opacity=".8"/>
    <circle cx="176" cy="112" r="2.2" fill="#FB7185" opacity=".9"/>
    <circle cx="163" cy="132" r="2" fill="#86EFAC" opacity=".9"/>
    <circle cx="163.6" cy="131.4" r=".7" fill="#D9F99D" opacity=".8"/>
    <path d="M92 50l1.1 2.9 2.9 1.1 -2.9 1.1 -1.1 2.9 -1.1 -2.9 -2.9 -1.1 2.9 -1.1z" fill="#FBBF24" opacity=".9"/>
    <circle cx="106" cy="66" r="1.6" fill="#FDE68A" opacity=".7"/>
  </g>
</svg>
