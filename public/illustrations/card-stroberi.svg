<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · STROBERI — buah manis dari kerapian harian: butir kecil yang
       terkumpul jadi manis (kartu kebiasaan: detail & kerapian) -->
  <defs>
    <radialGradient id="w-sb" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FEE2E2" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#FFF1F2" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFF1F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bd-sb" cx=".35" cy=".25" r="1">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#E11D48"/>
    </radialGradient>
  </defs>

  <!-- cuci warna kebun stroberi di sudut -->
  <rect width="180" height="170" fill="url(#w-sb)"/>

  <!-- sulur utama melengkung ke sudut -->
  <path d="M58 2C96 4 132 20 156 46C165 56 172 64 177 74" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" opacity=".92"/>
  <path d="M120 14C126 24 134 32 142 38" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>

  <!-- stroberi utama bergelayut di sulur -->
  <g transform="translate(144 64)">
    <path d="M0 -10C0 -10 -2 -12 -4 -11" fill="none" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
    <!-- mahkota daun -->
    <g fill="#A7F3D0" stroke="#059669" stroke-width=".9" stroke-linejoin="round">
      <path d="M0 -8C-6 -12 -13 -11 -15 -6C-11 -2 -5 -2 0 -5Z"/>
      <path d="M0 -8C6 -12 13 -11 15 -6C11 -2 5 -2 0 -5Z"/>
      <path d="M-3 -7C-4 -12 -2 -16 0 -17C2 -16 4 -12 3 -7Z"/>
    </g>
    <!-- badan stroberi (hati membulat) -->
    <path d="M-11 -5C-13 4 -9 16 0 21C9 16 13 4 11 -5C7 -9 -7 -9 -11 -5Z" fill="url(#bd-sb)" stroke="#BE123C" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- biji stroberi (percik amber) -->
    <g fill="#FDE68A" opacity=".95">
      <circle cx="-5.6" cy="1" r="1.15"/><circle cx="0" cy="-1.4" r="1.15"/><circle cx="5.6" cy="1" r="1.15"/>
      <circle cx="-3" cy="7.4" r="1.05"/><circle cx="3" cy="7.4" r="1.05"/><circle cx="0" cy="12.6" r="1"/>
      <circle cx="-7.4" cy="-3.4" r=".95"/><circle cx="7.4" cy="-3.4" r=".95"/>
    </g>
  </g>

  <!-- bunga stroberi kecil (5-lempeng putih) -->
  <g transform="translate(96 30) scale(.8)">
    <g fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1.1">
      <ellipse rx="4.6" ry="7.4" transform="rotate(0) translate(0 -5.4)"/>
      <ellipse rx="4.6" ry="7.4" transform="rotate(72) translate(0 -5.4)"/>
      <ellipse rx="4.6" ry="7.4" transform="rotate(144) translate(0 -5.4)"/>
      <ellipse rx="4.6" ry="7.4" transform="rotate(216) translate(0 -5.4)"/>
      <ellipse rx="4.6" ry="7.4" transform="rotate(288) translate(0 -5.4)"/>
    </g>
    <circle r="2.6" fill="#F59E0B"/>
    <circle r="1.1" fill="#FDE68A"/>
  </g>

  <!-- stroberi muda sahabat -->
  <g transform="translate(163 100) scale(.55) rotate(-14)">
    <g fill="#A7F3D0" stroke="#059669" stroke-width="1" stroke-linejoin="round">
      <path d="M0 -8C-6 -12 -13 -11 -15 -6C-11 -2 -5 -2 0 -5Z"/>
      <path d="M0 -8C6 -12 13 -11 15 -6C11 -2 5 -2 0 -5Z"/>
    </g>
    <path d="M-11 -5C-13 4 -9 16 0 21C9 16 13 4 11 -5C7 -9 -7 -9 -11 -5Z" fill="#FDA4AF" stroke="#BE123C" stroke-width="1.3" stroke-linejoin="round"/>
    <g fill="#FDE68A"><circle cx="-4" cy="1" r="1.4"/><circle cx="4" cy="1" r="1.4"/><circle cx="0" cy="8" r="1.3"/></g>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="70" cy="14" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="70" cy="14" r="2.6" fill="#FDE68A"/>

  <!-- percik -->
  <g>
    <circle cx="170" cy="122" r="2.6" fill="#FBBF24"/>
    <circle cx="176" cy="112" r="2.2" fill="#FB7185"/>
    <circle cx="163" cy="132" r="2" fill="#A7F3D0" opacity=".9"/>
    <path d="M92 50l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
