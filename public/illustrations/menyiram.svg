<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Menyiram tanaman">
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
    <linearGradient id="g-em2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7B8"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1: latar sky -->
  <circle cx="48" cy="48" r="46" fill="#E0F2FE"/>
  <circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2: bayangan tanah -->
  <ellipse cx="46" cy="79" rx="23" ry="3.4" fill="#0F172A" opacity=".07"/>
  <!-- L3: gembor -->
  <rect x="34" y="44" width="26" height="24" rx="5.5" fill="url(#g-sky)"/>
  <!-- corong -->
  <path d="M34 52L18 42l5-8 13 10z" fill="url(#g-sky)"/>
  <ellipse cx="20" cy="40" rx="3" ry="4.5" transform="rotate(33 20 40)" fill="#0284C7"/>
  <!-- pegangan atas -->
  <path d="M40 43a9 9 0 0 1 17 0" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- pegangan samping -->
  <path d="M60 52q9 4 0 12" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- L4: kilau badan -->
  <path d="M39 49v13" stroke="#FFFFFF" stroke-width="2.4" opacity=".45" stroke-linecap="round"/>
  <!-- L5: tetesan air -->
  <path d="M16 52q-2.5 3.5 0 5.5 2.5-2 0-5.5z" fill="#38BDF8"/>
  <path d="M21 60q-2.5 3.5 0 5.5 2.5-2 0-5.5z" fill="#38BDF8"/>
  <path d="M15 66q-2 3 0 5 2-2 0-5z" fill="#7DD3FC"/>
  <!-- tunas kecil -->
  <path d="M17 78v-6" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <path d="M17 74q-6-1.5-7-7 6.5-.5 7 7z" fill="url(#g-em2)"/>
  <path d="M17 73q6-1.5 7-7-6.5-.5-7 7z" fill="#6EE7B7"/>
  <!-- tanaman lain di kanan -->
  <path d="M74 78q-5-2-5-8 5 .5 5 8z" fill="url(#g-em2)"/>
  <path d="M72 78v-4" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
  <!-- L6: bintang kilau -->
  <path d="M72 30l1.2 3.2 3.2 1.2-3.2 1.2L72 38.8l-1.2-3.2-3.2-1.2 3.2-1.2z" fill="#FBBF24"/>
</svg>
