<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" fill="none" role="img" aria-label="Busur fase bulan dengan karangan daun dan mentari">
  <!-- Rutina · hero kalender — vektor semi-realistis: busur fase bulan ber-kawah, karangan daun berurat, dan tunas tengah -->
  <defs>
    <radialGradient id="hc-halo" cx=".5" cy=".45" r=".55">
      <stop offset="0" stop-color="#BBF7D0" stop-opacity=".38"/><stop offset=".45" stop-color="#D1FAE5" stop-opacity=".22"/><stop offset="1" stop-color="#D1FAE5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hc-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".5"/><stop offset=".5" stop-color="#FDE68A" stop-opacity=".18"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hc-moon" cx=".38" cy=".32" r="1">
      <stop offset="0" stop-color="#FFFBEB"/><stop offset=".35" stop-color="#FEF3C7"/><stop offset=".7" stop-color="#FDE68A"/><stop offset="1" stop-color="#FCD34D"/>
    </radialGradient>
    <radialGradient id="hc-pip" cx=".38" cy=".32" r="1">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".6" stop-color="#FDE68A"/><stop offset="1" stop-color="#FCD34D"/>
    </radialGradient>
    <linearGradient id="hc-leafA" x1=".15" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/><stop offset=".42" stop-color="#4ADE80"/><stop offset=".8" stop-color="#16A34A"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="hc-leafB" x1=".85" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/><stop offset=".42" stop-color="#34D399"/><stop offset=".8" stop-color="#15803D"/><stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="hc-petal" cx=".4" cy=".35" r="1">
      <stop offset="0" stop-color="#FECDD3"/><stop offset=".55" stop-color="#FDA4AF"/><stop offset="1" stop-color="#FDA4AF"/>
    </radialGradient>
    <radialGradient id="hc-soft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3E2723" stop-opacity=".3"/><stop offset=".62" stop-color="#3E2723" stop-opacity=".12"/><stop offset="1" stop-color="#3E2723" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hc-pebble" cx=".38" cy=".3" r="1">
      <stop offset="0" stop-color="#EBDDD0"/><stop offset=".5" stop-color="#C9A57E"/><stop offset="1" stop-color="#8A6642"/>
    </radialGradient>
  </defs>

  <!-- halo sage + mentari lembut -->
  <circle cx="150" cy="64" r="70" fill="url(#hc-halo)"/>
  <circle cx="150" cy="64" r="44" fill="url(#hc-glow)"/>

  <!-- busur fase bulan -->
  <g>
    <circle cx="88" cy="64" r="13" fill="url(#hc-pip)" opacity=".55"/>
    <path d="M88 51 C95 54 100 58 100 64 C100 70 95 74 88 77 C93 72 94 68 94 64 C94 60 93 56 88 51 Z" fill="#92400E" opacity=".45"/>
    <circle cx="81" cy="57" r="1" fill="#FFFFFF" opacity=".7"/>
    <circle cx="115" cy="64" r="11" fill="url(#hc-pip)" opacity=".8"/>
    <path d="M115 53 C121 55 126 59 126 64 C126 69 121 73 115 75 C119 71 120 67 120 64 C120 61 118 57 115 53 Z" fill="#B45309" opacity=".3"/>
    <circle cx="110" cy="58" r="1" fill="#FFFFFF" opacity=".8"/>
    <circle cx="150" cy="64" r="28" fill="url(#hc-moon)"/>
    <circle cx="150" cy="64" r="28" fill="none" stroke="#D97706" stroke-width="1.4" opacity=".4"/>
    <circle cx="142" cy="56" r="4.5" fill="#FCD34D" opacity=".35"/>
    <path d="M139 54 C140 52.5 142 52 144 52.5" stroke="#FEF3C7" stroke-width="1" fill="none" opacity=".5" stroke-linecap="round"/>
    <circle cx="158" cy="72" r="6" fill="#FCD34D" opacity=".3"/>
    <path d="M154.5 69.8 C155.5 68 157.5 67.4 159.5 68" stroke="#FEF3C7" stroke-width=".9" fill="none" opacity=".45" stroke-linecap="round"/>
    <circle cx="145" cy="74" r="3" fill="#FCD34D" opacity=".3"/>
    <path d="M150 36 C166 39 178 50 178 64 C178 78 166 89 150 92 C162 84 168 74 168 64 C168 54 162 44 150 36 Z" fill="#B45309" opacity=".3"/>
    <path d="M150 40 C146 46 144 54 144 64 C144 74 146 82 150 88" stroke="#B45309" stroke-width="2" fill="none" opacity=".35" stroke-linecap="round"/>
    <path d="M126 46 C131 39 140 35 149 35" stroke="#FFFBEB" stroke-width="3" fill="none" opacity=".65" stroke-linecap="round"/>
    <ellipse cx="136" cy="46" rx="5" ry="3" fill="#FFFFFF" opacity=".55"/>
    <circle cx="207" cy="64" r="11" fill="url(#hc-pip)" opacity=".8"/>
    <path d="M207 53 C201 55 196 59 196 64 C196 69 201 73 207 75 C203 71 202 67 202 64 C202 61 204 57 207 53 Z" fill="#B45309" opacity=".25"/>
    <circle cx="210" cy="58" r="1" fill="#FFFFFF" opacity=".8"/>
    <circle cx="236" cy="64" r="8" fill="url(#hc-pip)" opacity=".65"/>
    <path d="M236 56 C241 58 244 61 244 64 C244 67 241 70 236 72 C239 69 240 66 240 64 C240 61.5 238.5 58.5 236 56 Z" fill="#B45309" opacity=".4"/>
    <circle cx="233" cy="60" r=".9" fill="#FFFFFF" opacity=".7"/>
    <circle cx="256" cy="64" r="4.5" fill="url(#hc-pip)" opacity=".5"/>
    <circle cx="254.5" cy="62.5" r=".8" fill="#FFFFFF" opacity=".7"/>
  </g>

  <!-- karangan daun -->
  <g>
    <path d="M150 236 C120 228 102 206 104 178" stroke="#22C55E" stroke-width="3.5" fill="none" opacity=".95" stroke-linecap="round"/>
    <path d="M151 232 C124 224 108 204 106 182" stroke="#14532D" stroke-width="1.1" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M150 236 C180 228 198 206 196 178" stroke="#34D399" stroke-width="3.5" fill="none" opacity=".95" stroke-linecap="round"/>
    <path d="M149 232 C176 224 192 204 194 182" stroke="#14532D" stroke-width="1.1" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M112 210 C95 211 85 200 88 188 C101 185 110 196 112 210 Z" fill="url(#hc-leafA)"/>
    <path d="M110 206 C102 200 95 192 91 188" stroke="#14532D" stroke-width="1.3" fill="none" opacity=".45" stroke-linecap="round"/>
    <path d="M108 204 C102 199 97 193 93 189" stroke="#D9F99D" stroke-width="1.6" fill="none" opacity=".45" stroke-linecap="round"/>
    <path d="M104 178 C89 175 81 165 84 154 C96 152 104 163 104 178 Z" fill="url(#hc-leafB)"/>
    <path d="M102 174 C96 168 90 160 87 155" stroke="#14532D" stroke-width="1.2" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M188 210 C205 211 215 200 212 188 C199 185 190 196 188 210 Z" fill="url(#hc-leafA)"/>
    <path d="M190 206 C198 200 205 192 209 188" stroke="#14532D" stroke-width="1.3" fill="none" opacity=".45" stroke-linecap="round"/>
    <path d="M196 178 C211 175 219 165 216 154 C204 152 196 163 196 178 Z" fill="url(#hc-leafB)"/>
    <path d="M198 174 C204 168 210 160 213 155" stroke="#14532D" stroke-width="1.2" fill="none" opacity=".4" stroke-linecap="round"/>
    <g transform="translate(104 196)">
      <g fill="url(#hc-petal)">
        <ellipse rx="3.2" ry="4.6" transform="rotate(0) translate(0 -3.6)"/>
        <ellipse rx="3.2" ry="4.6" transform="rotate(72) translate(0 -3.6)"/>
        <ellipse rx="3.2" ry="4.6" transform="rotate(144) translate(0 -3.6)"/>
        <ellipse rx="3.2" ry="4.6" transform="rotate(216) translate(0 -3.6)"/>
        <ellipse rx="3.2" ry="4.6" transform="rotate(288) translate(0 -3.6)"/>
      </g>
      <circle r="1.7" fill="#92400E"/>
    </g>
    <g transform="translate(196 196) scale(.9)">
      <g fill="url(#hc-petal)">
        <ellipse rx="3.2" ry="4.6" transform="rotate(36) translate(0 -3.6)"/>
        <ellipse rx="3.2" ry="4.6" transform="rotate(108) translate(0 -3.6)"/>
        <ellipse rx="3.2" ry="4.6" transform="rotate(180) translate(0 -3.6)"/>
        <ellipse rx="3.2" ry="4.6" transform="rotate(252) translate(0 -3.6)"/>
        <ellipse rx="3.2" ry="4.6" transform="rotate(324) translate(0 -3.6)"/>
      </g>
      <circle r="1.6" fill="#92400E"/>
    </g>
  </g>

  <!-- tunas tengah -->
  <g>
    <path d="M150 232 C150 220 150 208 150 194" stroke="#22C55E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M151 228 C151 216 151 206 151 200" stroke="#14532D" stroke-width="1.2" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M150 212 C137 211 131 202 134 193 C143 195 149 202 150 212 Z" fill="url(#hc-leafA)"/>
    <path d="M148 208 C142 204 137 198 134 194" stroke="#14532D" stroke-width="1.2" fill="none" opacity=".45" stroke-linecap="round"/>
    <ellipse cx="140" cy="199" rx="1.9" ry="2.6" fill="#BBF7D0" opacity=".7"/>
    <circle cx="139.4" cy="198" r=".7" fill="#FFFFFF" opacity=".8"/>
    <path d="M151 200 C152 190 158 185 165 187 C164 194 159 199 151 200 Z" fill="url(#hc-leafB)"/>
    <path d="M153 197 C157 193 161 189 164 188" stroke="#14532D" stroke-width="1" fill="none" opacity=".4" stroke-linecap="round"/>
  </g>

  <!-- dasar berumput -->
  <ellipse cx="150" cy="246" rx="58" ry="7" fill="url(#hc-soft)"/>
  <g stroke-linecap="round" fill="none">
    <path d="M120 244 C117 235 120 228 126 222" stroke="#4ADE80" stroke-width="2.4" opacity=".85"/>
    <path d="M130 246 C128 238 130 232 136 227" stroke="#22C55E" stroke-width="2" opacity=".8"/>
    <path d="M178 245 C181 236 178 229 172 223" stroke="#4ADE80" stroke-width="2.4" opacity=".85"/>
    <path d="M186 246 C184 238 186 232 180 227" stroke="#22C55E" stroke-width="2" opacity=".8"/>
  </g>
  <ellipse cx="126" cy="242" rx="6" ry="4" fill="url(#hc-pebble)"/>
  <ellipse cx="123.8" cy="240.4" rx="1.7" ry="1" fill="#FFF7ED" opacity=".55"/>
  <ellipse cx="182" cy="243" rx="4.5" ry="3" fill="url(#hc-pebble)" opacity=".9"/>
  <g fill="#431407" opacity=".3">
    <circle cx="150" cy="250" r="1.2"/><circle cx="166" cy="248" r="1"/>
  </g>

  <!-- serbuk sari & kilau -->
  <path d="M236 130 l2.2 6.8 6.8 2.2 -6.8 2.2 -2.2 6.8 -2.2 -6.8 -6.8 -2.2 6.8 -2.2 Z" fill="#FDE68A" opacity=".85"/>
  <circle cx="64" cy="150" r="4" fill="#FDE68A" opacity=".75"/>
  <circle cx="62.8" cy="148.8" r="1" fill="#FFFFFF" opacity=".75"/>
</svg>
