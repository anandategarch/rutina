  <circle cx="68.6" cy="27.8" r="1.4" fill="#FFFFFF"/>
  <circle cx="79" cy="67" r="2.8" fill="#38BDF8"/>
  <!-- L6: kilau bintang -->
  <path d="M25 21l1.1 3 3 1.1-3 1.1-1.1 3-1.1-3-3-1.1 3-1.1z" fill="#FBBF24"/>
