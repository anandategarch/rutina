<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Lonceng pengingat dengan titik notifikasi">
  <!-- Definisi gradien lokal -->
  <defs>
    <linearGradient id="g-amb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="g-amb2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- L1: latar lingkaran amber -->
  <circle cx="48" cy="48" r="46" fill="#FEF3C7"/>
  <circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2: bayangan tanah -->
  <ellipse cx="48" cy="80" rx="20" ry="3.2" fill="#0F172A" opacity=".07"/>
  <!-- L3: subjek utama, lonceng dengan bibir melebar dan pemukul -->
  <circle cx="48" cy="24.5" r="4" fill="url(#g-amb)"/>
  <path d="M48 27c-8.8 0-14.9 6-15.7 14-.5 6-2.2 12.6-5.5 18.2-1.2 2.1-.6 4.3 2 4.3h38.4c2.6 0 3.2-2.2 2-4.3-3.3-5.6-5-12.2-5.5-18.2C62.9 33 56.8 27 48 27z" fill="url(#g-amb2)"/>
  <rect x="23.5" y="61.5" width="49" height="7" rx="3.5" fill="url(#g-amb)"/>
  <circle cx="48" cy="73.5" r="4.5" fill="#D97706"/>
  <!-- L4: kilau kubah dan lengkung getar putih -->
  <path d="M40.5 32.5c-3.4 1.8-5.7 5-6.3 8.8" stroke="#FFFFFF" stroke-width="2.4" opacity=".55" stroke-linecap="round"/>
  <path d="M20.5 42c-2.7 4.6-2.7 10.4 0 15" stroke="#FFFFFF" stroke-width="2.5" opacity=".5" stroke-linecap="round"/>
  <path d="M75.5 42c2.7 4.6 2.7 10.4 0 15" stroke="#FFFFFF" stroke-width="2.5" opacity=".5" stroke-linecap="round"/>
