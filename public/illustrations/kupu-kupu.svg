  <path d="M51 52c9-2 20 2 22 10 1.5 7-6 11-12 8-5-2.6-9-9-10-18z" fill="url(#g-em)"/>
  <!-- L4 bintik sayap -->
  <circle cx="26" cy="32" r="4" fill="#FFFFFF" opacity=".85"/>
  <circle cx="70" cy="32" r="4" fill="#FFFFFF" opacity=".85"/>
