<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>Lebah — produktif setiap hari</title>
  <defs>
    <linearGradient id="g-amb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <radialGradient id="g-bghigh" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- L1 latar tema amber -->
  <circle cx="48" cy="48" r="46" fill="#FEF3C7"/><circle cx="48" cy="48" r="46" fill="url(#g-bghigh)"/>
  <!-- L2 bayangan tanah -->
  <ellipse cx="48" cy="78" rx="18" ry="3.5" fill="#0F172A" opacity=".07"/>
  <!-- jalur terbang -->
  <path d="M12 60C22 66 30 50 40 54s16 10 26 2" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray=".1 7" fill="none" opacity=".8"/>
  <!-- L3 badan lebah -->
  <ellipse cx="48" cy="52" rx="15" ry="12" fill="url(#g-amb2)"/>
  <path d="M44 41.5a15 12 0 0 0-10 5" stroke="#FFFFFF" stroke-width="2" opacity=".5" fill="none" stroke-linecap="round"/>
  <!-- garis belang -->
  <path d="M42 42.5c-2.5 6-2.5 13 0 19M48 41c-1 7-1 14 0 21.5M54 42.5c2.5 6 2.5 13 0 19" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- kepala & antena -->
  <circle cx="31" cy="52" r="7.5" fill="#1E293B"/>
  <circle cx="28.5" cy="50" r="1.8" fill="#FFFFFF"/>
  <path d="M28 45c-2-4-5-5.5-8-5.5M26 47c-3-2.5-6-3-9-2.5" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- sengat -->
  <path d="M63 52l5 0" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- L4 sayap -->
  <ellipse cx="53" cy="34" rx="6.5" ry="10.5" fill="#FFFFFF" opacity=".9" transform="rotate(28 53 34)"/>
  <ellipse cx="40" cy="33" rx="6" ry="10" fill="#E0F2FE" opacity=".9" transform="rotate(-24 40 33)"/>
  <!-- L5 serbuk sari -->
  <circle cx="22" cy="34" r="2.5" fill="#FBBF24"/><circle cx="78" cy="44" r="2.5" fill="#FBBF24"/><circle cx="72" cy="68" r="2" fill="#FB923C"/>
  <!-- L6 bintang kilau -->
  <path d="M24 20l1.2 3 3 1.2-3 1.2L24 28.4l-1.2-3-3-1.2 3-1.2z" fill="#F59E0B"/>
</svg>
