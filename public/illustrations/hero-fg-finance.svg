<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" fill="none" role="img" aria-label="Tumpukan koin keemasan dengan tunas yang bertumbuh">
  <!-- v2.16 · lapisan depan hero Keuangan (ph-scene) — elemen mengapung yang
       tetap berayun (sceneBob) & bergeser mengikuti pointer (parallax px py).
       Warna koin & tunas ditebalkan garisnya agar terbaca di kartu terang. -->
  <defs>
    <linearGradient id="fgf-coin" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F8E2A4"/><stop offset="1" stop-color="#DBA63E"/>
    </linearGradient>
    <linearGradient id="fgf-sprout" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A8C58B"/><stop offset="1" stop-color="#5C895E"/>
    </linearGradient>
    <radialGradient id="fgf-glow" cx="0" cy="0" r="1">
      <stop stop-color="#FEF3C7" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- lapisan udara hangat di belakang tumpukan -->
  <circle cx="252" cy="128" r="104" fill="url(#fgf-glow)"/>

  <!-- bayangan lembut di lereng -->
  <ellipse cx="248" cy="216" rx="86" ry="14" fill="#4E8A68" opacity=".18"/>

  <!-- tunas di atas koin -->
  <g>
    <path d="M252 126V78" stroke="#5F9A75" stroke-width="5" stroke-linecap="round"/>
    <path d="M251 100c-17-2-24-14-15-24 14 1 21 13 15 24Z" fill="url(#fgf-sprout)"/>
    <path d="M253 86c3-12 14-18 23-10-2 11-11 17-23 10Z" fill="#A8C58B"/>
  </g>

  <!-- koin bertumpuk -->
  <g>
    <circle cx="252" cy="152" r="31" fill="url(#fgf-coin)" stroke="#B9853B" stroke-width="3.4"/>
    <circle cx="252" cy="152" r="20" fill="none" stroke="#B9853B" stroke-width="2.6" opacity=".7"/>
    <path d="M244 143c-4 4 3 10 8 6" stroke="#8A6530" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>
    <circle cx="236" cy="184" r="26" fill="url(#fgf-coin)" stroke="#B9853B" stroke-width="3.2"/>
    <circle cx="236" cy="184" r="16" fill="none" stroke="#B9853B" stroke-width="2.4" opacity=".65"/>
    <circle cx="274" cy="190" r="23" fill="url(#fgf-coin)" stroke="#B9853B" stroke-width="3"/>
    <circle cx="274" cy="190" r="14" fill="none" stroke="#B9853B" stroke-width="2.2" opacity=".6"/>
    <path d="M268 184c-3-3 2-8 6-5" stroke="#8A6530" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- koin miring berdiri -->
  <g>
    <ellipse cx="322" cy="200" rx="10" ry="4" fill="#4E8A68" opacity=".14"/>
    <circle cx="322" cy="172" r="17" fill="url(#fgf-coin)" stroke="#B9853B" stroke-width="2.8"/>
    <circle cx="322" cy="172" r="10" fill="none" stroke="#B9853B" stroke-width="2" opacity=".6"/>
  </g>

  <!-- daun botani yang berputar lembut -->
  <g>
    <path d="M96 92c-14-2-19-12-11-19 11 1 16 10 11 19Z" fill="#8FD3A5" opacity=".85"/>
    <path d="M120 168c12-6 22-1 22 9-9 6-19 3-22-9Z" fill="#A7DBB7" opacity=".8"/>
  </g>

  <!-- kunang-kunang emas -->
  <g fill="#E9BE63">
    <path d="M354 106l2.4 7.6 7.6 2.4-7.6 2.4-2.4 7.6-2.4-7.6-7.6-2.4 7.6-2.4Z"/>
    <path d="M152 138l1.8 5.8 5.8 1.8-5.8 1.8-1.8 5.8-1.8-5.8-5.8-1.8 5.8-1.8Z" opacity=".8"/>
    <circle cx="196" cy="72" r="4.6" opacity=".6"/>
    <circle cx="378" cy="216" r="4" opacity=".5"/>
    <circle cx="112" cy="216" r="3.6" opacity=".45"/>
  </g>
</svg>
