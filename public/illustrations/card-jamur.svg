<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · JAMUR — vektor semi-realistis: rumpung jamur bertudung bergradasi, insang halus, tangkai bercincin -->
  <defs>
    <radialGradient id="w-jm" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FEF3C7" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#F0FDF4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#F0FDF4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cap-jm" cx=".34" cy=".28" r="1">
      <stop offset="0" stop-color="#FDE68A"/><stop offset=".55" stop-color="#FBBF24"/><stop offset="1" stop-color="#D97706"/>
    </radialGradient>
    <radialGradient id="cap2-jm" cx=".34" cy=".28" r="1">
      <stop offset="0" stop-color="#FCD34D"/><stop offset=".55" stop-color="#F59E0B"/><stop offset="1" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="st-jm" x1=".25" y1="0" x2=".75" y2=".4">
      <stop offset="0" stop-color="#FEFCEC"/><stop offset=".55" stop-color="#FDF6E3"/><stop offset="1" stop-color="#E7D8B1"/>
    </linearGradient>
    <linearGradient id="gr-jm" x1=".1" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="lf-jm" x1=".05" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="ck-jm" cx=".4" cy=".35" r=".85">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
  </defs>
  <!-- cuci warna hutan lembap di sudut -->
  <rect width="180" height="170" fill="url(#w-jm)"/>
  <!-- helai rumput utama: pita meruncing bergradasi -->
