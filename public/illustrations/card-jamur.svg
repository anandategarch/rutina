    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" fill="url(#lf-jm)" stroke="#15803D" stroke-width=".8" stroke-opacity=".5"/>
    <path d="M2-1C9.5-5.5 19.5-7.5 27.5-6" fill="none" stroke="#14532D" stroke-width="1.2" opacity=".38" stroke-linecap="round"/>
