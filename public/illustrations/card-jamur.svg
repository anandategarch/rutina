    <path d="M12-6C19-8 25-13 27-19C27-11 21-5 12-6Z" fill="#92400E" opacity=".25"/>
    <path d="M-22-10C-22-25 -10-33.4 0-33.4" fill="none" stroke="#FFFBEB" stroke-width="2.2" stroke-linecap="round" opacity=".6"/>
    <g fill="none" stroke="#B45309" stroke-width=".8" opacity=".42" stroke-linecap="round">
