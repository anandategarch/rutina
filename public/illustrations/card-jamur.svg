      <circle cx="9" cy="-26" r="2.6" fill="#FB923C" opacity=".7"/>
      <circle cx="8.2" cy="-26.8" r=".9" fill="#FED7AA" opacity=".7"/>
      <circle cx="17" cy="-14" r="2.2" fill="#FB923C" opacity=".7"/>
      <circle cx="16.3" cy="-14.7" r=".8" fill="#FED7AA" opacity=".7"/>
