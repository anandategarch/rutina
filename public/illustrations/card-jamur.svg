    <path d="M-30-8C-30-26 -12-38 0-38C12-38 30-26 30-8C18-2 -18-2 -30-8Z" fill="url(#cap-jm)" stroke="#D97706" stroke-width="1.4" stroke-opacity=".5"/>
    <path d="M-20-13C-20-23 -9-31 0-31" fill="none" stroke="#FFFBEB" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
