    <path d="M-21-11C-21-24 -10-32.6 0-32.6" fill="none" stroke="#FFFBEB" stroke-width="1.8" stroke-linecap="round" opacity=".5"/>
    <g fill="none" stroke="#B45309" stroke-width=".9" opacity=".4" stroke-linecap="round">
