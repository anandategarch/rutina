    <path d="M2 .5C3.6 10 3 22 1 32C4.4 22 4.8 10 2 .5Z" fill="#B45309" opacity=".18"/>
    <ellipse cx="0" cy="9" rx="4.6" ry="1.4" fill="#FDF6E3" stroke="#E7D8B1" stroke-width=".6"/>
