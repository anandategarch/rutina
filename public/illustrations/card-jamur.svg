  <g>
    <circle cx="170" cy="98" r="2.8" fill="#FB923C" opacity=".85"/>
    <circle cx="176" cy="88" r="2.2" fill="#FBBF24" opacity=".85"/>
    <circle cx="162" cy="112" r="2" fill="#A7F3D0" opacity=".9"/>
    <circle cx="106" cy="40" r="2" fill="#A7F3D0" opacity=".85"/>
    <circle cx="88" cy="52" r="1.6" fill="#FDE68A" opacity=".7"/>
    <circle cx="150" cy="30" r="1.4" fill="#FDE68A" opacity=".6"/>
    <path d="M112 58l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1z" fill="#FBBF24" opacity=".9"/>
  </g>
</svg>
