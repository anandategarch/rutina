<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" preserveAspectRatio="xMaxYMin meet">
  <!-- Rutina · JAMUR — rumpung kecil di humus: gagasan kecil yang tumbuh diam-diam (kartu tips / saran) -->
  <defs>
    <radialGradient id="w-jm" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#FEF3C7" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#F0FDF4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#F0FDF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap-jm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- cuci warna hutan lembap di sudut -->
  <rect width="180" height="170" fill="url(#w-jm)"/>

  <!-- rumpungan jamur condong ke sudut -->
  <g>
    <!-- jamur besar -->
    <g transform="translate(139 78)">
      <path d="M-5 0C-5 14 -3 26 0 34C3 26 5 14 5 0Z" fill="#FDF6E3" stroke="#E7D8B1" stroke-width="1.1"/>
      <path d="M-30-8C-30-26 -12-38 0-38C12-38 30-26 30-8C18-2 -18-2 -30-8Z" fill="url(#cap-jm)" stroke="#EA580C" stroke-width="1.2"/>
      <path d="M-22-9C-22-24 -10-33 0-33" fill="none" stroke="#FDE68A" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
      <g fill="#FB923C" opacity=".75">
        <circle cx="-12" cy="-22" r="3.2"/>
        <circle cx="9" cy="-26" r="2.6"/>
        <circle cx="17" cy="-14" r="2.2"/>
      </g>
    </g>
    <!-- jamur sedang -->
    <g transform="translate(96 92) scale(.66) rotate(-10)">
      <path d="M-5 0C-5 14 -3 26 0 34C3 26 5 14 5 0Z" fill="#FDF6E3" stroke="#E7D8B1" stroke-width="1.1"/>
      <path d="M-30-8C-30-26 -12-38 0-38C12-38 30-26 30-8C18-2 -18-2 -30-8Z" fill="#FDBA74" stroke="#EA580C" stroke-width="1.2"/>
      <circle cx="-11" cy="-21" r="2.8" fill="#FB923C" opacity=".7"/>
      <circle cx="8" cy="-24" r="2.2" fill="#FB923C" opacity=".7"/>
    </g>
    <!-- tombol muda -->
    <g transform="translate(120 58) scale(.38) rotate(8)">
      <path d="M-5 0C-5 14 -3 26 0 34C3 26 5 14 5 0Z" fill="#FDF6E3" stroke="#E7D8B1" stroke-width="1.1"/>
      <path d="M-30-8C-30-26 -12-38 0-38C12-38 30-26 30-8C18-2 -18-2 -30-8Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.2"/>
    </g>
  </g>

  <!-- helai rumput mint mengikuti sudut -->
  <g fill="none" stroke="#34D399" stroke-linecap="round">
    <path d="M60 2C88 8 116 22 138 44" stroke-width="2.4" opacity=".85"/>
    <path d="M168 40C170 52 172 64 172 78" stroke-width="1.8" opacity=".7"/>
    <path d="M176 56C177 66 177 76 176 86" stroke-width="1.5" opacity=".6"/>
    <path d="M84 6C104 14 122 30 136 50" stroke-width="1.4" opacity=".5"/>
  </g>

  <!-- daun kecil -->
  <g stroke-linejoin="round">
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(64 12) rotate(-18) scale(.6)" fill="#A7F3D0"/>
    <path d="M0 0C7-9 20-11 30-4C23 6 8 7 0 0Z" transform="translate(160 36) rotate(-52) scale(.48)" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  </g>

  <!-- koin amber (gema ilustrasi hero) -->
  <circle cx="72" cy="26" r="6.2" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="72" cy="26" r="2.6" fill="#FDE68A"/>

  <!-- spora & percik -->
  <g>
    <circle cx="170" cy="98" r="2.8" fill="#FB923C"/>
    <circle cx="176" cy="88" r="2.2" fill="#FBBF24"/>
    <circle cx="162" cy="112" r="2" fill="#A7F3D0" opacity=".9"/>
    <circle cx="106" cy="40" r="2" fill="#A7F3D0" opacity=".8"/>
    <path d="M112 58l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#FBBF24"/>
  </g>
</svg>
