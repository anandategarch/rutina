  <path d="M61.6 3.2C88 9 114 22.6 135 42.6" fill="none" stroke="#A7F3D0" stroke-width=".9" opacity=".4" stroke-linecap="round"/>
  <!-- rumput lain: goresan bergradasi -->
  <g fill="none" stroke-linecap="round">
    <path d="M168 40C170 52 172 64 172 78" stroke="url(#gr-jm)" stroke-width="2.4" opacity=".7"/>
    <path d="M176 56C177 66 177 76 176 86" stroke="url(#gr-jm)" stroke-width="1.8" opacity=".55"/>
    <path d="M84 6C104 14 122 30 136 50" stroke="url(#gr-jm)" stroke-width="1.6" opacity=".45"/>
  </g>
